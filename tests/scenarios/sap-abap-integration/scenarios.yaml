      - '(?i)CALL\s+FUNCTION\s+''[^'']+''\s+DESTINATION\b(?!(?:''[^''\n]*''|"[^\n]*|\n\*[^\n]*|[^.''"])*?\bcommunication_failure\b)(?:''[^''\n]*''|"[^\n]*|\n\*[^\n]*|[^.''"])*\.'
