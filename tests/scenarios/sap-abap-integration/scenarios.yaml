  - name: idoc_inbound_function_ehp7_basis740_sp08
    description: Inbound IDoc function module with SAP's standard interface, status records 53 and 51, E and A checks, the IN_UPDATE_TASK flag, and no commit, in syntax valid for ECC 6.0 EHP7 on SAP_BASIS 7.40 SP08.
    prompt: |
      A partner system sends our own message type ZFA_ORDER (basic type ZFA_ORDER01) to our
      ECC 6.0 EHP7 system (SAP_BASIS 7.40 SP08). Segment Z1FA_ORDER_HDR has ORDER_ID,
      CUSTOMER, ORDER_DATE, CURRENCY, and EXT_REF; segment Z1FA_ORDER_ITM has MATERIAL,
      QUANTITY, and UNIT. Write the inbound function module that posts each IDoc with our
      function module Z_FA_ORDER_CREATE and reports the result in the IDoc status.
      Z_FA_ORDER_CREATE takes IS_HEADER (structure ZFA_S_ORDER_HEADER with CUSTOMER,
      ORDER_DATE, CURRENCY, EXT_REF) and the table IT_ITEMS (ZFA_S_ORDER_ITEM with MATERIAL,
      QUANTITY, UNIT), returns EV_ORDER_ID and a RETURN table of BAPIRET2, saves through the
      update task, and does not commit. Also tell me how to register the function module.
    environment:
      product: ecc
      release: ehp7
      support_package: 8
      database: anydb
      deployment: on-premise
    expected_patterns:
      - '(?i)FUNCTION\s+z\w+'
      - '(?i)\bidoc_contrl\b'
      - '(?i)\bidoc_status\b'
      - '(?i)\breturn_variables\b'
      # Literals, or the constants of SAP's include MBDCONWF when the answer includes it.
      - '''53''|^[ \t]*(?:INCLUDE|include)\s+(?:MBDCONWF|mbdconwf)\s*\.'
      - '''51''|^[ \t]*(?:INCLUDE|include)\s+(?:MBDCONWF|mbdconwf)\s*\.'
      - '99999|^[ \t]*(?:INCLUDE|include)\s+(?:MBDCONWF|mbdconwf)\s*\.'
      - 'Processed_IDOCs|^[ \t]*(?:INCLUDE|include)\s+(?:MBDCONWF|mbdconwf)\s*\.'
      - 'Error_IDOCs|^[ \t]*(?:INCLUDE|include)\s+(?:MBDCONWF|mbdconwf)\s*\.'
      - '(?i)\bwrong_function_called\b'
      - '(?i)(type\s*(=|EQ)\s*''A''|\bCA\s*''(EA|AE)''|WHEN\s+''[EA]''\s+OR\s+''[EA]'')'
      - '(?i)\bin_update_task\s*=\s*(?:''X''|abap_true)'
      - '(?i)\bWE42\b'
      - '(?i)\bWE20\b'
    forbidden_patterns:
      - '(?i)^[ \t]*COMMIT\s+WORK\b'
      - '(?i)^[ \t]*CALL\s+FUNCTION\s+''BAPI_TRANSACTION_COMMIT'''
    tags: [idoc, ale, ecc, release-aware]
    validators: [abaplint]
    mock_response: |
      Target assumed: SAP ECC 6.0 EHP7 on SAP_BASIS 7.40 SP08. The IDoc inbound interface is
      the same on every release, and the function module uses classic syntax, so it also runs
      on older systems.

      The function module does not commit. The ALE layer commits after it has written the
      status records the function returns, so the order and the IDoc status are saved
      together, and a failed IDoc leaves nothing behind because Z_FA_ORDER_CREATE registers
      nothing when it reports an error. Per IDoc it returns status 53 (posted) or 51 (not
      posted, with the message from RETURN). Both E and A in RETURN mean failure.
      WORKFLOW_RESULT is 0 when all IDocs were posted and 99999 when one failed, which starts
      the error workflow. RETURN_VARIABLES gets Processed_IDOCs and Appl_Objects for posted
      IDocs and Error_IDOCs for failed ones; the names are case-sensitive. IN_UPDATE_TASK is X
      because Z_FA_ORDER_CREATE posts through the update task.

      Segment fields arrive as characters. A partner that sends a quantity such as 10,5 would
      make the move into the typed quantity field raise CX_SY_CONVERSION_NO_NUMBER, so the move
      is wrapped in TRY and such an IDoc gets status 51 instead of a short dump. If an EDI
      partner sends ISO codes for units or currencies, convert them first, for example with
      UNIT_OF_MEASURE_ISO_TO_SAP; check its interface in SE37.

      ```abap
      * file: src/zfa_order_idoc.fugr.z_fa_idoc_input_order.abap
      FUNCTION z_fa_idoc_input_order.
      *"----------------------------------------------------------------------
      *"*"Local Interface:
      *"  IMPORTING
      *"     VALUE(INPUT_METHOD) LIKE  BDWFAP_PAR-INPUTMETHD
      *"     VALUE(MASS_PROCESSING) LIKE  BDWFAP_PAR-MASS_PROC
      *"  EXPORTING
      *"     VALUE(WORKFLOW_RESULT) LIKE  BDWF_PARAM-RESULT
      *"     VALUE(APPLICATION_VARIABLE) LIKE  BDWF_PARAM-APPL_VAR
      *"     VALUE(IN_UPDATE_TASK) LIKE  BDWFAP_PAR-UPDATETASK
      *"     VALUE(CALL_TRANSACTION_DONE) LIKE  BDWFAP_PAR-CALLTRANS
      *"  TABLES
      *"      IDOC_CONTRL STRUCTURE  EDIDC
      *"      IDOC_DATA STRUCTURE  EDIDD
      *"      IDOC_STATUS STRUCTURE  BDIDOCSTAT
      *"      RETURN_VARIABLES STRUCTURE  BDWFRETVAR
      *"      SERIALIZATION_INFO STRUCTURE  BDI_SER
      *"  EXCEPTIONS
      *"      WRONG_FUNCTION_CALLED
      *"----------------------------------------------------------------------
      * Inbound processing for message type ZFA_ORDER. Registered in WE57 (basic
      * type ZFA_ORDER01, direction 2), BD51 (input type), WE42 (process code
      * ZFA_ORDER), and WE20 (inbound parameter of the sending partner).
        CONSTANTS: lc_posted     TYPE bdidocstat-status VALUE '53',
                   lc_not_posted TYPE bdidocstat-status VALUE '51',
                   lc_result_ok  TYPE bdwf_param-result VALUE '0',
                   lc_result_err TYPE bdwf_param-result VALUE '99999'.

        DATA: ls_control TYPE edidc,
              ls_data    TYPE edidd,
              ls_status  TYPE bdidocstat,
              ls_retvar  TYPE bdwfretvar,
              ls_hdr_seg TYPE z1fa_order_hdr,
              ls_itm_seg TYPE z1fa_order_itm,
              ls_header  TYPE zfa_s_order_header,
              ls_item    TYPE zfa_s_order_item,
              lt_items   TYPE STANDARD TABLE OF zfa_s_order_item,
              lt_return  TYPE STANDARD TABLE OF bapiret2,
              ls_return  TYPE bapiret2,
              ls_error   TYPE bapiret2,
              lv_order   TYPE zfa_order_id,
              lv_failed  TYPE c LENGTH 1.

        CLEAR: application_variable, call_transaction_done.
        workflow_result = lc_result_ok.
      * Z_FA_ORDER_CREATE saves through the update task.
        in_update_task = 'X'.

        LOOP AT idoc_contrl INTO ls_control.
          IF ls_control-mestyp <> 'ZFA_ORDER'.
            RAISE wrong_function_called.
          ENDIF.

          CLEAR: ls_header, lt_items, lt_return, ls_error, lv_order, lv_failed.
          LOOP AT idoc_data INTO ls_data WHERE docnum = ls_control-docnum.
            CASE ls_data-segnam.
              WHEN 'Z1FA_ORDER_HDR'.
                ls_hdr_seg = ls_data-sdata.
                ls_header-customer   = ls_hdr_seg-customer.
                ls_header-order_date = ls_hdr_seg-order_date.
                ls_header-currency   = ls_hdr_seg-currency.
                ls_header-ext_ref    = ls_hdr_seg-ext_ref.
              WHEN 'Z1FA_ORDER_ITM'.
                ls_itm_seg = ls_data-sdata.
                CLEAR ls_item.
                ls_item-material = ls_itm_seg-material.
                ls_item-unit     = ls_itm_seg-unit.
                TRY.
      *             Segment fields are characters: '10,5' is not a number for ABAP.
                    ls_item-quantity = ls_itm_seg-quantity.
                  CATCH cx_sy_conversion_error.
                    IF lv_failed IS INITIAL.
                      lv_failed           = 'X'.
                      ls_error-type       = 'E'.
                      ls_error-id         = 'ZFA_ORDER'.
                      ls_error-number     = '020'.
                      ls_error-message_v1 = ls_itm_seg-quantity.
                    ENDIF.
                ENDTRY.
                APPEND ls_item TO lt_items.
            ENDCASE.
          ENDLOOP.

          IF lv_failed IS INITIAL.
            CALL FUNCTION 'Z_FA_ORDER_CREATE'
              EXPORTING
                is_header   = ls_header
              IMPORTING
                ev_order_id = lv_order
              TABLES
                it_items    = lt_items
                return      = lt_return.

            LOOP AT lt_return INTO ls_return WHERE type = 'E' OR type = 'A'.
              lv_failed = 'X'.
              ls_error = ls_return.
              EXIT.
            ENDLOOP.
          ENDIF.

          CLEAR: ls_status, ls_retvar.
          ls_status-docnum = ls_control-docnum.
          ls_retvar-doc_number = ls_control-docnum.
          IF lv_failed = 'X'.
            ls_status-status = lc_not_posted.
            ls_status-msgty  = ls_error-type.
            ls_status-msgid  = ls_error-id.
            ls_status-msgno  = ls_error-number.
            ls_status-msgv1  = ls_error-message_v1.
            ls_status-msgv2  = ls_error-message_v2.
            ls_status-msgv3  = ls_error-message_v3.
            ls_status-msgv4  = ls_error-message_v4.
            APPEND ls_status TO idoc_status.
            workflow_result = lc_result_err.
            ls_retvar-wf_param = 'Error_IDOCs'.
            APPEND ls_retvar TO return_variables.
          ELSE.
            ls_status-status = lc_posted.
            ls_status-msgty  = 'S'.
            ls_status-msgid  = 'ZFA_ORDER'.
            ls_status-msgno  = '010'.
            ls_status-msgv1  = lv_order.
            APPEND ls_status TO idoc_status.
            ls_retvar-wf_param = 'Processed_IDOCs'.
            APPEND ls_retvar TO return_variables.
            CLEAR ls_retvar.
            ls_retvar-wf_param   = 'Appl_Objects'.
            ls_retvar-doc_number = lv_order.
            APPEND ls_retvar TO return_variables.
          ENDIF.
        ENDLOOP.
      ENDFUNCTION.
      ```

      Create the function module in its own function group in SE37 with exactly this
      interface; the ALE layer calls it by name with these parameters. In message class
      ZFA_ORDER, message 010 should read "Order &1 created" and message 020 "Quantity &1 is
      not a valid number".

      Register it:

      1. WE57: enter Z_FA_IDOC_INPUT_ORDER with type F (function module), basic type
         ZFA_ORDER01, message type ZFA_ORDER, and direction 2 (inbound). Object type takes
         the BOR object type of the application object, if there is one.
      2. BD51: maintain the input type of the function module and whether dialog is allowed.
      3. WE42: create the inbound process code ZFA_ORDER with "Processing with ALE" and
         "Processing by function module", and assign the function module.
      4. WE20: in the partner profile of the sending logical system (partner type LS), add an
         inbound parameter for ZFA_ORDER with process code ZFA_ORDER. "Trigger immediately"
         posts on arrival; "Trigger by background program" leaves the IDocs in status 64 for
         report RBDAPP01.
      5. Test with WE19, then check the result in WE02 or WE05. Reprocess failed IDocs (status
         51) in BD87 after fixing the cause.

      Not verified offline: the function module interface, which SE37 keeps outside the
      source, activation, and a test with a real IDoc. The syntax check here covers only the
      statements of the body.
    negative_responses:
      - name: commit_inside_inbound_function
        reason: The function module commits by itself, so the order is saved before the ALE layer writes the IDoc status, and order and status can drift apart.
        caught_by: forbidden_pattern
        response: |
          Register the function module in WE57, BD51, WE42, and WE20.

          * file: src/zfa_order_idoc.fugr.z_fa_idoc_input_order.abap
          FUNCTION z_fa_idoc_input_order.
            DATA: ls_control TYPE edidc,
                  ls_data    TYPE edidd,
                  ls_status  TYPE bdidocstat,
                  ls_retvar  TYPE bdwfretvar,
                  ls_hdr_seg TYPE z1fa_order_hdr,
                  ls_header  TYPE zfa_s_order_header,
                  lt_items   TYPE STANDARD TABLE OF zfa_s_order_item,
                  lt_return  TYPE STANDARD TABLE OF bapiret2,
                  ls_return  TYPE bapiret2,
