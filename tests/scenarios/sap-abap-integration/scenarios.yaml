  - name: bapi_function_module_ehp4
    description: BAPI-style remote-enabled function module that reports errors in RETURN, saves through the update task, and never commits, in classic syntax for SAP_BASIS 7.01.
    prompt: |
      Our ECC 6.0 EHP4 system (SAP_BASIS 7.01, SAP MaxDB) needs a remote-enabled function
      module Z_FA_ORDER_CREATE in function group ZFA_ORDER_API that creates an order in our
      tables ZFA_ORDER (ORDER_ID, CUSTOMER, ORDER_DATE, CURRENCY, EXT_REF) and ZFA_ORDER_ITEM
      (ORDER_ID, ITEM_NO, MATERIAL, QUANTITY, UNIT). Other SAP systems will call it by RFC,
      our own programs and our IDoc inbound processing call it locally. Input: IS_HEADER
      (structure ZFA_S_ORDER_HEADER with CUSTOMER, ORDER_DATE, CURRENCY, EXT_REF) and the
      table IT_ITEMS (ZFA_S_ORDER_ITEM with MATERIAL, QUANTITY, UNIT); output: EV_ORDER_ID
      (data element ZFA_ORDER_ID). Order numbers come from number range object ZFA_ORDER,
      interval 01. Messages are in message class ZFA_ORDER, and authorization object ZFA_ORDER
      has the field ACTVT. Write it so that the callers stay in control of the transaction.
    environment:
      product: ecc
      release: ehp4
      database: anydb
      deployment: on-premise
    expected_patterns:
      - '(?i)FUNCTION\s+z_fa_order_create\b'
      - '(?i)\breturn\b[^\n]*\bbapiret2'
      - '(?i)CALL\s+FUNCTION\s+''[^'']+''\s+IN\s+UPDATE\s+TASK'
      - '(?i)AUTHORITY-CHECK\s+OBJECT\s+''ZFA_ORDER'''
      - '(?i)^[ \t]*MESSAGE\s+(?:[ewsiax]\d{3}\(\w+\)|ID\b)[^.]*\bINTO\b'
      - '(?i)\btestrun\b'
      - '(?i)\bNUMBER_GET_NEXT\b'
    forbidden_patterns:
      - '(?i)^[ \t]*COMMIT\s+WORK\b'
      - '(?i)^[ \t]*CALL\s+FUNCTION\s+''BAPI_TRANSACTION_COMMIT'''
      - '(?i)^[ \t]*(?:CALL\s+TRANSACTION|SUBMIT)\b'
      # Type E only: an update module may end with a termination message (type A).
      - '(?i)^[ \t]*MESSAGE\s+(?:e\d{3}\(\w+\)|ID\s+\S+\s+TYPE\s+''E'')(?!(?:''[^''\n]*''|"[^\n]*|\n\*[^\n]*|[^.''"])*?\bINTO\b)'
    tags: [bapi, rfc, commit, ecc, release-aware]
    validators: [abaplint]
    mock_response: |
      Target assumed: SAP ECC 6.0 EHP4, SAP_BASIS 7.01, SAP MaxDB. The code uses classic
      syntax and 'X' instead of abap_true, because on 7.01 the constants of type pool ABAP need
      TYPE-POOLS abap.

      Set the attribute "Remote-Enabled Module" in SE37 and maintain the interface shown in
      the comment block. The rules the function follows, from SAP's BAPI programming guide:

      - It never commits and calls no transaction or report. The order is written by the
        update module Z_FA_ORDER_SAVE, which runs only when the caller commits, so a caller
        can post several documents in one LUW or roll everything back. An RFC call ends with a
        database commit in the called system, which is another reason to write only through
        the update task.
      - Every error goes into RETURN (BAPIRET2). MESSAGE ... INTO fills the text without
        sending a message, because a message of type E or A would end an RFC call with
        SYSTEM_FAILURE. The interface declares no class-based exceptions, which cannot cross
        RFC in customer releases.
      - It checks the authorization itself; S_RFC only decides who may call the function
        group.
      - IV_TESTRUN runs all checks, writes nothing, and draws no order number.
      - All parameters are passed by value, and RFC does not check their typing, so the
        function validates its input.

      ```abap
      * file: src/zfa_order_api.fugr.z_fa_order_create.abap
      FUNCTION z_fa_order_create.
      *"----------------------------------------------------------------------
      *"*"Local Interface:
      *"  IMPORTING
      *"     VALUE(IS_HEADER) TYPE  ZFA_S_ORDER_HEADER
      *"     VALUE(IV_TESTRUN) TYPE  TESTRUN DEFAULT SPACE
      *"  EXPORTING
      *"     VALUE(EV_ORDER_ID) TYPE  ZFA_ORDER_ID
      *"  TABLES
      *"      IT_ITEMS STRUCTURE  ZFA_S_ORDER_ITEM
      *"      RETURN STRUCTURE  BAPIRET2
      *"----------------------------------------------------------------------
        DATA lv_text TYPE bapi_msg.
        DATA lv_lines TYPE i.
        DATA lv_order_id TYPE zfa_order_id.

        CLEAR ev_order_id.
        CLEAR return[].

        AUTHORITY-CHECK OBJECT 'ZFA_ORDER'
          ID 'ACTVT' FIELD '01'.
        IF sy-subrc <> 0.
          MESSAGE e001(zfa_order) INTO lv_text.
          PERFORM append_message TABLES return.
          RETURN.
        ENDIF.

      * Validate everything first and report all errors together.
        IF is_header-customer IS INITIAL.
          MESSAGE e002(zfa_order) INTO lv_text.
          PERFORM append_message TABLES return.
        ENDIF.
        DESCRIBE TABLE it_items LINES lv_lines.
        IF lv_lines = 0.
          MESSAGE e003(zfa_order) INTO lv_text.
          PERFORM append_message TABLES return.
        ENDIF.
        READ TABLE return TRANSPORTING NO FIELDS WITH KEY type = 'E'.
        IF sy-subrc = 0.
          RETURN.
        ENDIF.

        IF iv_testrun = 'X'.
          MESSAGE s004(zfa_order) INTO lv_text.
          PERFORM append_message TABLES return.
          RETURN.
        ENDIF.

        CALL FUNCTION 'NUMBER_GET_NEXT'
          EXPORTING
            nr_range_nr = '01'
            object      = 'ZFA_ORDER'
          IMPORTING
            number      = lv_order_id
          EXCEPTIONS
            OTHERS      = 1.
        IF sy-subrc <> 0.
          MESSAGE e005(zfa_order) INTO lv_text.
          PERFORM append_message TABLES return.
          RETURN.
        ENDIF.

      * Registered now, executed when the caller commits.
        CALL FUNCTION 'Z_FA_ORDER_SAVE' IN UPDATE TASK
          EXPORTING
            iv_order_id = lv_order_id
            is_header   = is_header
          TABLES
            it_items    = it_items.

        ev_order_id = lv_order_id.
        MESSAGE s010(zfa_order) WITH lv_order_id INTO lv_text.
        PERFORM append_message TABLES return.
      ENDFUNCTION.
      ```

      The helper that turns the current message into a RETURN line, in an include of the
      same function group:

      ```abap
      * file: src/zfa_order_api.fugr.lzfa_order_apif01.abap
      *----------------------------------------------------------------------*
      * Append the current system message to RETURN. Call it directly after
      * MESSAGE ... INTO, which fills sy-msgty, sy-msgid, sy-msgno, sy-msgv1-4.
      *----------------------------------------------------------------------*
      FORM append_message TABLES pt_return STRUCTURE bapiret2.
        DATA ls_return TYPE bapiret2.

        ls_return-type       = sy-msgty.
        ls_return-id         = sy-msgid.
        ls_return-number     = sy-msgno.
        ls_return-message_v1 = sy-msgv1.
        ls_return-message_v2 = sy-msgv2.
        ls_return-message_v3 = sy-msgv3.
        ls_return-message_v4 = sy-msgv4.
        MESSAGE ID sy-msgid TYPE sy-msgty NUMBER sy-msgno
                WITH sy-msgv1 sy-msgv2 sy-msgv3 sy-msgv4
                INTO ls_return-message.
        APPEND ls_return TO pt_return.
      ENDFORM.
      ```

      The update module (SE37, processing type Update Module, start immediately). It runs in
      the update task after the caller's commit; a termination message there rolls back the
      whole update, so no half-saved order remains:

      ```abap
      * file: src/zfa_order_api.fugr.z_fa_order_save.abap
      FUNCTION z_fa_order_save.
      *"----------------------------------------------------------------------
      *"*"Local Interface:
      *"  IMPORTING
      *"     VALUE(IV_ORDER_ID) TYPE  ZFA_ORDER_ID
      *"     VALUE(IS_HEADER) TYPE  ZFA_S_ORDER_HEADER
      *"  TABLES
      *"      IT_ITEMS STRUCTURE  ZFA_S_ORDER_ITEM
      *"----------------------------------------------------------------------
        DATA ls_order TYPE zfa_order.
        DATA ls_item TYPE zfa_s_order_item.
        DATA ls_db_item TYPE zfa_order_item.
        DATA lt_db_items TYPE STANDARD TABLE OF zfa_order_item WITH DEFAULT KEY.
        DATA lv_item_no TYPE i.

        MOVE-CORRESPONDING is_header TO ls_order.
        ls_order-order_id = iv_order_id.
        LOOP AT it_items INTO ls_item.
          lv_item_no = lv_item_no + 1.
          CLEAR ls_db_item.
          MOVE-CORRESPONDING ls_item TO ls_db_item.
          ls_db_item-order_id = iv_order_id.
          ls_db_item-item_no  = lv_item_no.
          APPEND ls_db_item TO lt_db_items.
        ENDLOOP.

        INSERT zfa_order FROM ls_order.
        IF sy-subrc <> 0.
          MESSAGE a398(00) WITH 'Order' iv_order_id 'already exists'.
        ENDIF.
        INSERT zfa_order_item FROM TABLE lt_db_items.
      ENDFUNCTION.
      ```

      Callers check RETURN for type E or A and then call BAPI_TRANSACTION_COMMIT or
      BAPI_TRANSACTION_ROLLBACK; remote callers do so through the same destination. Create
      messages 001 to 005 and 010 in message class ZFA_ORDER, and give RFC users S_RFC for
      function group ZFA_ORDER_API.

      Not verified offline: the interface, which SE37 keeps outside the source, activation,
      and the field names of ZFA_ORDER and ZFA_ORDER_ITEM.
    negative_responses:
      - name: commit_in_function_module
        reason: The function module commits by itself, so its callers lose control of the LUW and cannot roll back or combine calls.
        caught_by: forbidden_pattern
        response: |
          * file: src/zfa_order_api.fugr.z_fa_order_create.abap
          FUNCTION z_fa_order_create.
          *"----------------------------------------------------------------------
          *"*"Local Interface:
          *"  IMPORTING
          *"     VALUE(IS_HEADER) TYPE  ZFA_S_ORDER_HEADER
          *"     VALUE(IV_TESTRUN) TYPE  TESTRUN DEFAULT SPACE
          *"  EXPORTING
          *"     VALUE(EV_ORDER_ID) TYPE  ZFA_ORDER_ID
          *"  TABLES
          *"      IT_ITEMS STRUCTURE  ZFA_S_ORDER_ITEM
          *"      RETURN STRUCTURE  BAPIRET2
          *"----------------------------------------------------------------------
            DATA lv_text TYPE bapi_msg.
            DATA ls_return TYPE bapiret2.
            DATA lv_order_id TYPE zfa_order_id.

            AUTHORITY-CHECK OBJECT 'ZFA_ORDER'
              ID 'ACTVT' FIELD '01'.
            IF sy-subrc <> 0.
              MESSAGE e001(zfa_order) INTO lv_text.
              ls_return-type    = sy-msgty.
              ls_return-id      = sy-msgid.
              ls_return-number  = sy-msgno.
              ls_return-message = lv_text.
              APPEND ls_return TO return.
              RETURN.
            ENDIF.
            IF iv_testrun = 'X'.
              RETURN.
            ENDIF.
            CALL FUNCTION 'NUMBER_GET_NEXT'
              EXPORTING
                nr_range_nr = '01'
                object      = 'ZFA_ORDER'
              IMPORTING
                number      = lv_order_id
              EXCEPTIONS
                OTHERS      = 1.
            CALL FUNCTION 'Z_FA_ORDER_SAVE' IN UPDATE TASK
              EXPORTING
                iv_order_id = lv_order_id
                is_header   = is_header
              TABLES
                it_items    = it_items.
            COMMIT WORK.
            ev_order_id = lv_order_id.
          ENDFUNCTION.
      - name: error_message_ends_rfc
        reason: A missing customer is reported with MESSAGE of type E, which ends a remote call with SYSTEM_FAILURE instead of a RETURN entry.
        caught_by: forbidden_pattern
        response: |
          * file: src/zfa_order_api.fugr.z_fa_order_create.abap
          FUNCTION z_fa_order_create.
          *"----------------------------------------------------------------------
          *"*"Local Interface:
          *"  IMPORTING
          *"     VALUE(IS_HEADER) TYPE  ZFA_S_ORDER_HEADER
          *"     VALUE(IV_TESTRUN) TYPE  TESTRUN DEFAULT SPACE
          *"  EXPORTING
          *"     VALUE(EV_ORDER_ID) TYPE  ZFA_ORDER_ID
          *"  TABLES
          *"      IT_ITEMS STRUCTURE  ZFA_S_ORDER_ITEM
          *"      RETURN STRUCTURE  BAPIRET2
          *"----------------------------------------------------------------------
            DATA lv_text TYPE bapi_msg.
            DATA ls_return TYPE bapiret2.
            DATA lv_order_id TYPE zfa_order_id.

            AUTHORITY-CHECK OBJECT 'ZFA_ORDER'
              ID 'ACTVT' FIELD '01'.
            IF sy-subrc <> 0.
              MESSAGE e001(zfa_order) INTO lv_text.
              ls_return-type    = sy-msgty.
              ls_return-id      = sy-msgid.
              ls_return-number  = sy-msgno.
              ls_return-message = lv_text.
              APPEND ls_return TO return.
              RETURN.
            ENDIF.
            IF is_header-customer IS INITIAL.
              MESSAGE e002(zfa_order).
            ENDIF.
            IF iv_testrun = 'X'.
              RETURN.
            ENDIF.
            CALL FUNCTION 'NUMBER_GET_NEXT'
              EXPORTING
                nr_range_nr = '01'
                object      = 'ZFA_ORDER'
              IMPORTING
                number      = lv_order_id
              EXCEPTIONS
                OTHERS      = 1.
            CALL FUNCTION 'Z_FA_ORDER_SAVE' IN UPDATE TASK
              EXPORTING
                iv_order_id = lv_order_id
                is_header   = is_header
              TABLES
                it_items    = it_items.
            ev_order_id = lv_order_id.
          ENDFUNCTION.
