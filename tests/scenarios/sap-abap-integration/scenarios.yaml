# yaml-language-server: $schema=../../../schemas/skill-scenarios.schema.json
# Scenarios for sap-abap-integration. Each scenario names its SAP target; ABAP answers are
# parsed with abaplint using the grammar of that release (config/sap-environments.yaml).
# Function module bodies are parsed without the function group XML, so only their syntax is
# checked; programs and classes also get abaplint's syntax check.
#
# Forbidden patterns run on the whole answer, prose and comments included. Patterns for
# statements are therefore anchored to the start of a line (a statement, not a sentence that
# names it), and patterns for dynamic SQL tie a built variable to its use in WHERE ( ... ).

config:
  model: claude-sonnet-4.6
  max_tokens: 6000
  temperature: 0.2

# Default target for acceptance-criteria examples without an abap-env directive.
environment:
  product: ecc
  release: ehp8
  database: anydb
  deployment: on-premise

scenarios:
  # A per-row LUW cannot be told apart from one commit after the loop by a regular
  # expression, because both end a loop and then decide. Live grading checks that property.
  - name: bapi_commit_per_document_ehp6
    description: Evaluate RETURN for E and A, then commit or roll back once per business document, mark the staged row in the same LUW, in classic syntax for SAP_BASIS 7.31.
    prompt: |
      We run SAP ECC 6.0 EHP6 (SAP_BASIS 7.31) on Oracle. Our team wrote this BAPI-style
      function module. It saves through the update task and never commits:

        FUNCTION z_fa_order_create
          IMPORTING
            VALUE(is_header)   TYPE zfa_s_order_header   " customer, order_date, currency
            VALUE(iv_testrun)  TYPE testrun DEFAULT space
          EXPORTING
            VALUE(ev_order_id) TYPE zfa_order_id
          TABLES
            it_items STRUCTURE zfa_s_order_item          " material, quantity, unit
            return   STRUCTURE bapiret2.

      Write a report that reads the open rows of our staging table ZFA_ORDER_STAGE (fields
      STAGE_ID, CUSTOMER, ORDER_DATE, CURRENCY, MATERIAL, QUANTITY, UNIT, STATUS; open rows
      have an empty STATUS) and creates one order per row with this function. A failed row
      must not stop or undo the others. Offer a test run and show every message per row.
    environment:
      product: ecc
      release: ehp6
      database: anydb
      deployment: on-premise
    expected_patterns:
      - '(?i)CALL\s+FUNCTION\s+''Z_FA_ORDER_CREATE'''
      - '(?i)BAPI_TRANSACTION_COMMIT'
      - '(?i)BAPI_TRANSACTION_ROLLBACK'
      - '(?i)(type\s*(=|EQ)\s*''A''|\bCA\s*''(EA|AE)''|WHEN\s+''[EA]''\s+OR\s+''[EA]'')'
      - '(?i)iv_testrun\s*='
      - '(?i)CALL\s+FUNCTION\s+''[^'']+''\s+IN\s+UPDATE\s+TASK'
    forbidden_patterns:
      - '(?i)CALL\s+FUNCTION\s+''(?!BAPI_TRANSACTION_)[^'']+''(?![^.]*\bIN\s+(?:UPDATE\s+TASK|BACKGROUND\s+(?:TASK|UNIT))\b)[^.]*\.\s*(?:(?:\*|")[^\n]*\n\s*)*(?:CALL\s+FUNCTION\s+''BAPI_TRANSACTION_COMMIT''|COMMIT\s+WORK)'
      - '(?i)^[ \t]*ENDSELECT\b'
      - '(?i)^[ \t]*WAIT\s+FOR\s+ASYNCHRONOUS\s+TASKS\b'
    tags: [bapi, commit, ecc, release-aware]
    validators: [abaplint]
    mock_response: |
      Target assumed: SAP ECC 6.0 EHP6, SAP_BASIS 7.31, Oracle. The report uses classic syntax
      only. Inline declarations, constructor operators, and the new ABAP SQL syntax need
      SAP_BASIS 7.40 and would not compile here.

      How it works:

      - Each staged row is its own LUW. After Z_FA_ORDER_CREATE returns, the report reads
        RETURN first. A message of type E (error) or A (abort) means the order failed, and the
        report calls BAPI_TRANSACTION_ROLLBACK. Otherwise it calls BAPI_TRANSACTION_COMMIT with
        wait = 'X', which waits until the V1 update has saved the order, and checks the RETURN
        of the commit as well. The order of the steps matters: a rollback cannot undo what a
        commit has already passed to the update task.
      - A failed row rolls back only its own work, so the other rows are not affected.
      - Right before the commit the report registers Z_FA_ORDER_STAGE_SET_POSTED in the update
        task. It sets STATUS in the same LUW as the order, so a row is marked only when its
        order is saved, and the next run skips it.
      - Each row is locked with ENQUEUE_EZFA_ORDER_STAGE and its status is read again under the
        lock, so two runs at the same time cannot post the same row.
      - The staged rows are read into an internal table before the loop, because a commit in
        a SELECT loop would close the database cursor.
      - The test run passes iv_testrun = 'X': all checks run, nothing is saved, and the report
        rolls back afterwards.
      - Every RETURN line is shown per staging row, including warnings.

      ```abap
      * file: src/zfa_order_upload.prog.abap
      REPORT zfa_order_upload.

      TYPES: BEGIN OF ty_log,
               stage_id TYPE zfa_order_stage-stage_id,
               order_id TYPE zfa_order_id,
               type     TYPE bapiret2-type,
               message  TYPE bapiret2-message,
             END OF ty_log,
             tt_log TYPE STANDARD TABLE OF ty_log WITH DEFAULT KEY.

      PARAMETERS p_test AS CHECKBOX DEFAULT 'X'.

      CLASS lcl_order_upload DEFINITION FINAL.
        PUBLIC SECTION.
          METHODS run
            IMPORTING iv_testrun    TYPE c
            RETURNING value(rt_log) TYPE tt_log.
        PRIVATE SECTION.
          METHODS post_order
            IMPORTING is_stage   TYPE zfa_order_stage
                      iv_testrun TYPE c
            CHANGING  ct_log     TYPE tt_log.
      ENDCLASS.

      CLASS lcl_order_upload IMPLEMENTATION.
        METHOD run.
          DATA lt_stage TYPE STANDARD TABLE OF zfa_order_stage WITH DEFAULT KEY.
          DATA ls_stage TYPE zfa_order_stage.
          DATA ls_log TYPE ty_log.

          SELECT * FROM zfa_order_stage INTO TABLE lt_stage
            WHERE status = space
            ORDER BY stage_id.
          LOOP AT lt_stage INTO ls_stage.
            CLEAR ls_log.
            ls_log-stage_id = ls_stage-stage_id.
            " Lock the row so that a second run cannot post it at the same time.
            CALL FUNCTION 'ENQUEUE_EZFA_ORDER_STAGE'
              EXPORTING
                stage_id       = ls_stage-stage_id
              EXCEPTIONS
                foreign_lock   = 1
                system_failure = 2
                OTHERS         = 3.
            IF sy-subrc <> 0.
              ls_log-type    = 'W'.
              ls_log-message = 'Locked by another run; skipped'.
              APPEND ls_log TO rt_log.
              CONTINUE.
            ENDIF.
            " Read the status again under the lock: another run may have posted the
            " row after the SELECT above.
            SELECT SINGLE status FROM zfa_order_stage INTO ls_stage-status
              WHERE stage_id = ls_stage-stage_id.
            IF sy-subrc = 0 AND ls_stage-status = space.
              post_order( EXPORTING is_stage   = ls_stage
                                    iv_testrun = iv_testrun
                          CHANGING  ct_log     = rt_log ).
            ELSE.
              ls_log-type    = 'I'.
              ls_log-message = 'Already posted by another run'.
              APPEND ls_log TO rt_log.
            ENDIF.
            CALL FUNCTION 'DEQUEUE_EZFA_ORDER_STAGE'
              EXPORTING
                stage_id = ls_stage-stage_id.
          ENDLOOP.
        ENDMETHOD.

        METHOD post_order.
          DATA ls_header TYPE zfa_s_order_header.
          DATA ls_item TYPE zfa_s_order_item.
          DATA lt_items TYPE STANDARD TABLE OF zfa_s_order_item WITH DEFAULT KEY.
          DATA lt_return TYPE STANDARD TABLE OF bapiret2 WITH DEFAULT KEY.
          DATA ls_return TYPE bapiret2.
          DATA ls_commit_return TYPE bapiret2.
          DATA lv_order_id TYPE zfa_order_id.
          DATA lv_failed TYPE abap_bool.
          DATA ls_log TYPE ty_log.

          ls_header-customer   = is_stage-customer.
          ls_header-order_date = is_stage-order_date.
          ls_header-currency   = is_stage-currency.
          ls_item-material     = is_stage-material.
          ls_item-quantity     = is_stage-quantity.
          ls_item-unit         = is_stage-unit.
          APPEND ls_item TO lt_items.

          CALL FUNCTION 'Z_FA_ORDER_CREATE'
            EXPORTING
              is_header   = ls_header
              iv_testrun  = iv_testrun
            IMPORTING
              ev_order_id = lv_order_id
            TABLES
              it_items    = lt_items
              return      = lt_return.

          " E (error) and A (abort) mean failure. An empty RETURN means success.
          LOOP AT lt_return INTO ls_return WHERE type = 'E' OR type = 'A'.
            lv_failed = abap_true.
            EXIT.
          ENDLOOP.

          IF lv_failed = abap_true OR iv_testrun = 'X'.
            CALL FUNCTION 'BAPI_TRANSACTION_ROLLBACK'.
          ELSE.
            " Same LUW as the order: the row is marked only if the order is saved.
            CALL FUNCTION 'Z_FA_ORDER_STAGE_SET_POSTED' IN UPDATE TASK
              EXPORTING
                iv_stage_id = is_stage-stage_id.
            CALL FUNCTION 'BAPI_TRANSACTION_COMMIT'
              EXPORTING
                wait   = 'X'
              IMPORTING
                return = ls_commit_return.
            IF ls_commit_return-type = 'E' OR ls_commit_return-type = 'A'.
              APPEND ls_commit_return TO lt_return.
            ENDIF.
          ENDIF.

          " Keep every message, not only the first one.
          LOOP AT lt_return INTO ls_return.
            CLEAR ls_log.
            ls_log-stage_id = is_stage-stage_id.
            ls_log-order_id = lv_order_id.
            ls_log-type     = ls_return-type.
            ls_log-message  = ls_return-message.
            APPEND ls_log TO ct_log.
          ENDLOOP.
        ENDMETHOD.
      ENDCLASS.

      DATA go_upload TYPE REF TO lcl_order_upload.
      DATA gt_log TYPE tt_log.
      DATA go_alv TYPE REF TO cl_salv_table.
      DATA gx_salv TYPE REF TO cx_salv_msg.

      START-OF-SELECTION.
        CREATE OBJECT go_upload.
        gt_log = go_upload->run( p_test ).
        TRY.
            cl_salv_table=>factory( IMPORTING r_salv_table = go_alv
                                    CHANGING  t_table      = gt_log ).
            go_alv->display( ).
          CATCH cx_salv_msg INTO gx_salv.
            MESSAGE gx_salv TYPE 'E'.
        ENDTRY.
      ```

      Create these objects as well: the lock object EZFA_ORDER_STAGE on ZFA_ORDER_STAGE (SE11),
      which generates ENQUEUE_EZFA_ORDER_STAGE and DEQUEUE_EZFA_ORDER_STAGE, and the update
      module below (SE37, processing type Update Module, start immediately), so that it runs
      in the same V1 update as the order.

      ```abap
      * file: src/zfa_order_upd.fugr.z_fa_order_stage_set_posted.abap
      FUNCTION z_fa_order_stage_set_posted.
      *"----------------------------------------------------------------------
      *"*"Local Interface:
      *"  IMPORTING
      *"     VALUE(IV_STAGE_ID) TYPE  ZFA_ORDER_STAGE-STAGE_ID
      *"----------------------------------------------------------------------
        UPDATE zfa_order_stage SET status = 'P'
          WHERE stage_id = iv_stage_id.
        IF sy-subrc <> 0.
      *   A termination message ends the update and rolls back the whole LUW,
      *   including the order, so order and staging status stay consistent.
          MESSAGE a398(00) WITH 'Staging row' iv_stage_id 'not found'.
        ENDIF.
      ENDFUNCTION.
      ```

      Terminated updates appear in SM13. Not verified offline: activation in your system, the
      DDIC types of ZFA_ORDER_STAGE and the order structures, the parameters of the generated
      lock modules, and a test with real data.
    negative_responses:
      - name: commit_before_return_check
        reason: The order is committed before RETURN is read, so the rollback after an error comes too late to undo it.
        caught_by: forbidden_pattern
        response: |
          * file: src/zfa_order_upload.prog.abap
          REPORT zfa_order_upload.

          PARAMETERS p_test AS CHECKBOX DEFAULT 'X'.

          DATA gt_stage TYPE STANDARD TABLE OF zfa_order_stage WITH DEFAULT KEY.
          DATA gs_stage TYPE zfa_order_stage.
          DATA gs_header TYPE zfa_s_order_header.
          DATA gs_item TYPE zfa_s_order_item.
          DATA gt_items TYPE STANDARD TABLE OF zfa_s_order_item WITH DEFAULT KEY.
          DATA gt_return TYPE STANDARD TABLE OF bapiret2 WITH DEFAULT KEY.
          DATA gs_return TYPE bapiret2.
          DATA gv_order_id TYPE zfa_order_id.

          START-OF-SELECTION.
            SELECT * FROM zfa_order_stage INTO TABLE gt_stage WHERE status = space.
            LOOP AT gt_stage INTO gs_stage.
              CLEAR: gs_header, gs_item, gt_items, gt_return, gv_order_id.
              gs_header-customer   = gs_stage-customer.
              gs_header-order_date = gs_stage-order_date.
              gs_header-currency   = gs_stage-currency.
              gs_item-material     = gs_stage-material.
              gs_item-quantity     = gs_stage-quantity.
              gs_item-unit         = gs_stage-unit.
              APPEND gs_item TO gt_items.
              CALL FUNCTION 'Z_FA_ORDER_STAGE_SET_POSTED' IN UPDATE TASK
                EXPORTING
                  iv_stage_id = gs_stage-stage_id.
              CALL FUNCTION 'Z_FA_ORDER_CREATE'
                EXPORTING
                  is_header   = gs_header
                  iv_testrun  = p_test
                IMPORTING
                  ev_order_id = gv_order_id
                TABLES
                  it_items    = gt_items
                  return      = gt_return.
              CALL FUNCTION 'BAPI_TRANSACTION_COMMIT'
                EXPORTING
                  wait = 'X'.
              LOOP AT gt_return INTO gs_return WHERE type = 'E' OR type = 'A'.
                CALL FUNCTION 'BAPI_TRANSACTION_ROLLBACK'.
                EXIT.
              ENDLOOP.
              LOOP AT gt_return INTO gs_return.
                WRITE: / gs_stage-stage_id, gs_return-type, gs_return-message.
              ENDLOOP.
            ENDLOOP.
      - name: no_commit_after_success
        reason: Without BAPI_TRANSACTION_COMMIT the registered update is never executed, so no order is saved.
        caught_by: expected_pattern
        response: |
          Z_FA_ORDER_CREATE saves the order itself, so the report only has to check RETURN and
          roll back when something failed.

          * file: src/zfa_order_upload.prog.abap
          REPORT zfa_order_upload.

          PARAMETERS p_test AS CHECKBOX DEFAULT 'X'.

          DATA gt_stage TYPE STANDARD TABLE OF zfa_order_stage WITH DEFAULT KEY.
          DATA gs_stage TYPE zfa_order_stage.
          DATA gs_header TYPE zfa_s_order_header.
          DATA gs_item TYPE zfa_s_order_item.
          DATA gt_items TYPE STANDARD TABLE OF zfa_s_order_item WITH DEFAULT KEY.
          DATA gt_return TYPE STANDARD TABLE OF bapiret2 WITH DEFAULT KEY.
          DATA gs_return TYPE bapiret2.
          DATA gv_order_id TYPE zfa_order_id.
          DATA gv_failed TYPE c LENGTH 1.

          START-OF-SELECTION.
            SELECT * FROM zfa_order_stage INTO TABLE gt_stage WHERE status = space.
            LOOP AT gt_stage INTO gs_stage.
              CLEAR: gs_header, gs_item, gt_items, gt_return, gv_order_id, gv_failed.
              gs_header-customer   = gs_stage-customer.
              gs_header-order_date = gs_stage-order_date.
              gs_header-currency   = gs_stage-currency.
              gs_item-material     = gs_stage-material.
              gs_item-quantity     = gs_stage-quantity.
              gs_item-unit         = gs_stage-unit.
              APPEND gs_item TO gt_items.
              CALL FUNCTION 'Z_FA_ORDER_CREATE'
                EXPORTING
                  is_header   = gs_header
                  iv_testrun  = p_test
                IMPORTING
                  ev_order_id = gv_order_id
                TABLES
                  it_items    = gt_items
                  return      = gt_return.
              LOOP AT gt_return INTO gs_return WHERE type = 'E' OR type = 'A'.
                gv_failed = 'X'.
                EXIT.
              ENDLOOP.
              IF gv_failed = 'X' OR p_test = 'X'.
                CALL FUNCTION 'BAPI_TRANSACTION_ROLLBACK'.
              ELSE.
                CALL FUNCTION 'Z_FA_ORDER_STAGE_SET_POSTED' IN UPDATE TASK
                  EXPORTING
                    iv_stage_id = gs_stage-stage_id.
              ENDIF.
              LOOP AT gt_return INTO gs_return.
                WRITE: / gs_stage-stage_id, gs_return-type, gs_return-message.
              ENDLOOP.
            ENDLOOP.
      - name: syntax_740_on_ehp6
        reason: Inline declarations, VALUE, WITH EMPTY KEY, and line_exists( ) need SAP_BASIS 7.40; the report does not compile on 7.31.
        caught_by: validator
        response: |
          * file: src/zfa_order_upload.prog.abap
          REPORT zfa_order_upload.

          TYPES tt_items TYPE STANDARD TABLE OF zfa_s_order_item WITH EMPTY KEY.
          TYPES tt_return TYPE STANDARD TABLE OF bapiret2 WITH EMPTY KEY.

          PARAMETERS p_test AS CHECKBOX DEFAULT 'X'.

          DATA gt_stage TYPE STANDARD TABLE OF zfa_order_stage WITH EMPTY KEY.
          DATA gt_return TYPE tt_return.
          DATA gv_order_id TYPE zfa_order_id.

          START-OF-SELECTION.
            SELECT * FROM zfa_order_stage INTO TABLE gt_stage WHERE status = space.
            LOOP AT gt_stage INTO DATA(ls_stage).
              DATA(ls_header) = VALUE zfa_s_order_header( customer   = ls_stage-customer
                                                         order_date = ls_stage-order_date
                                                         currency   = ls_stage-currency ).
              DATA(lt_items) = VALUE tt_items( ( material = ls_stage-material
                                                 quantity = ls_stage-quantity
                                                 unit     = ls_stage-unit ) ).
              CLEAR: gt_return, gv_order_id.
              CALL FUNCTION 'Z_FA_ORDER_CREATE'
                EXPORTING
                  is_header   = ls_header
                  iv_testrun  = p_test
                IMPORTING
                  ev_order_id = gv_order_id
                TABLES
                  it_items    = lt_items
                  return      = gt_return.
              IF line_exists( gt_return[ type = 'E' ] ) OR line_exists( gt_return[ type = 'A' ] ).
                CALL FUNCTION 'BAPI_TRANSACTION_ROLLBACK'.
              ELSE.
                CALL FUNCTION 'Z_FA_ORDER_STAGE_SET_POSTED' IN UPDATE TASK
                  EXPORTING
                    iv_stage_id = ls_stage-stage_id.
                CALL FUNCTION 'BAPI_TRANSACTION_COMMIT'
                  EXPORTING
                    wait = abap_true.
              ENDIF.
              LOOP AT gt_return INTO DATA(ls_return).
                WRITE: / ls_stage-stage_id, ls_return-type, ls_return-message.
              ENDLOOP.
            ENDLOOP.
      - name: posting_inside_select_endselect
        reason: The report posts and commits inside SELECT ... ENDSELECT; the commit closes the database cursor and the next fetch ends in a runtime error.
        caught_by: forbidden_pattern
        response: |
          * file: src/zfa_order_upload.prog.abap
          REPORT zfa_order_upload.

          PARAMETERS p_test AS CHECKBOX DEFAULT 'X'.

          DATA gs_stage TYPE zfa_order_stage.
          DATA gs_header TYPE zfa_s_order_header.
          DATA gs_item TYPE zfa_s_order_item.
          DATA gt_items TYPE STANDARD TABLE OF zfa_s_order_item WITH DEFAULT KEY.
          DATA gt_return TYPE STANDARD TABLE OF bapiret2 WITH DEFAULT KEY.
          DATA gs_return TYPE bapiret2.
          DATA gv_order_id TYPE zfa_order_id.
          DATA gv_failed TYPE c LENGTH 1.

          START-OF-SELECTION.
            SELECT * FROM zfa_order_stage INTO gs_stage WHERE status = space.
              CLEAR: gs_header, gs_item, gt_items, gt_return, gv_order_id, gv_failed.
              gs_header-customer   = gs_stage-customer.
              gs_header-order_date = gs_stage-order_date.
              gs_header-currency   = gs_stage-currency.
              gs_item-material     = gs_stage-material.
              gs_item-quantity     = gs_stage-quantity.
              gs_item-unit         = gs_stage-unit.
              APPEND gs_item TO gt_items.
              CALL FUNCTION 'Z_FA_ORDER_CREATE'
                EXPORTING
                  is_header   = gs_header
                  iv_testrun  = p_test
                IMPORTING
                  ev_order_id = gv_order_id
                TABLES
                  it_items    = gt_items
                  return      = gt_return.
              LOOP AT gt_return INTO gs_return WHERE type = 'E' OR type = 'A'.
                gv_failed = 'X'.
                EXIT.
              ENDLOOP.
              IF gv_failed = 'X' OR p_test = 'X'.
                CALL FUNCTION 'BAPI_TRANSACTION_ROLLBACK'.
              ELSE.
                CALL FUNCTION 'Z_FA_ORDER_STAGE_SET_POSTED' IN UPDATE TASK
                  EXPORTING
                    iv_stage_id = gs_stage-stage_id.
                CALL FUNCTION 'BAPI_TRANSACTION_COMMIT'
                  EXPORTING
                    wait = 'X'.
              ENDIF.
              LOOP AT gt_return INTO gs_return.
                WRITE: / gs_stage-stage_id, gs_return-type, gs_return-message.
              ENDLOOP.
            ENDSELECT.
      - name: staged_rows_never_marked
        reason: The report never marks a posted row, so the next run, or a restart after a dump, creates every order again.
        caught_by: expected_pattern
        response: |
          * file: src/zfa_order_upload.prog.abap
          REPORT zfa_order_upload.

          PARAMETERS p_test AS CHECKBOX DEFAULT 'X'.

          DATA gt_stage TYPE STANDARD TABLE OF zfa_order_stage WITH DEFAULT KEY.
          DATA gs_stage TYPE zfa_order_stage.
          DATA gs_header TYPE zfa_s_order_header.
          DATA gs_item TYPE zfa_s_order_item.
          DATA gt_items TYPE STANDARD TABLE OF zfa_s_order_item WITH DEFAULT KEY.
          DATA gt_return TYPE STANDARD TABLE OF bapiret2 WITH DEFAULT KEY.
          DATA gs_return TYPE bapiret2.
          DATA gv_order_id TYPE zfa_order_id.
          DATA gv_failed TYPE c LENGTH 1.

          START-OF-SELECTION.
