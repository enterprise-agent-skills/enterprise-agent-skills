  - name: segw_entityset_paging_ehp8
    description: DPC_EXT redefinition that pushes $filter and the counts into the database and limits every response with server-side paging, on ECC 6.0 EHP8 with SAP_GWFND 7.50.
    prompt: |
      SEGW project ZFA_PRODUCT on ECC 6.0 EHP8 (SAP_BASIS 7.50, SAP_GWFND 7.50, Oracle). The
      entity set ProductSet is based on table ZFA_PRODUCT (key PRODUCT_ID, then NAME,
      CATEGORY, PRICE, CURRENCY), which has about two million rows. Implement
      PRODUCTSET_GET_ENTITYSET so that $filter, $orderby, $top, $skip, $inlinecount, and
      $count work and stay fast. Users need authorization object ZFA_PROD with ACTVT 03. This
      is the generated method in ZCL_ZFA_PRODUCT_DPC:

        METHODS productset_get_entityset
          IMPORTING
            iv_entity_name           TYPE string
            iv_entity_set_name       TYPE string
            iv_source_name           TYPE string
            it_filter_select_options TYPE /iwbep/t_mgw_select_option
            is_paging                TYPE /iwbep/s_mgw_paging
            it_key_tab               TYPE /iwbep/t_mgw_name_value_pair
            it_navigation_path       TYPE /iwbep/t_mgw_navigation_path
            it_order                 TYPE /iwbep/t_mgw_sorting_order
            iv_filter_string         TYPE string
            iv_search_string         TYPE string
            io_tech_request_context  TYPE REF TO /iwbep/if_mgw_req_entityset OPTIONAL
          EXPORTING
            et_entityset             TYPE zcl_zfa_product_mpc=>tt_product
            es_response_context      TYPE /iwbep/if_mgw_appl_srv_runtime=>ty_s_mgw_response_context
          RAISING
            /iwbep/cx_mgw_busi_exception
            /iwbep/cx_mgw_tech_exception.
    environment:
      product: ecc
      release: ehp8
      database: anydb
      deployment: on-premise
    context_files:
      - path: src/zcl_zfa_product_dpc.clas.abap
        content: |
          " Excerpt of the class generated by SEGW, as quoted in the prompt.
          " Superclass and the other generated methods are omitted.
          CLASS zcl_zfa_product_dpc DEFINITION PUBLIC CREATE PUBLIC.
            PROTECTED SECTION.
              METHODS productset_get_entityset
                IMPORTING
                  iv_entity_name           TYPE string
                  iv_entity_set_name       TYPE string
                  iv_source_name           TYPE string
                  it_filter_select_options TYPE /iwbep/t_mgw_select_option
                  is_paging                TYPE /iwbep/s_mgw_paging
                  it_key_tab               TYPE /iwbep/t_mgw_name_value_pair
                  it_navigation_path       TYPE /iwbep/t_mgw_navigation_path
                  it_order                 TYPE /iwbep/t_mgw_sorting_order
                  iv_filter_string         TYPE string
                  iv_search_string         TYPE string
                  io_tech_request_context  TYPE REF TO /iwbep/if_mgw_req_entityset OPTIONAL
                EXPORTING
                  et_entityset             TYPE zcl_zfa_product_mpc=>tt_product
                  es_response_context      TYPE /iwbep/if_mgw_appl_srv_runtime=>ty_s_mgw_response_context
                RAISING
                  /iwbep/cx_mgw_busi_exception
                  /iwbep/cx_mgw_tech_exception.
          ENDCLASS.

          CLASS zcl_zfa_product_dpc IMPLEMENTATION.
            METHOD productset_get_entityset.
            ENDMETHOD.
          ENDCLASS.
    expected_patterns:
      - '(?i)CLASS\s+zcl_zfa_product_dpc_ext\s+DEFINITION'
      - '(?i)productset_get_entityset\s+REDEFINITION'
      - '(?i)(get_osql_where_clause|get_filter)\s*\('
      - '(?i)get_top\s*\('
      - '(?i)get_skip\s*\('
      - '(?i)has_inlinecount\s*\('
      - '(?i)COUNT\s*\(\s*\*\s*\)'
      - '(?i)UP\s+TO\s+@?\w+\s+ROWS'
      - '(?i)-skiptoken\s*='
      - '(?i)/iwbep/cx_mgw_busi_exception'
    forbidden_patterns:
      - '(?i)^\s*LOOP\s+AT\b(?:(?!ENDLOOP)[\s\S])*?^\s*SELECT\b'
      - '(?i)LOOP\s+AT\s+\S+\s+(?:INTO|ASSIGNING|REFERENCE\s+INTO)\s+\S+\s+FROM\b'
      - '(?i)\bAPPEND\s+LINES\s+OF\s+\S+\s+FROM\b'
      - '(?i)/iwbep/cl_mgw_data_util=>(?:paging|filtering|orderby)'
      - '(?i)-inlinecount\s*=\s*lines\s*\('
      - '(?i)\b(\w+)\s*=\s*lines\s*\(\s*et_entityset\s*\)[\s\S]*?-inlinecount\s*=\s*\1\b'
      - '(?i)\bDESCRIBE\s+TABLE\s+et_entityset\s+LINES\s+(\w+)[\s\S]*?-inlinecount\s*=\s*\1\b'
      - '(?i)(?:=\s*|\bLOOP\s+AT\s+|\bREAD\s+TABLE\s+|\(\s*)(?:is_paging|it_filter_select_options|it_order|it_key_tab|iv_filter_string)\b|\b(?:is_paging|it_filter_select_options|it_order|it_key_tab)\s*(?:-|\[)'
      - '(?i)\bCLASS\s+\w*_[dm]pc\s+(?:DEFINITION|IMPLEMENTATION)\b'
      - '(?i)\bCONCATENATE\b[^.]*\bINTO\s+(\w+)\b[^.]*\.[\s\S]*?\bWHERE\s*\(\s*\1\s*\)'
      - '(?i)\b(\w+)\s*=\s*(?![^.]*cl_abap_dyn_prg)[^.]*(?:&&|\|)[^.]*\.[\s\S]*?\bWHERE\s*\(\s*\1\s*\)'
      - '(?i)\b(\w+)\s*=\s*[^.]*get_filter_string\s*\([^.]*\.[\s\S]*?\bWHERE\s*\(\s*\1\s*\)'
      - '(?i)^[ \t]*(?:COMMIT\s+WORK\b|CALL\s+FUNCTION\s+''BAPI_TRANSACTION_COMMIT'')'
    tags: [gateway, odata, segw, performance, ecc]
    validators: [abaplint]
    mock_response: |
      Target assumed: SAP ECC 6.0 EHP8, SAP_BASIS 7.50 with SAP_GWFND 7.50, Oracle. The code
      goes into ZCL_ZFA_PRODUCT_DPC_EXT as a redefinition. The generated class
      ZCL_ZFA_PRODUCT_DPC stays untouched because regeneration overwrites it, so this answer
      contains only the _EXT class.

      What the method does, and why:

      - It reads the request only through io_tech_request_context, which uses ABAP field
        names. SAP marks the other importing parameters of the generated method as obsolete.
      - $filter: get_osql_where_clause( ) returns the filter as an ABAP SQL condition built by
        the framework. Nothing from the request is concatenated into SQL by hand. SAP does not
        document how the method reports a filter it cannot convert, so the method refuses to
        read when the request has a filter but the condition is empty.
      - $count returns only the number from SELECT COUNT(*). $inlinecount is counted the same
        way, after $filter and before paging, because it must be the total and not the size
        of the page.
      - Paging over two million rows: every response has at most 1000 rows. A request without
        $top, or with a larger $top, gets a full page and a skiptoken; the framework turns the
        token into a next link and lowers $top in that link by the rows already sent. The
        token is the position of the next row. get_top( ) returns an empty string without
        $top, so $top=0 returns no rows instead of all of them.
      - The SELECT reads at most offset plus page size rows and deletes the skipped rows
        afterwards, because OFFSET needs SAP_BASIS 7.51. Pages that start deeper than 10000
        rows are rejected for the same reason; adjust both limits to your clients. The limits
        are checked before any arithmetic, so a huge $skip cannot overflow.
      - $orderby: only known properties reach the dynamic ORDER BY, and the key is added last
        so that pages stay stable.
      - A missing authorization returns HTTP 403. Errors in the dynamic SQL become
        /IWBEP/CX_MGW_BUSI_EXCEPTION, which the client receives as an error response instead
        of a short dump.
      - The inline declarations in order_by_columns need SAP_BASIS 7.40 SP02, which 7.50 has.
      - After an upgrade to 7.51 or later the database can skip the rows with OFFSET. That
        statement uses the strict syntax check, so separate the dynamic ORDER BY columns with
        commas there.

      ```abap
      * file: src/zcl_zfa_product_dpc_ext.clas.abap
      CLASS zcl_zfa_product_dpc_ext DEFINITION PUBLIC
        INHERITING FROM zcl_zfa_product_dpc CREATE PUBLIC.
        PROTECTED SECTION.
          METHODS productset_get_entityset REDEFINITION.
        PRIVATE SECTION.
          " Largest page the service returns; requests for more get a next link.
          CONSTANTS gc_page_size TYPE i VALUE 1000.
          " Deepest row a page may start at. Before 7.51 every skipped row is read.
          CONSTANTS gc_max_offset TYPE i VALUE 10000.
          METHODS order_by_columns
            IMPORTING io_request        TYPE REF TO /iwbep/if_mgw_req_entityset
            RETURNING VALUE(rt_columns) TYPE string_table
            RAISING   /iwbep/cx_mgw_busi_exception.
      ENDCLASS.

      CLASS zcl_zfa_product_dpc_ext IMPLEMENTATION.
        METHOD productset_get_entityset.
          DATA lv_where TYPE string.
          DATA lv_filter TYPE string.
          DATA lt_orderby TYPE string_table.
          DATA lv_orderby TYPE string.
          DATA lv_top_text TYPE string.
          DATA lv_skiptoken TYPE string.
          DATA lv_top TYPE i.
          DATA lv_offset TYPE i.
          DATA lv_page TYPE i.
          DATA lv_rows TYPE i.
          DATA lv_lines TYPE i.
          DATA lv_count TYPE i.
          DATA lv_next_row TYPE i.
          DATA lv_next TYPE string.

          AUTHORITY-CHECK OBJECT 'ZFA_PROD'
            ID 'ACTVT' FIELD '03'.
          IF sy-subrc <> 0.
            " 403 Forbidden: the client cannot fix this by changing the request.
            RAISE EXCEPTION TYPE /iwbep/cx_mgw_busi_exception
              EXPORTING
                textid           = /iwbep/cx_mgw_busi_exception=>business_error
                message          = 'No authorization to display products'
                http_status_code = '403'.
          ENDIF.

          " $filter as a condition on ABAP field names, built by the framework.
          lv_where = io_tech_request_context->get_osql_where_clause( ).
          lv_filter = io_tech_request_context->get_filter( )->get_filter_string( ).
          IF lv_where IS INITIAL AND lv_filter IS NOT INITIAL.
            " Never read without the condition the client asked for.
            RAISE EXCEPTION TYPE /iwbep/cx_mgw_busi_exception
              EXPORTING
                textid  = /iwbep/cx_mgw_busi_exception=>business_error
                message = 'This $filter is not supported'.
          ENDIF.

          TRY.
              " .../ProductSet/$count asks for the number only.
              IF io_tech_request_context->has_count( ) = abap_true.
                SELECT COUNT(*) FROM zfa_product INTO lv_count WHERE (lv_where).
                es_response_context-count = lv_count.
                RETURN.
              ENDIF.

              " $inlinecount=allpages: all rows that match $filter, before paging.
              IF io_tech_request_context->has_inlinecount( ) = abap_true.
                SELECT COUNT(*) FROM zfa_product INTO lv_count WHERE (lv_where).
                es_response_context-inlinecount = lv_count.
              ENDIF.
            CATCH cx_sy_dynamic_osql_error.
              RAISE EXCEPTION TYPE /iwbep/cx_mgw_busi_exception
                EXPORTING
                  textid  = /iwbep/cx_mgw_busi_exception=>business_error
                  message = 'The filter cannot be processed'.
          ENDTRY.

          " get_top( ) is empty without $top. The next link of an earlier page brings
          " the position of its first row as $skiptoken, without $skip.
          lv_top_text = io_tech_request_context->get_top( ).
          lv_skiptoken = io_tech_request_context->get_skiptoken( ).
          TRY.
              IF lv_skiptoken IS INITIAL.
                lv_offset = io_tech_request_context->get_skip( ).
              ELSE.
                lv_offset = lv_skiptoken.
              ENDIF.
              lv_top = lv_top_text.
            CATCH cx_sy_conversion_error.
              RAISE EXCEPTION TYPE /iwbep/cx_mgw_busi_exception
                EXPORTING
                  textid  = /iwbep/cx_mgw_busi_exception=>business_error
                  message = 'Invalid $top, $skip, or $skiptoken'.
          ENDTRY.
          IF lv_offset < 0 OR lv_top < 0 OR lv_offset > gc_max_offset.
            RAISE EXCEPTION TYPE /iwbep/cx_mgw_busi_exception
              EXPORTING
                textid  = /iwbep/cx_mgw_busi_exception=>business_error
                message = 'Page starts too deep; narrow the result with $filter'.
          ENDIF.

          " Page size: $top, but at most gc_page_size rows. $top=0 asks for no rows.
          IF lv_top_text IS INITIAL OR lv_top > gc_page_size.
            lv_page = gc_page_size.
          ELSE.
            lv_page = lv_top.
          ENDIF.
          IF lv_page = 0.
            RETURN.
          ENDIF.

          lt_orderby = order_by_columns( io_tech_request_context ).
          CONCATENATE LINES OF lt_orderby INTO lv_orderby SEPARATED BY space.

          " Read rows up to the end of the page only (OFFSET needs SAP_BASIS 7.51).
          lv_rows = lv_offset + lv_page.
          TRY.
              SELECT product_id name category price currency
                FROM zfa_product
                UP TO lv_rows ROWS
                INTO CORRESPONDING FIELDS OF TABLE et_entityset
                WHERE (lv_where)
                ORDER BY (lv_orderby).
            CATCH cx_sy_dynamic_osql_error.
              RAISE EXCEPTION TYPE /iwbep/cx_mgw_busi_exception
                EXPORTING
                  textid  = /iwbep/cx_mgw_busi_exception=>business_error
                  message = 'The filter or sort order cannot be processed'.
          ENDTRY.
          IF lv_offset > 0.
            DELETE et_entityset TO lv_offset.
          ENDIF.

          " A full page while the client asked for more: the framework turns the
          " skiptoken, the position of the next row, into a next link.
          DESCRIBE TABLE et_entityset LINES lv_lines.
          IF lv_lines = lv_page AND ( lv_top_text IS INITIAL OR lv_top > lv_page ).
            lv_next_row = lv_offset + lv_page.
            lv_next = lv_next_row.
            CONDENSE lv_next.
            es_response_context-skiptoken = lv_next.
          ENDIF.
        ENDMETHOD.

        METHOD order_by_columns.
          DATA lv_property TYPE string.
          DATA lv_column TYPE string.
          DATA lv_key_sorted TYPE abap_bool.

          DATA(lt_order) = io_request->get_orderby( ).
          LOOP AT lt_order INTO DATA(ls_order).
            lv_property = ls_order-property.
            TRANSLATE lv_property TO UPPER CASE.
            " The property comes from the request: allow known columns only.
            CASE lv_property.
              WHEN 'PRODUCT_ID'.
                lv_key_sorted = abap_true.
              WHEN 'NAME' OR 'CATEGORY' OR 'PRICE'.
              WHEN OTHERS.
                RAISE EXCEPTION TYPE /iwbep/cx_mgw_busi_exception
                  EXPORTING
                    textid  = /iwbep/cx_mgw_busi_exception=>business_error
                    message = 'Sorting by this property is not supported'.
            ENDCASE.
            IF ls_order-order = 'desc'.
              CONCATENATE lv_property 'DESCENDING' INTO lv_column SEPARATED BY space.
            ELSE.
              CONCATENATE lv_property 'ASCENDING' INTO lv_column SEPARATED BY space.
            ENDIF.
            APPEND lv_column TO rt_columns.
          ENDLOOP.
          " The key last, so that pages stay stable when sort values repeat.
          IF lv_key_sorted = abap_false.
            APPEND 'PRODUCT_ID ASCENDING' TO rt_columns.
          ENDIF.
        ENDMETHOD.
      ENDCLASS.
      ```

      Then activate the class, register or refresh the service in /IWFND/MAINT_SERVICE, and
      test requests such as ProductSet?$filter=CATEGORY eq 'TOOLS'&$orderby=PRICE
      desc&$top=20&$skip=40&$inlinecount=allpages and ProductSet without $top (it must return
      1000 rows and a next link) in /IWFND/GW_CLIENT. Errors from this code appear in
      /IWBEP/ERROR_LOG; framework errors in /IWFND/ERROR_LOG.

      Make sure an index supports the columns your clients filter and sort by most, and
      create the authorization object ZFA_PROD with field ACTVT in SU21.

      Not verified offline: activation against the real generated classes, the exact
      signature of the generated method on your support package, which $filter expressions
      get_osql_where_clause( ) converts on your Gateway release, and the constant for HTTP
      status 403 in CS_HTTP_STATUS_CODES of the exception class (SE24), which you can use
      instead of the literal.
    negative_responses:
      - name: read_rows_then_page_in_abap
        reason: The method reads up to 5000 rows for every request and cuts out the page in ABAP, so every page costs as much as the whole result.
        caught_by: forbidden_pattern
        response: |
          * file: src/zcl_zfa_product_dpc_ext.clas.abap
          CLASS zcl_zfa_product_dpc_ext DEFINITION PUBLIC
            INHERITING FROM zcl_zfa_product_dpc CREATE PUBLIC.
            PROTECTED SECTION.
              METHODS productset_get_entityset REDEFINITION.
          ENDCLASS.

          CLASS zcl_zfa_product_dpc_ext IMPLEMENTATION.
            METHOD productset_get_entityset.
              DATA lt_all TYPE zcl_zfa_product_mpc=>tt_product.
              DATA ls_product TYPE zcl_zfa_product_mpc=>ts_product.
              DATA lv_where TYPE string.
              DATA lv_count TYPE i.
              DATA lv_top TYPE i.
              DATA lv_skip TYPE i.
              DATA lv_from TYPE i.
              DATA lv_to TYPE i.
              DATA lv_next TYPE string.

              AUTHORITY-CHECK OBJECT 'ZFA_PROD'
                ID 'ACTVT' FIELD '03'.
              IF sy-subrc <> 0.
                RAISE EXCEPTION TYPE /iwbep/cx_mgw_busi_exception
                  EXPORTING
                    textid  = /iwbep/cx_mgw_busi_exception=>business_error
                    message = 'No authorization to display products'.
              ENDIF.

              lv_where = io_tech_request_context->get_osql_where_clause( ).
              IF io_tech_request_context->has_count( ) = abap_true.
                SELECT COUNT(*) FROM zfa_product INTO lv_count WHERE (lv_where).
                es_response_context-count = lv_count.
                RETURN.
              ENDIF.
              IF io_tech_request_context->has_inlinecount( ) = abap_true.
                SELECT COUNT(*) FROM zfa_product INTO lv_count WHERE (lv_where).
                es_response_context-inlinecount = lv_count.
              ENDIF.

              SELECT * FROM zfa_product UP TO 5000 ROWS
                INTO CORRESPONDING FIELDS OF TABLE lt_all
                WHERE (lv_where)
