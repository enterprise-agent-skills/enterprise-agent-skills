                go_receiver->mv_running = go_receiver->mv_running + 1.
              ELSE.
                WRITE: / gv_bukrs, 'not started, return code', sy-subrc, gv_message.
              ENDIF.
            ENDLOOP.
            WAIT UNTIL go_receiver->mv_running = 0 UP TO 600 SECONDS.

  - name: idoc_outbound_commit_ehp6
    description: Outbound IDoc with MASTER_IDOC_DISTRIBUTE, receivers from the distribution model, an explicit COMMIT WORK, and a check for an empty result, in classic syntax for SAP_BASIS 7.31.
    prompt: |
      On ECC 6.0 EHP6 (SAP_BASIS 7.31, Oracle) we must send orders from our tables ZFA_ORDER
      (ORDER_ID, CUSTOMER, ORDER_DATE, CURRENCY, EXT_REF) and ZFA_ORDER_ITEM (ORDER_ID,
      ITEM_NO, MATERIAL, QUANTITY, UNIT) to a partner system as IDocs of our message type
      ZFA_ORDER, basic type ZFA_ORDER01. Segment Z1FA_ORDER_HDR has ORDER_ID, CUSTOMER,
      ORDER_DATE, CURRENCY, and EXT_REF; segment Z1FA_ORDER_ITM has MATERIAL, QUANTITY, and
      UNIT. The receiver is maintained in the distribution model. Write a report that sends
      one order and tells the user what happened, and list the configuration we need.
    environment:
      product: ecc
      release: ehp6
      database: anydb
      deployment: on-premise
    expected_patterns:
      - '(?i)CALL\s+FUNCTION\s+''MASTER_IDOC_DISTRIBUTE'''
      - '(?i)^[ \t]*COMMIT\s+WORK\b'
      - '(?i)-mestyp\s*=\s*''ZFA_ORDER'''
      - '(?i)-idoctp\s*=\s*''ZFA_ORDER01'''
      - '(?i)-segnam\s*=\s*''Z1FA_ORDER_HDR'''
      - '(?i)communication_idoc_control\s*=\s*(\w+)[\s\S]*?(?:\b\1(?:\[\])?\s+IS\s+(?:NOT\s+)?INITIAL|\blines\s*\(\s*\1\s*\)|\bDESCRIBE\s+TABLE\s+\1\b)'
      - '(?i)\bBD64\b'
      - '(?i)\bWE20\b'
      - '(?i)\bWE21\b'
    forbidden_patterns:
      - '(?i)(?<![\s\S])(?![\s\S]*-rcvprt\s*=)[\s\S]*-rcvprn\s*='
    tags: [idoc, ale, outbound, commit, ecc]
    validators: [abaplint]
    mock_response: |
      Target assumed: SAP ECC 6.0 EHP6, SAP_BASIS 7.31, Oracle. MASTER_IDOC_DISTRIBUTE and the
      IDoc interface have not changed for many releases, and the report uses classic syntax.

      How the report works:

      - The control record gets only MESTYP and IDOCTP. RCVPRT and RCVPRN stay empty, so ALE
        takes the receivers from the distribution model (BD64).
      - Each data record holds SEGNAM and the segment structure in SDATA.
      - The explicit commit after MASTER_IDOC_DISTRIBUTE is mandatory: without it the IDoc is
        created but never sent, and the database commit at the end of the program is not
        enough.
      - If the distribution model has no receiver, the function raises no exception and
        returns an empty COMMUNICATION_IDOC_CONTROL table, so the report checks it.

      ```abap
      * file: src/zfa_order_idoc_send.prog.abap
      REPORT zfa_order_idoc_send.

      PARAMETERS p_order TYPE zfa_order_id OBLIGATORY.

      DATA gs_order TYPE zfa_order.
      DATA gt_items TYPE STANDARD TABLE OF zfa_order_item WITH DEFAULT KEY.
      DATA gs_item TYPE zfa_order_item.
      DATA gs_header_segment TYPE z1fa_order_hdr.
      DATA gs_item_segment TYPE z1fa_order_itm.
      DATA gs_control TYPE edidc.
      DATA gt_data TYPE STANDARD TABLE OF edidd WITH DEFAULT KEY.
      DATA gs_data TYPE edidd.
      DATA gt_created TYPE STANDARD TABLE OF edidc WITH DEFAULT KEY.
      DATA gs_created TYPE edidc.

      START-OF-SELECTION.
        SELECT SINGLE * FROM zfa_order INTO gs_order WHERE order_id = p_order.
        IF sy-subrc <> 0.
          MESSAGE e398(00) WITH 'Order' p_order 'does not exist'.
        ENDIF.
        SELECT * FROM zfa_order_item INTO TABLE gt_items WHERE order_id = p_order.

        " Receivers come from the distribution model (BD64): RCVPRT and RCVPRN stay empty.
        gs_control-mestyp = 'ZFA_ORDER'.
        gs_control-idoctp = 'ZFA_ORDER01'.

        gs_header_segment-order_id   = gs_order-order_id.
        gs_header_segment-customer   = gs_order-customer.
        gs_header_segment-order_date = gs_order-order_date.
        gs_header_segment-currency   = gs_order-currency.
        gs_header_segment-ext_ref    = gs_order-ext_ref.
        gs_data-segnam = 'Z1FA_ORDER_HDR'.
        gs_data-sdata  = gs_header_segment.
        APPEND gs_data TO gt_data.

        LOOP AT gt_items INTO gs_item.
          CLEAR: gs_item_segment, gs_data.
          gs_item_segment-material = gs_item-material.
          gs_item_segment-quantity = gs_item-quantity.
          gs_item_segment-unit     = gs_item-unit.
          gs_data-segnam = 'Z1FA_ORDER_ITM'.
          gs_data-sdata  = gs_item_segment.
          APPEND gs_data TO gt_data.
        ENDLOOP.

        CALL FUNCTION 'MASTER_IDOC_DISTRIBUTE'
          EXPORTING
            master_idoc_control            = gs_control
          TABLES
            communication_idoc_control     = gt_created
            master_idoc_data               = gt_data
          EXCEPTIONS
            error_in_idoc_control          = 1
            error_writing_idoc_status      = 2
            error_in_idoc_data             = 3
            sending_logical_system_unknown = 4
            OTHERS                         = 5.
        IF sy-subrc <> 0.
          " 1: message type or IDoc type wrong; 4: own logical system missing (BD54, SCC4).
          MESSAGE e398(00) WITH 'MASTER_IDOC_DISTRIBUTE failed, return code' sy-subrc.
        ENDIF.

        " Mandatory: without COMMIT WORK the IDocs exist but are never sent.
        COMMIT WORK.

        IF gt_created IS INITIAL.
          WRITE: / 'No IDoc created: no receiver for ZFA_ORDER in the distribution model.'.
        ENDIF.
        LOOP AT gt_created INTO gs_created.
          WRITE: / 'IDoc', gs_created-docnum, 'for', gs_created-rcvprn, 'status', gs_created-status.
        ENDLOOP.
      ```

      Configuration in the sending system:

      1. Logical systems in BD54, and the own logical system assigned to the client in SCC4.
      2. SM59: an ABAP connection (type 3) to the partner system, with the logon data there.
      3. WE21: a transactional RFC port that uses this destination.
      4. BD64: a distribution model view with message type ZFA_ORDER from the own logical
         system to the partner's logical system.
      5. WE20: the outbound partner profile of the partner (partner type LS, BD82 can generate
         it from BD64) with message type ZFA_ORDER, the port, output mode, and basic type
         ZFA_ORDER01. WE82 must assign ZFA_ORDER to ZFA_ORDER01.

      Watch the IDocs in WE02 or WE05 and the tRFC calls of the port in SM58. Not verified
      offline: activation, the segment definitions, and a test with the partner system.
    negative_responses:
      - name: no_commit_after_distribute
        reason: The IDoc is created but never dispatched, because the report does not call COMMIT WORK after MASTER_IDOC_DISTRIBUTE.
        caught_by: expected_pattern
        response: |
          Configure BD64, WE21, and WE20, then run the report.

          * file: src/zfa_order_idoc_send.prog.abap
          REPORT zfa_order_idoc_send.

          PARAMETERS p_order TYPE zfa_order_id OBLIGATORY.

          DATA gs_order TYPE zfa_order.
          DATA gs_header_segment TYPE z1fa_order_hdr.
          DATA gs_control TYPE edidc.
          DATA gt_data TYPE STANDARD TABLE OF edidd WITH DEFAULT KEY.
          DATA gs_data TYPE edidd.
          DATA gt_created TYPE STANDARD TABLE OF edidc WITH DEFAULT KEY.

          START-OF-SELECTION.
            SELECT SINGLE * FROM zfa_order INTO gs_order WHERE order_id = p_order.
            gs_control-mestyp = 'ZFA_ORDER'.
            gs_control-idoctp = 'ZFA_ORDER01'.
            gs_header_segment-order_id = gs_order-order_id.
            gs_header_segment-customer = gs_order-customer.
            gs_data-segnam = 'Z1FA_ORDER_HDR'.
            gs_data-sdata  = gs_header_segment.
            APPEND gs_data TO gt_data.
            CALL FUNCTION 'MASTER_IDOC_DISTRIBUTE'
              EXPORTING
                master_idoc_control        = gs_control
              TABLES
                communication_idoc_control = gt_created
                master_idoc_data           = gt_data
              EXCEPTIONS
                OTHERS                     = 1.
            IF gt_created IS INITIAL.
              WRITE: / 'No receiver found.'.
            ELSE.
              WRITE: / 'IDoc sent.'.
            ENDIF.
      - name: receiver_number_without_type
        reason: The report fills RCVPRN without RCVPRT; ALE needs both empty, to use the distribution model, or both filled.
        caught_by: forbidden_pattern
        response: |
          Configure BD64, WE21, and WE20, then run the report.

          * file: src/zfa_order_idoc_send.prog.abap
          REPORT zfa_order_idoc_send.

          PARAMETERS p_order TYPE zfa_order_id OBLIGATORY.

          DATA gs_order TYPE zfa_order.
          DATA gs_header_segment TYPE z1fa_order_hdr.
          DATA gs_control TYPE edidc.
          DATA gt_data TYPE STANDARD TABLE OF edidd WITH DEFAULT KEY.
          DATA gs_data TYPE edidd.
          DATA gt_created TYPE STANDARD TABLE OF edidc WITH DEFAULT KEY.

          START-OF-SELECTION.
            SELECT SINGLE * FROM zfa_order INTO gs_order WHERE order_id = p_order.
            gs_control-mestyp = 'ZFA_ORDER'.
