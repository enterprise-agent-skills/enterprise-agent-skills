  - name: srfc_with_failure_handling_ehp4
    description: Synchronous RFC with SYSTEM_FAILURE and COMMUNICATION_FAILURE handled with MESSAGE, RETURN evaluated, and logon data kept in SM59, in classic syntax for SAP_BASIS 7.01.
    prompt: |
      Our ECC 6.0 EHP4 system (SAP_BASIS 7.01, SQL Server, on AWS EC2) must show the open
      orders of a customer that are kept in our S/4HANA 2023 system. The S/4HANA team built
      this remote-enabled function module:

        FUNCTION z_fa_open_orders_get
          IMPORTING
            VALUE(iv_customer) TYPE kunnr
          TABLES
            et_orders STRUCTURE zfa_s_open_order
            return    STRUCTURE bapiret2
          EXCEPTIONS
            customer_not_found.

      The structure ZFA_S_OPEN_ORDER exists in both systems. Write the ECC report that calls
      it and handles every kind of error. The S/4HANA team gave us a technical user for the
      connection.
    environment:
      product: ecc
      release: ehp4
      database: anydb
      deployment: aws-iaas
    expected_patterns:
      - '(?i)CALL\s+FUNCTION\s+''Z_FA_OPEN_ORDERS_GET''\s+DESTINATION'
      - '(?i)system_failure\s*=\s*\d+\s+MESSAGE\s+\w+'
      - '(?i)communication_failure\s*=\s*\d+\s+MESSAGE\s+\w+'
      - '(?i)customer_not_found\s*=\s*\d+'
      - '(?i)(type\s*(=|EQ)\s*''A''|\bCA\s*''(EA|AE)''|WHEN\s+''[EA]''\s+OR\s+''[EA]'')'
      - '(?i)\bSM59\b'
    forbidden_patterns:
      - '(?i)\b\w*(?:passw(?:or)?d|pwd)\w*\b(?:\s*=\s*|\s+TYPE\s+[^.]*?\bVALUE\s+)''[^'']+'''
