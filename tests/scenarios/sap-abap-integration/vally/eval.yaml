name: sap-abap-integration-deterministic
description: Deterministic checks for the sap-abap-integration skill, generated from its scenarios.
version: "1.0"
type: capability
defaults:
  runs: 1
  timeout: 10m
agent_environment:
  skills:
    - ../../../../plugins/sap-abap/skills/sap-abap-integration
grading_environment:
  files:
    - src: ../../../harness/vally-grade.mjs
      dest: .vally/grade.mjs
stimuli:
  - name: bapi-commit-per-document-ehp6
    prompt: |-
      We run SAP ECC 6.0 EHP6 (SAP_BASIS 7.31) on Oracle. Our team wrote this BAPI-style
      function module. It saves through the update task and never commits:

        FUNCTION z_fa_order_create
          IMPORTING
            VALUE(is_header)   TYPE zfa_s_order_header   " customer, order_date, currency
            VALUE(iv_testrun)  TYPE testrun DEFAULT space
          EXPORTING
            VALUE(ev_order_id) TYPE zfa_order_id
          TABLES
            it_items STRUCTURE zfa_s_order_item          " material, quantity, unit
            return   STRUCTURE bapiret2.

      Write a report that reads the open rows of our staging table ZFA_ORDER_STAGE (fields
      STAGE_ID, CUSTOMER, ORDER_DATE, CURRENCY, MATERIAL, QUANTITY, UNIT, STATUS; open rows
      have an empty STATUS) and creates one order per row with this function. A failed row
      must not stop or undo the others. Offer a test run and show every message per row.

      Write your explanation to answer.md and each code object to its own file.
    tags:
      scenario: bapi_commit_per_document_ehp6
      labels: "bapi commit ecc release-aware"
    golden_patch:
      inline: |
        --- /dev/null
        +++ b/answer.md
        @@ -0,0 +1,34 @@
        +Target assumed: SAP ECC 6.0 EHP6, SAP_BASIS 7.31, Oracle. The report uses classic syntax
        +only. Inline declarations, constructor operators, and the new ABAP SQL syntax need
        +SAP_BASIS 7.40 and would not compile here.
        +
        +How it works:
        +
        +- Each staged row is its own LUW. After Z_FA_ORDER_CREATE returns, the report reads
        +  RETURN first. A message of type E (error) or A (abort) means the order failed, and the
        +  report calls BAPI_TRANSACTION_ROLLBACK. Otherwise it calls BAPI_TRANSACTION_COMMIT with
        +  wait = 'X', which waits until the V1 update has saved the order, and checks the RETURN
        +  of the commit as well. The order of the steps matters: a rollback cannot undo what a
        +  commit has already passed to the update task.
        +- A failed row rolls back only its own work, so the other rows are not affected.
        +- Right before the commit the report registers Z_FA_ORDER_STAGE_SET_POSTED in the update
        +  task. It sets STATUS in the same LUW as the order, so a row is marked only when its
        +  order is saved, and the next run skips it.
        +- Each row is locked with ENQUEUE_EZFA_ORDER_STAGE and its status is read again under the
        +  lock, so two runs at the same time cannot post the same row.
        +- The staged rows are read into an internal table before the loop, because a commit in
        +  a SELECT loop would close the database cursor.
        +- The test run passes iv_testrun = 'X': all checks run, nothing is saved, and the report
        +  rolls back afterwards.
        +- Every RETURN line is shown per staging row, including warnings.
        +
        +
        +Create these objects as well: the lock object EZFA_ORDER_STAGE on ZFA_ORDER_STAGE (SE11),
        +which generates ENQUEUE_EZFA_ORDER_STAGE and DEQUEUE_EZFA_ORDER_STAGE, and the update
        +module below (SE37, processing type Update Module, start immediately), so that it runs
        +in the same V1 update as the order.
        +
        +
        +Terminated updates appear in SM13. Not verified offline: activation in your system, the
        +DDIC types of ZFA_ORDER_STAGE and the order structures, the parameters of the generated
        +lock modules, and a test with real data.
        --- /dev/null
        +++ b/src/zfa_order_upload.prog.abap
        @@ -0,0 +1,148 @@
        +REPORT zfa_order_upload.
        +
        +TYPES: BEGIN OF ty_log,
        +         stage_id TYPE zfa_order_stage-stage_id,
        +         order_id TYPE zfa_order_id,
        +         type     TYPE bapiret2-type,
        +         message  TYPE bapiret2-message,
        +       END OF ty_log,
        +       tt_log TYPE STANDARD TABLE OF ty_log WITH DEFAULT KEY.
        +
        +PARAMETERS p_test AS CHECKBOX DEFAULT 'X'.
        +
        +CLASS lcl_order_upload DEFINITION FINAL.
        +  PUBLIC SECTION.
        +    METHODS run
        +      IMPORTING iv_testrun    TYPE c
        +      RETURNING value(rt_log) TYPE tt_log.
        +  PRIVATE SECTION.
        +    METHODS post_order
        +      IMPORTING is_stage   TYPE zfa_order_stage
        +                iv_testrun TYPE c
        +      CHANGING  ct_log     TYPE tt_log.
        +ENDCLASS.
        +
        +CLASS lcl_order_upload IMPLEMENTATION.
        +  METHOD run.
        +    DATA lt_stage TYPE STANDARD TABLE OF zfa_order_stage WITH DEFAULT KEY.
        +    DATA ls_stage TYPE zfa_order_stage.
        +    DATA ls_log TYPE ty_log.
        +
        +    SELECT * FROM zfa_order_stage INTO TABLE lt_stage
        +      WHERE status = space
        +      ORDER BY stage_id.
        +    LOOP AT lt_stage INTO ls_stage.
        +      CLEAR ls_log.
        +      ls_log-stage_id = ls_stage-stage_id.
        +      " Lock the row so that a second run cannot post it at the same time.
        +      CALL FUNCTION 'ENQUEUE_EZFA_ORDER_STAGE'
        +        EXPORTING
        +          stage_id       = ls_stage-stage_id
        +        EXCEPTIONS
        +          foreign_lock   = 1
        +          system_failure = 2
        +          OTHERS         = 3.
        +      IF sy-subrc <> 0.
        +        ls_log-type    = 'W'.
        +        ls_log-message = 'Locked by another run; skipped'.
        +        APPEND ls_log TO rt_log.
        +        CONTINUE.
        +      ENDIF.
        +      " Read the status again under the lock: another run may have posted the
        +      " row after the SELECT above.
        +      SELECT SINGLE status FROM zfa_order_stage INTO ls_stage-status
        +        WHERE stage_id = ls_stage-stage_id.
        +      IF sy-subrc = 0 AND ls_stage-status = space.
        +        post_order( EXPORTING is_stage   = ls_stage
        +                              iv_testrun = iv_testrun
        +                    CHANGING  ct_log     = rt_log ).
        +      ELSE.
        +        ls_log-type    = 'I'.
        +        ls_log-message = 'Already posted by another run'.
        +        APPEND ls_log TO rt_log.
        +      ENDIF.
        +      CALL FUNCTION 'DEQUEUE_EZFA_ORDER_STAGE'
        +        EXPORTING
        +          stage_id = ls_stage-stage_id.
        +    ENDLOOP.
        +  ENDMETHOD.
        +
        +  METHOD post_order.
        +    DATA ls_header TYPE zfa_s_order_header.
        +    DATA ls_item TYPE zfa_s_order_item.
        +    DATA lt_items TYPE STANDARD TABLE OF zfa_s_order_item WITH DEFAULT KEY.
        +    DATA lt_return TYPE STANDARD TABLE OF bapiret2 WITH DEFAULT KEY.
        +    DATA ls_return TYPE bapiret2.
        +    DATA ls_commit_return TYPE bapiret2.
        +    DATA lv_order_id TYPE zfa_order_id.
        +    DATA lv_failed TYPE abap_bool.
        +    DATA ls_log TYPE ty_log.
        +
        +    ls_header-customer   = is_stage-customer.
        +    ls_header-order_date = is_stage-order_date.
        +    ls_header-currency   = is_stage-currency.
        +    ls_item-material     = is_stage-material.
        +    ls_item-quantity     = is_stage-quantity.
        +    ls_item-unit         = is_stage-unit.
        +    APPEND ls_item TO lt_items.
        +
        +    CALL FUNCTION 'Z_FA_ORDER_CREATE'
        +      EXPORTING
        +        is_header   = ls_header
        +        iv_testrun  = iv_testrun
        +      IMPORTING
        +        ev_order_id = lv_order_id
        +      TABLES
        +        it_items    = lt_items
        +        return      = lt_return.
        +
        +    " E (error) and A (abort) mean failure. An empty RETURN means success.
        +    LOOP AT lt_return INTO ls_return WHERE type = 'E' OR type = 'A'.
        +      lv_failed = abap_true.
        +      EXIT.
        +    ENDLOOP.
        +
        +    IF lv_failed = abap_true OR iv_testrun = 'X'.
        +      CALL FUNCTION 'BAPI_TRANSACTION_ROLLBACK'.
        +    ELSE.
        +      " Same LUW as the order: the row is marked only if the order is saved.
        +      CALL FUNCTION 'Z_FA_ORDER_STAGE_SET_POSTED' IN UPDATE TASK
        +        EXPORTING
        +          iv_stage_id = is_stage-stage_id.
        +      CALL FUNCTION 'BAPI_TRANSACTION_COMMIT'
        +        EXPORTING
        +          wait   = 'X'
        +        IMPORTING
        +          return = ls_commit_return.
        +      IF ls_commit_return-type = 'E' OR ls_commit_return-type = 'A'.
        +        APPEND ls_commit_return TO lt_return.
        +      ENDIF.
        +    ENDIF.
        +
        +    " Keep every message, not only the first one.
        +    LOOP AT lt_return INTO ls_return.
        +      CLEAR ls_log.
        +      ls_log-stage_id = is_stage-stage_id.
        +      ls_log-order_id = lv_order_id.
        +      ls_log-type     = ls_return-type.
        +      ls_log-message  = ls_return-message.
        +      APPEND ls_log TO ct_log.
        +    ENDLOOP.
        +  ENDMETHOD.
        +ENDCLASS.
        +
        +DATA go_upload TYPE REF TO lcl_order_upload.
        +DATA gt_log TYPE tt_log.
        +DATA go_alv TYPE REF TO cl_salv_table.
        +DATA gx_salv TYPE REF TO cx_salv_msg.
        +
        +START-OF-SELECTION.
        +  CREATE OBJECT go_upload.
        +  gt_log = go_upload->run( p_test ).
        +  TRY.
        +      cl_salv_table=>factory( IMPORTING r_salv_table = go_alv
        +                              CHANGING  t_table      = gt_log ).
        +      go_alv->display( ).
        +    CATCH cx_salv_msg INTO gx_salv.
        +      MESSAGE gx_salv TYPE 'E'.
        +  ENDTRY.
        --- /dev/null
        +++ b/src/zfa_order_upd.fugr.z_fa_order_stage_set_posted.abap
        @@ -0,0 +1,14 @@
        +FUNCTION z_fa_order_stage_set_posted.
        +*"----------------------------------------------------------------------
        +*"*"Local Interface:
        +*"  IMPORTING
        +*"     VALUE(IV_STAGE_ID) TYPE  ZFA_ORDER_STAGE-STAGE_ID
        +*"----------------------------------------------------------------------
        +  UPDATE zfa_order_stage SET status = 'P'
        +    WHERE stage_id = iv_stage_id.
        +  IF sy-subrc <> 0.
        +*   A termination message ends the update and rolls back the whole LUW,
        +*   including the order, so order and staging status stay consistent.
        +    MESSAGE a398(00) WITH 'Staging row' iv_stage_id 'not found'.
        +  ENDIF.
        +ENDFUNCTION.
    graders:
      - type: run-command
        name: checks-bapi-commit-per-document-ehp6
        config:
          command: node
          args: [".vally/grade.mjs", "sap-abap-integration", "bapi_commit_per_document_ehp6"]
          timeout: 120s
  - name: srfc-with-failure-handling-ehp4
    prompt: |-
      Our ECC 6.0 EHP4 system (SAP_BASIS 7.01, SQL Server, on AWS EC2) must show the open
      orders of a customer that are kept in our S/4HANA 2023 system. The S/4HANA team built
      this remote-enabled function module:

        FUNCTION z_fa_open_orders_get
          IMPORTING
            VALUE(iv_customer) TYPE kunnr
          TABLES
            et_orders STRUCTURE zfa_s_open_order
            return    STRUCTURE bapiret2
          EXCEPTIONS
            customer_not_found.

      The structure ZFA_S_OPEN_ORDER exists in both systems. Write the ECC report that calls
      it and handles every kind of error. The S/4HANA team gave us a technical user for the
      connection.

      Write your explanation to answer.md and each code object to its own file.
    tags:
      scenario: srfc_with_failure_handling_ehp4
      labels: "rfc security ecc release-aware iaas"
    golden_patch:
      inline: |
        --- /dev/null
        +++ b/answer.md
        @@ -0,0 +1,45 @@
        +Target assumed: SAP ECC 6.0 EHP4, SAP_BASIS 7.01, SQL Server. Running on AWS EC2 does not
        +change the ABAP. SAP_BASIS 7.01 has no string templates or other 7.02 syntax, so the
        +report uses classic statements only.
        +
        +Set up the connection first:
        +
        +1. In SM59, create the ABAP connection (type 3) ZFA_S4H_100 to the S/4HANA system and
        +   enter the technical user and its password there, in the logon data of the
        +   destination. They never go into code, constants, tables, or variants. Create a
        +   destination with the same name in each ECC system of the landscape, pointing to the
        +   matching S/4HANA system.
        +2. Protect the destination: enter a value in "Authorization for Destination" on the tab
        +   Logon & Security, and give only the users of this report authorization object S_ICF
        +   with ICF_FIELD DEST and that value.
        +3. In S/4HANA, create the technical user with user type System or Communication, which
        +   cannot log on in dialog. Give it S_RFC with RFC_TYPE FUGR, RFC_NAME = the function
        +   group of Z_FA_OPEN_ORDERS_GET, and ACTVT 16, plus the authorizations the function
        +   module checks itself.
        +4. Trusted RFC (SMT1, S_RFCACL) would log on users without a password. Use it only if
        +   your security team decides so.
        +
        +Check that ZFA_S_OPEN_ORDER has the same components with the same types and lengths in
        +both systems (SE11). The same data element can differ: the material number has 18
        +characters in ECC and up to 40 in S/4HANA, which would give the structure a different
        +layout on each side.
        +
        +How the report handles errors:
        +
        +- SYSTEM_FAILURE: an error in S/4HANA, such as a runtime error or a message of type A,
        +  E, or X. The text is in gv_rfc_message; runtime errors are also in ST22 in S/4HANA.
        +- COMMUNICATION_FAILURE: no connection, a failed logon, or a broken network. Test the
        +  destination in SM59.
        +- CUSTOMER_NOT_FOUND: the function module's own exception.
        +- RETURN: messages of type E or A from the function module.
        +- The remote call triggers a database commit in ECC, so the report calls it before it
        +  changes any data and never inside a SELECT loop.
        +- The authorization check in ECC matters because the technical user in S/4HANA may see
        +  more than the person who runs the report.
        +
        +
        +Create the authorization object ZFA_S4ORD (field ACTVT) in SU21 and assign it to the
        +roles of the users who may run the report.
        +
        +Not verified offline: activation in ECC, the destination and logon in SM59, and a test
        +call against the S/4HANA system.
        --- /dev/null
        +++ b/src/zfa_s4_open_orders.prog.abap
        @@ -0,0 +1,70 @@
        +REPORT zfa_s4_open_orders.
        +
        +" SM59 destination (type 3) to the S/4HANA system. It holds the logon data, so no
        +" user or password appears in this program.
        +CONSTANTS gc_destination TYPE rfcdest VALUE 'ZFA_S4H_100'.
        +
        +PARAMETERS p_kunnr TYPE kunnr OBLIGATORY.
        +
        +DATA gt_orders TYPE STANDARD TABLE OF zfa_s_open_order WITH DEFAULT KEY.
        +DATA gt_return TYPE STANDARD TABLE OF bapiret2 WITH DEFAULT KEY.
        +DATA gs_return TYPE bapiret2.
        +DATA gv_rfc_message TYPE c LENGTH 255.
        +DATA gv_failed TYPE c LENGTH 1.
        +DATA go_alv TYPE REF TO cl_salv_table.
        +DATA gx_salv TYPE REF TO cx_salv_msg.
        +DATA gv_text TYPE string.
        +
        +AT SELECTION-SCREEN.
        +  AUTHORITY-CHECK OBJECT 'ZFA_S4ORD'
        +    ID 'ACTVT' FIELD '03'.
        +  IF sy-subrc <> 0.
        +    MESSAGE e398(00) WITH 'No authorization to read S/4HANA orders'.
        +  ENDIF.
        +
        +START-OF-SELECTION.
        +  CALL FUNCTION 'Z_FA_OPEN_ORDERS_GET'
        +    DESTINATION gc_destination
        +    EXPORTING
        +      iv_customer           = p_kunnr  " ECC customer number, e.g. 0000004711.
        +    TABLES
        +      et_orders             = gt_orders
        +      return                = gt_return
        +    EXCEPTIONS
        +      customer_not_found    = 1
        +      system_failure        = 2 MESSAGE gv_rfc_message
        +      communication_failure = 3 MESSAGE gv_rfc_message
        +      OTHERS                = 4.
        +  CASE sy-subrc.
        +    WHEN 0.
        +      " The call worked. RETURN says whether the function did.
        +    WHEN 1.
        +      WRITE: / 'Customer', p_kunnr, 'does not exist in S/4HANA.'.
        +      RETURN.
        +    WHEN 2.
        +      WRITE: / 'Error in S/4HANA:', gv_rfc_message.
        +      RETURN.
        +    WHEN 3.
        +      WRITE: / 'Connection to S/4HANA failed:', gv_rfc_message.
        +      RETURN.
        +    WHEN OTHERS.
        +      WRITE: / 'Remote call failed with return code', sy-subrc.
        +      RETURN.
        +  ENDCASE.
        +
        +  LOOP AT gt_return INTO gs_return WHERE type = 'E' OR type = 'A'.
        +    WRITE: / gs_return-type, gs_return-message.
        +    gv_failed = 'X'.
        +  ENDLOOP.
        +  IF gv_failed = 'X'.
        +    RETURN.
        +  ENDIF.
        +
        +  TRY.
        +      cl_salv_table=>factory( IMPORTING r_salv_table = go_alv
        +                              CHANGING  t_table      = gt_orders ).
        +      go_alv->display( ).
        +    CATCH cx_salv_msg INTO gx_salv.
        +      gv_text = gx_salv->get_text( ).
        +      WRITE: / gv_text.
        +  ENDTRY.
    graders:
      - type: run-command
        name: checks-srfc-with-failure-handling-ehp4
        config:
          command: node
          args: [".vally/grade.mjs", "sap-abap-integration", "srfc_with_failure_handling_ehp4"]
          timeout: 120s
  - name: idoc-inbound-function-ehp7-basis740-sp08
    prompt: |-
      A partner system sends our own message type ZFA_ORDER (basic type ZFA_ORDER01) to our
      ECC 6.0 EHP7 system (SAP_BASIS 7.40 SP08). Segment Z1FA_ORDER_HDR has ORDER_ID,
      CUSTOMER, ORDER_DATE, CURRENCY, and EXT_REF; segment Z1FA_ORDER_ITM has MATERIAL,
      QUANTITY, and UNIT. Write the inbound function module that posts each IDoc with our
      function module Z_FA_ORDER_CREATE and reports the result in the IDoc status.
      Z_FA_ORDER_CREATE takes IS_HEADER (structure ZFA_S_ORDER_HEADER with CUSTOMER,
      ORDER_DATE, CURRENCY, EXT_REF) and the table IT_ITEMS (ZFA_S_ORDER_ITEM with MATERIAL,
      QUANTITY, UNIT), returns EV_ORDER_ID and a RETURN table of BAPIRET2, saves through the
      update task, and does not commit. Also tell me how to register the function module.

      Write your explanation to answer.md and each code object to its own file.
    tags:
      scenario: idoc_inbound_function_ehp7_basis740_sp08
      labels: "idoc ale ecc release-aware"
    golden_patch:
      inline: |
        --- /dev/null
        +++ b/answer.md
        @@ -0,0 +1,44 @@
        +Target assumed: SAP ECC 6.0 EHP7 on SAP_BASIS 7.40 SP08. The IDoc inbound interface is
        +the same on every release, and the function module uses classic syntax, so it also runs
        +on older systems.
        +
        +The function module does not commit. The ALE layer commits after it has written the
        +status records the function returns, so the order and the IDoc status are saved
        +together, and a failed IDoc leaves nothing behind because Z_FA_ORDER_CREATE registers
        +nothing when it reports an error. Per IDoc it returns status 53 (posted) or 51 (not
        +posted, with the message from RETURN). Both E and A in RETURN mean failure.
        +WORKFLOW_RESULT is 0 when all IDocs were posted and 99999 when one failed, which starts
        +the error workflow. RETURN_VARIABLES gets Processed_IDOCs and Appl_Objects for posted
        +IDocs and Error_IDOCs for failed ones; the names are case-sensitive. IN_UPDATE_TASK is X
        +because Z_FA_ORDER_CREATE posts through the update task.
        +
        +Segment fields arrive as characters. A partner that sends a quantity such as 10,5 would
        +make the move into the typed quantity field raise CX_SY_CONVERSION_NO_NUMBER, so the move
        +is wrapped in TRY and such an IDoc gets status 51 instead of a short dump. If an EDI
        +partner sends ISO codes for units or currencies, convert them first, for example with
        +UNIT_OF_MEASURE_ISO_TO_SAP; check its interface in SE37.
        +
        +
        +Create the function module in its own function group in SE37 with exactly this
        +interface; the ALE layer calls it by name with these parameters. In message class
        +ZFA_ORDER, message 010 should read "Order &1 created" and message 020 "Quantity &1 is
        +not a valid number".
        +
        +Register it:
        +
        +1. WE57: enter Z_FA_IDOC_INPUT_ORDER with type F (function module), basic type
        +   ZFA_ORDER01, message type ZFA_ORDER, and direction 2 (inbound). Object type takes
        +   the BOR object type of the application object, if there is one.
        +2. BD51: maintain the input type of the function module and whether dialog is allowed.
        +3. WE42: create the inbound process code ZFA_ORDER with "Processing with ALE" and
        +   "Processing by function module", and assign the function module.
        +4. WE20: in the partner profile of the sending logical system (partner type LS), add an
        +   inbound parameter for ZFA_ORDER with process code ZFA_ORDER. "Trigger immediately"
        +   posts on arrival; "Trigger by background program" leaves the IDocs in status 64 for
        +   report RBDAPP01.
        +5. Test with WE19, then check the result in WE02 or WE05. Reprocess failed IDocs (status
        +   51) in BD87 after fixing the cause.
        +
        +Not verified offline: the function module interface, which SE37 keeps outside the
        +source, activation, and a test with a real IDoc. The syntax check here covers only the
        +statements of the body.
        --- /dev/null
        +++ b/src/zfa_order_idoc.fugr.z_fa_idoc_input_order.abap
        @@ -0,0 +1,132 @@
        +FUNCTION z_fa_idoc_input_order.
        +*"----------------------------------------------------------------------
        +*"*"Local Interface:
        +*"  IMPORTING
        +*"     VALUE(INPUT_METHOD) LIKE  BDWFAP_PAR-INPUTMETHD
        +*"     VALUE(MASS_PROCESSING) LIKE  BDWFAP_PAR-MASS_PROC
        +*"  EXPORTING
        +*"     VALUE(WORKFLOW_RESULT) LIKE  BDWF_PARAM-RESULT
        +*"     VALUE(APPLICATION_VARIABLE) LIKE  BDWF_PARAM-APPL_VAR
        +*"     VALUE(IN_UPDATE_TASK) LIKE  BDWFAP_PAR-UPDATETASK
        +*"     VALUE(CALL_TRANSACTION_DONE) LIKE  BDWFAP_PAR-CALLTRANS
        +*"  TABLES
        +*"      IDOC_CONTRL STRUCTURE  EDIDC
        +*"      IDOC_DATA STRUCTURE  EDIDD
        +*"      IDOC_STATUS STRUCTURE  BDIDOCSTAT
        +*"      RETURN_VARIABLES STRUCTURE  BDWFRETVAR
        +*"      SERIALIZATION_INFO STRUCTURE  BDI_SER
        +*"  EXCEPTIONS
        +*"      WRONG_FUNCTION_CALLED
        +*"----------------------------------------------------------------------
        +* Inbound processing for message type ZFA_ORDER. Registered in WE57 (basic
        +* type ZFA_ORDER01, direction 2), BD51 (input type), WE42 (process code
        +* ZFA_ORDER), and WE20 (inbound parameter of the sending partner).
        +  CONSTANTS: lc_posted     TYPE bdidocstat-status VALUE '53',
        +             lc_not_posted TYPE bdidocstat-status VALUE '51',
        +             lc_result_ok  TYPE bdwf_param-result VALUE '0',
        +             lc_result_err TYPE bdwf_param-result VALUE '99999'.
        +
        +  DATA: ls_control TYPE edidc,
        +        ls_data    TYPE edidd,
        +        ls_status  TYPE bdidocstat,
        +        ls_retvar  TYPE bdwfretvar,
        +        ls_hdr_seg TYPE z1fa_order_hdr,
        +        ls_itm_seg TYPE z1fa_order_itm,
        +        ls_header  TYPE zfa_s_order_header,
        +        ls_item    TYPE zfa_s_order_item,
        +        lt_items   TYPE STANDARD TABLE OF zfa_s_order_item,
        +        lt_return  TYPE STANDARD TABLE OF bapiret2,
        +        ls_return  TYPE bapiret2,
        +        ls_error   TYPE bapiret2,
        +        lv_order   TYPE zfa_order_id,
        +        lv_failed  TYPE c LENGTH 1.
        +
        +  CLEAR: application_variable, call_transaction_done.
        +  workflow_result = lc_result_ok.
        +* Z_FA_ORDER_CREATE saves through the update task.
        +  in_update_task = 'X'.
        +
        +  LOOP AT idoc_contrl INTO ls_control.
        +    IF ls_control-mestyp <> 'ZFA_ORDER'.
        +      RAISE wrong_function_called.
        +    ENDIF.
        +
        +    CLEAR: ls_header, lt_items, lt_return, ls_error, lv_order, lv_failed.
        +    LOOP AT idoc_data INTO ls_data WHERE docnum = ls_control-docnum.
        +      CASE ls_data-segnam.
        +        WHEN 'Z1FA_ORDER_HDR'.
        +          ls_hdr_seg = ls_data-sdata.
        +          ls_header-customer   = ls_hdr_seg-customer.
        +          ls_header-order_date = ls_hdr_seg-order_date.
        +          ls_header-currency   = ls_hdr_seg-currency.
        +          ls_header-ext_ref    = ls_hdr_seg-ext_ref.
        +        WHEN 'Z1FA_ORDER_ITM'.
        +          ls_itm_seg = ls_data-sdata.
        +          CLEAR ls_item.
        +          ls_item-material = ls_itm_seg-material.
        +          ls_item-unit     = ls_itm_seg-unit.
        +          TRY.
        +*             Segment fields are characters: '10,5' is not a number for ABAP.
        +              ls_item-quantity = ls_itm_seg-quantity.
        +            CATCH cx_sy_conversion_error.
        +              IF lv_failed IS INITIAL.
        +                lv_failed           = 'X'.
        +                ls_error-type       = 'E'.
        +                ls_error-id         = 'ZFA_ORDER'.
        +                ls_error-number     = '020'.
        +                ls_error-message_v1 = ls_itm_seg-quantity.
        +              ENDIF.
        +          ENDTRY.
        +          APPEND ls_item TO lt_items.
        +      ENDCASE.
        +    ENDLOOP.
        +
        +    IF lv_failed IS INITIAL.
        +      CALL FUNCTION 'Z_FA_ORDER_CREATE'
        +        EXPORTING
        +          is_header   = ls_header
        +        IMPORTING
        +          ev_order_id = lv_order
        +        TABLES
        +          it_items    = lt_items
        +          return      = lt_return.
        +
        +      LOOP AT lt_return INTO ls_return WHERE type = 'E' OR type = 'A'.
        +        lv_failed = 'X'.
        +        ls_error = ls_return.
        +        EXIT.
        +      ENDLOOP.
        +    ENDIF.
        +
        +    CLEAR: ls_status, ls_retvar.
        +    ls_status-docnum = ls_control-docnum.
        +    ls_retvar-doc_number = ls_control-docnum.
        +    IF lv_failed = 'X'.
        +      ls_status-status = lc_not_posted.
        +      ls_status-msgty  = ls_error-type.
        +      ls_status-msgid  = ls_error-id.
        +      ls_status-msgno  = ls_error-number.
        +      ls_status-msgv1  = ls_error-message_v1.
        +      ls_status-msgv2  = ls_error-message_v2.
        +      ls_status-msgv3  = ls_error-message_v3.
        +      ls_status-msgv4  = ls_error-message_v4.
        +      APPEND ls_status TO idoc_status.
        +      workflow_result = lc_result_err.
        +      ls_retvar-wf_param = 'Error_IDOCs'.
        +      APPEND ls_retvar TO return_variables.
        +    ELSE.
        +      ls_status-status = lc_posted.
        +      ls_status-msgty  = 'S'.
        +      ls_status-msgid  = 'ZFA_ORDER'.
        +      ls_status-msgno  = '010'.
        +      ls_status-msgv1  = lv_order.
        +      APPEND ls_status TO idoc_status.
        +      ls_retvar-wf_param = 'Processed_IDOCs'.
        +      APPEND ls_retvar TO return_variables.
        +      CLEAR ls_retvar.
        +      ls_retvar-wf_param   = 'Appl_Objects'.
        +      ls_retvar-doc_number = lv_order.
        +      APPEND ls_retvar TO return_variables.
        +    ENDIF.
        +  ENDLOOP.
        +ENDFUNCTION.
