  - name: segw-entityset-paging-ehp8
    prompt: |-
      SEGW project ZFA_PRODUCT on ECC 6.0 EHP8 (SAP_BASIS 7.50, SAP_GWFND 7.50, Oracle). The
      entity set ProductSet is based on table ZFA_PRODUCT (key PRODUCT_ID, then NAME,
      CATEGORY, PRICE, CURRENCY), which has about two million rows. Implement
      PRODUCTSET_GET_ENTITYSET so that $filter, $orderby, $top, $skip, $inlinecount, and
      $count work and stay fast. Users need authorization object ZFA_PROD with ACTVT 03. This
      is the generated method in ZCL_ZFA_PRODUCT_DPC:

        METHODS productset_get_entityset
          IMPORTING
            iv_entity_name           TYPE string
            iv_entity_set_name       TYPE string
            iv_source_name           TYPE string
            it_filter_select_options TYPE /iwbep/t_mgw_select_option
            is_paging                TYPE /iwbep/s_mgw_paging
            it_key_tab               TYPE /iwbep/t_mgw_name_value_pair
            it_navigation_path       TYPE /iwbep/t_mgw_navigation_path
            it_order                 TYPE /iwbep/t_mgw_sorting_order
            iv_filter_string         TYPE string
            iv_search_string         TYPE string
            io_tech_request_context  TYPE REF TO /iwbep/if_mgw_req_entityset OPTIONAL
          EXPORTING
            et_entityset             TYPE zcl_zfa_product_mpc=>tt_product
            es_response_context      TYPE /iwbep/if_mgw_appl_srv_runtime=>ty_s_mgw_response_context
          RAISING
            /iwbep/cx_mgw_busi_exception
            /iwbep/cx_mgw_tech_exception.

      Write your explanation to answer.md and each code object to its own file.
    tags:
      scenario: segw_entityset_paging_ehp8
      labels: "gateway odata segw performance ecc"
    golden_patch:
      inline: |
        --- /dev/null
        +++ b/answer.md
        @@ -0,0 +1,50 @@
        +Target assumed: SAP ECC 6.0 EHP8, SAP_BASIS 7.50 with SAP_GWFND 7.50, Oracle. The code
        +goes into ZCL_ZFA_PRODUCT_DPC_EXT as a redefinition. The generated class
        +ZCL_ZFA_PRODUCT_DPC stays untouched because regeneration overwrites it, so this answer
        +contains only the _EXT class.
        +
        +What the method does, and why:
        +
        +- It reads the request only through io_tech_request_context, which uses ABAP field
        +  names. SAP marks the other importing parameters of the generated method as obsolete.
        +- $filter: get_osql_where_clause( ) returns the filter as an ABAP SQL condition built by
        +  the framework. Nothing from the request is concatenated into SQL by hand. SAP does not
        +  document how the method reports a filter it cannot convert, so the method refuses to
        +  read when the request has a filter but the condition is empty.
        +- $count returns only the number from SELECT COUNT(*). $inlinecount is counted the same
        +  way, after $filter and before paging, because it must be the total and not the size
        +  of the page.
        +- Paging over two million rows: every response has at most 1000 rows. A request without
        +  $top, or with a larger $top, gets a full page and a skiptoken; the framework turns the
        +  token into a next link and lowers $top in that link by the rows already sent. The
        +  token is the position of the next row. get_top( ) returns an empty string without
        +  $top, so $top=0 returns no rows instead of all of them.
        +- The SELECT reads at most offset plus page size rows and deletes the skipped rows
        +  afterwards, because OFFSET needs SAP_BASIS 7.51. Pages that start deeper than 10000
        +  rows are rejected for the same reason; adjust both limits to your clients. The limits
        +  are checked before any arithmetic, so a huge $skip cannot overflow.
        +- $orderby: only known properties reach the dynamic ORDER BY, and the key is added last
        +  so that pages stay stable.
        +- A missing authorization returns HTTP 403. Errors in the dynamic SQL become
        +  /IWBEP/CX_MGW_BUSI_EXCEPTION, which the client receives as an error response instead
        +  of a short dump.
        +- The inline declarations in order_by_columns need SAP_BASIS 7.40 SP02, which 7.50 has.
        +- After an upgrade to 7.51 or later the database can skip the rows with OFFSET. That
        +  statement uses the strict syntax check, so separate the dynamic ORDER BY columns with
        +  commas there.
        +
        +
        +Then activate the class, register or refresh the service in /IWFND/MAINT_SERVICE, and
        +test requests such as ProductSet?$filter=CATEGORY eq 'TOOLS'&$orderby=PRICE
        +desc&$top=20&$skip=40&$inlinecount=allpages and ProductSet without $top (it must return
        +1000 rows and a next link) in /IWFND/GW_CLIENT. Errors from this code appear in
        +/IWBEP/ERROR_LOG; framework errors in /IWFND/ERROR_LOG.
        +
        +Make sure an index supports the columns your clients filter and sort by most, and
        +create the authorization object ZFA_PROD with field ACTVT in SU21.
        +
        +Not verified offline: activation against the real generated classes, the exact
        +signature of the generated method on your support package, which $filter expressions
        +get_osql_where_clause( ) converts on your Gateway release, and the constant for HTTP
        +status 403 in CS_HTTP_STATUS_CODES of the exception class (SE24), which you can use
        +instead of the literal.
        --- /dev/null
        +++ b/src/zcl_zfa_product_dpc_ext.clas.abap
        @@ -0,0 +1,174 @@
        +CLASS zcl_zfa_product_dpc_ext DEFINITION PUBLIC
        +  INHERITING FROM zcl_zfa_product_dpc CREATE PUBLIC.
        +  PROTECTED SECTION.
        +    METHODS productset_get_entityset REDEFINITION.
        +  PRIVATE SECTION.
        +    " Largest page the service returns; requests for more get a next link.
        +    CONSTANTS gc_page_size TYPE i VALUE 1000.
        +    " Deepest row a page may start at. Before 7.51 every skipped row is read.
        +    CONSTANTS gc_max_offset TYPE i VALUE 10000.
        +    METHODS order_by_columns
        +      IMPORTING io_request        TYPE REF TO /iwbep/if_mgw_req_entityset
        +      RETURNING VALUE(rt_columns) TYPE string_table
        +      RAISING   /iwbep/cx_mgw_busi_exception.
        +ENDCLASS.
        +
        +CLASS zcl_zfa_product_dpc_ext IMPLEMENTATION.
        +  METHOD productset_get_entityset.
        +    DATA lv_where TYPE string.
        +    DATA lv_filter TYPE string.
        +    DATA lt_orderby TYPE string_table.
        +    DATA lv_orderby TYPE string.
        +    DATA lv_top_text TYPE string.
        +    DATA lv_skiptoken TYPE string.
        +    DATA lv_top TYPE i.
        +    DATA lv_offset TYPE i.
        +    DATA lv_page TYPE i.
        +    DATA lv_rows TYPE i.
        +    DATA lv_lines TYPE i.
        +    DATA lv_count TYPE i.
        +    DATA lv_next_row TYPE i.
        +    DATA lv_next TYPE string.
        +
        +    AUTHORITY-CHECK OBJECT 'ZFA_PROD'
        +      ID 'ACTVT' FIELD '03'.
        +    IF sy-subrc <> 0.
        +      " 403 Forbidden: the client cannot fix this by changing the request.
        +      RAISE EXCEPTION TYPE /iwbep/cx_mgw_busi_exception
        +        EXPORTING
        +          textid           = /iwbep/cx_mgw_busi_exception=>business_error
        +          message          = 'No authorization to display products'
        +          http_status_code = '403'.
        +    ENDIF.
        +
        +    " $filter as a condition on ABAP field names, built by the framework.
        +    lv_where = io_tech_request_context->get_osql_where_clause( ).
        +    lv_filter = io_tech_request_context->get_filter( )->get_filter_string( ).
        +    IF lv_where IS INITIAL AND lv_filter IS NOT INITIAL.
        +      " Never read without the condition the client asked for.
        +      RAISE EXCEPTION TYPE /iwbep/cx_mgw_busi_exception
        +        EXPORTING
        +          textid  = /iwbep/cx_mgw_busi_exception=>business_error
        +          message = 'This $filter is not supported'.
        +    ENDIF.
        +
        +    TRY.
        +        " .../ProductSet/$count asks for the number only.
        +        IF io_tech_request_context->has_count( ) = abap_true.
        +          SELECT COUNT(*) FROM zfa_product INTO lv_count WHERE (lv_where).
        +          es_response_context-count = lv_count.
        +          RETURN.
        +        ENDIF.
        +
        +        " $inlinecount=allpages: all rows that match $filter, before paging.
        +        IF io_tech_request_context->has_inlinecount( ) = abap_true.
        +          SELECT COUNT(*) FROM zfa_product INTO lv_count WHERE (lv_where).
        +          es_response_context-inlinecount = lv_count.
        +        ENDIF.
        +      CATCH cx_sy_dynamic_osql_error.
        +        RAISE EXCEPTION TYPE /iwbep/cx_mgw_busi_exception
        +          EXPORTING
        +            textid  = /iwbep/cx_mgw_busi_exception=>business_error
        +            message = 'The filter cannot be processed'.
        +    ENDTRY.
        +
        +    " get_top( ) is empty without $top. The next link of an earlier page brings
        +    " the position of its first row as $skiptoken, without $skip.
        +    lv_top_text = io_tech_request_context->get_top( ).
        +    lv_skiptoken = io_tech_request_context->get_skiptoken( ).
        +    TRY.
        +        IF lv_skiptoken IS INITIAL.
        +          lv_offset = io_tech_request_context->get_skip( ).
        +        ELSE.
        +          lv_offset = lv_skiptoken.
        +        ENDIF.
        +        lv_top = lv_top_text.
        +      CATCH cx_sy_conversion_error.
        +        RAISE EXCEPTION TYPE /iwbep/cx_mgw_busi_exception
        +          EXPORTING
        +            textid  = /iwbep/cx_mgw_busi_exception=>business_error
        +            message = 'Invalid $top, $skip, or $skiptoken'.
        +    ENDTRY.
        +    IF lv_offset < 0 OR lv_top < 0 OR lv_offset > gc_max_offset.
        +      RAISE EXCEPTION TYPE /iwbep/cx_mgw_busi_exception
        +        EXPORTING
        +          textid  = /iwbep/cx_mgw_busi_exception=>business_error
        +          message = 'Page starts too deep; narrow the result with $filter'.
        +    ENDIF.
        +
        +    " Page size: $top, but at most gc_page_size rows. $top=0 asks for no rows.
        +    IF lv_top_text IS INITIAL OR lv_top > gc_page_size.
        +      lv_page = gc_page_size.
        +    ELSE.
        +      lv_page = lv_top.
        +    ENDIF.
        +    IF lv_page = 0.
        +      RETURN.
        +    ENDIF.
        +
        +    lt_orderby = order_by_columns( io_tech_request_context ).
        +    CONCATENATE LINES OF lt_orderby INTO lv_orderby SEPARATED BY space.
        +
        +    " Read rows up to the end of the page only (OFFSET needs SAP_BASIS 7.51).
        +    lv_rows = lv_offset + lv_page.
        +    TRY.
        +        SELECT product_id name category price currency
        +          FROM zfa_product
        +          UP TO lv_rows ROWS
        +          INTO CORRESPONDING FIELDS OF TABLE et_entityset
        +          WHERE (lv_where)
        +          ORDER BY (lv_orderby).
        +      CATCH cx_sy_dynamic_osql_error.
        +        RAISE EXCEPTION TYPE /iwbep/cx_mgw_busi_exception
        +          EXPORTING
        +            textid  = /iwbep/cx_mgw_busi_exception=>business_error
        +            message = 'The filter or sort order cannot be processed'.
        +    ENDTRY.
        +    IF lv_offset > 0.
        +      DELETE et_entityset TO lv_offset.
        +    ENDIF.
        +
        +    " A full page while the client asked for more: the framework turns the
        +    " skiptoken, the position of the next row, into a next link.
        +    DESCRIBE TABLE et_entityset LINES lv_lines.
        +    IF lv_lines = lv_page AND ( lv_top_text IS INITIAL OR lv_top > lv_page ).
        +      lv_next_row = lv_offset + lv_page.
        +      lv_next = lv_next_row.
        +      CONDENSE lv_next.
        +      es_response_context-skiptoken = lv_next.
        +    ENDIF.
        +  ENDMETHOD.
        +
        +  METHOD order_by_columns.
        +    DATA lv_property TYPE string.
        +    DATA lv_column TYPE string.
        +    DATA lv_key_sorted TYPE abap_bool.
        +
        +    DATA(lt_order) = io_request->get_orderby( ).
        +    LOOP AT lt_order INTO DATA(ls_order).
        +      lv_property = ls_order-property.
        +      TRANSLATE lv_property TO UPPER CASE.
        +      " The property comes from the request: allow known columns only.
        +      CASE lv_property.
        +        WHEN 'PRODUCT_ID'.
        +          lv_key_sorted = abap_true.
        +        WHEN 'NAME' OR 'CATEGORY' OR 'PRICE'.
        +        WHEN OTHERS.
        +          RAISE EXCEPTION TYPE /iwbep/cx_mgw_busi_exception
        +            EXPORTING
        +              textid  = /iwbep/cx_mgw_busi_exception=>business_error
        +              message = 'Sorting by this property is not supported'.
        +      ENDCASE.
        +      IF ls_order-order = 'desc'.
        +        CONCATENATE lv_property 'DESCENDING' INTO lv_column SEPARATED BY space.
        +      ELSE.
        +        CONCATENATE lv_property 'ASCENDING' INTO lv_column SEPARATED BY space.
        +      ENDIF.
        +      APPEND lv_column TO rt_columns.
        +    ENDLOOP.
        +    " The key last, so that pages stay stable when sort values repeat.
        +    IF lv_key_sorted = abap_false.
        +      APPEND 'PRODUCT_ID ASCENDING' TO rt_columns.
        +    ENDIF.
        +  ENDMETHOD.
        +ENDCLASS.
    graders:
      - type: run-command
        name: checks-segw-entityset-paging-ehp8
        config:
          command: node
          args: [".vally/grade.mjs", "sap-abap-integration", "segw_entityset_paging_ehp8"]
          timeout: 120s
  - name: arfc-parallel-counts-ehp6
    prompt: |-
      Our ECC 6.0 EHP6 system (SAP_BASIS 7.31, IBM Db2, on Google Cloud virtual machines) must
      count the open items of up to 200 company codes. One company code can take a minute,
      so the counts must run in parallel on the application servers of the system, with at
      most 5 running at the same time. Print one line per company code with the count or the
      error. Our remote-enabled function module Z_FA_OPEN_ITEMS_COUNT has IMPORTING IV_BUKRS
      TYPE BUKRS and EXPORTING EV_ITEMS TYPE I. Write the report.

      Write your explanation to answer.md and each code object to its own file.
    tags:
      scenario: arfc_parallel_counts_ehp6
      labels: "rfc arfc parallel ecc release-aware iaas"
    golden_patch:
      inline: |
        --- /dev/null
        +++ b/answer.md
        @@ -0,0 +1,26 @@
        +Target assumed: SAP ECC 6.0 EHP6, SAP_BASIS 7.31, IBM Db2. Running on Google Cloud
        +virtual machines does not change the ABAP.
        +
        +How the report works:
        +
        +- Each company code runs as an asynchronous RFC (STARTING NEW TASK) on a server of the
        +  system, chosen with DESTINATION IN GROUP DEFAULT; an RFC server group from RZ12 works
        +  the same way.
        +- A public callback method collects each result with RECEIVE RESULTS, which it must
        +  always execute, and stores the count or the error per task.
        +- At most p_tasks calls run at the same time: before each start the report waits with
        +  WAIT UNTIL until fewer are running. RESOURCE_FAILURE means that no server of the group
        +  has free resources; the report then waits until one of its own tasks ends and tries
        +  again, up to ten times.
        +- The modern wait statement for callbacks, available from SAP_BASIS 7.40 SP02, is a
        +  syntax error on 7.31, so the report uses WAIT UNTIL ... UP TO ... SECONDS.
        +- Task IDs have at most eight characters (ZFA00001), as the 7.31 keyword documentation
        +  requires.
        +- Every call and every WAIT commits the database, so the company codes are read into an
        +  internal table before the loop.
        +
        +
        +The users who run the report need S_RFC for the function group of
        +Z_FA_OPEN_ITEMS_COUNT, because the calls run through RFC. Not verified offline:
        +activation, the resources of the servers in RZ12 or the default group, and the run
        +time with real data.
        --- /dev/null
        +++ b/src/zfa_parallel_counts.prog.abap
        @@ -0,0 +1,109 @@
        +REPORT zfa_parallel_counts.
        +
        +DATA gv_bukrs TYPE bukrs.
        +
        +SELECT-OPTIONS s_bukrs FOR gv_bukrs.
        +PARAMETERS p_tasks TYPE i DEFAULT 5.
        +
        +CLASS lcl_receiver DEFINITION FINAL.
        +  PUBLIC SECTION.
        +    TYPES: BEGIN OF ty_result,
        +             task    TYPE c LENGTH 8,
        +             bukrs   TYPE bukrs,
        +             items   TYPE i,
        +             subrc   TYPE sysubrc,
        +             message TYPE c LENGTH 255,
        +           END OF ty_result,
        +           tt_results TYPE STANDARD TABLE OF ty_result WITH DEFAULT KEY.
        +    DATA mt_results TYPE tt_results.
        +    DATA mv_running TYPE i.
        +    METHODS on_end_of_task IMPORTING p_task TYPE clike.
        +ENDCLASS.
        +
        +CLASS lcl_receiver IMPLEMENTATION.
        +  METHOD on_end_of_task.
        +    DATA ls_result TYPE ty_result.
        +
        +    RECEIVE RESULTS FROM FUNCTION 'Z_FA_OPEN_ITEMS_COUNT'
        +      IMPORTING
        +        ev_items              = ls_result-items
        +      EXCEPTIONS
        +        system_failure        = 1 MESSAGE ls_result-message
        +        communication_failure = 2 MESSAGE ls_result-message
        +        OTHERS                = 3.
        +    ls_result-subrc = sy-subrc.
        +    MODIFY mt_results FROM ls_result TRANSPORTING items subrc message
        +      WHERE task = p_task.
        +    mv_running = mv_running - 1.
        +  ENDMETHOD.
        +ENDCLASS.
        +
        +DATA go_receiver TYPE REF TO lcl_receiver.
        +DATA gt_company_codes TYPE STANDARD TABLE OF bukrs WITH DEFAULT KEY.
        +DATA gs_result TYPE lcl_receiver=>ty_result.
        +DATA gv_task_number TYPE n LENGTH 5.
        +DATA gv_running TYPE i.
        +DATA gv_message TYPE c LENGTH 255.
        +
        +START-OF-SELECTION.
        +  CREATE OBJECT go_receiver.
        +  SELECT bukrs FROM t001 INTO TABLE gt_company_codes
        +    WHERE bukrs IN s_bukrs
        +    ORDER BY bukrs.
        +
        +  LOOP AT gt_company_codes INTO gv_bukrs.
        +    gv_task_number = sy-tabix.
        +    CLEAR gs_result.
        +    CONCATENATE 'ZFA' gv_task_number INTO gs_result-task.
        +    gs_result-bukrs = gv_bukrs.
        +    APPEND gs_result TO go_receiver->mt_results.
        +
        +    DO 10 TIMES.
        +      " Keep at most p_tasks calls running at the same time.
        +      WAIT UNTIL go_receiver->mv_running < p_tasks UP TO 600 SECONDS.
        +      go_receiver->mv_running = go_receiver->mv_running + 1.
        +      CALL FUNCTION 'Z_FA_OPEN_ITEMS_COUNT'
        +        STARTING NEW TASK gs_result-task
        +        DESTINATION IN GROUP DEFAULT
        +        CALLING go_receiver->on_end_of_task ON END OF TASK
        +        EXPORTING
        +          iv_bukrs              = gv_bukrs
        +        EXCEPTIONS
        +          system_failure        = 1 MESSAGE gv_message
        +          communication_failure = 2 MESSAGE gv_message
        +          resource_failure      = 3
        +          OTHERS                = 4.
        +      gs_result-subrc = sy-subrc.
        +      IF gs_result-subrc = 0.
        +        EXIT.
        +      ENDIF.
        +      go_receiver->mv_running = go_receiver->mv_running - 1.
        +      IF gs_result-subrc <> 3.
        +        EXIT.
        +      ENDIF.
        +      " RESOURCE_FAILURE: wait until one of our tasks ends, then try again.
        +      gv_running = go_receiver->mv_running.
        +      IF gv_running > 0.
        +        WAIT UNTIL go_receiver->mv_running < gv_running UP TO 600 SECONDS.
        +      ELSE.
        +        WAIT UP TO 1 SECONDS.
        +      ENDIF.
        +    ENDDO.
        +
        +    IF gs_result-subrc <> 0.
        +      IF gs_result-subrc = 3.
        +        gs_result-message = 'No free resources in RFC server group DEFAULT'.
        +      ELSE.
        +        gs_result-message = gv_message.
        +      ENDIF.
        +      MODIFY go_receiver->mt_results FROM gs_result TRANSPORTING subrc message
        +        WHERE task = gs_result-task.
        +    ENDIF.
        +  ENDLOOP.
        +
        +  " Wait for the remaining callbacks.
        +  WAIT UNTIL go_receiver->mv_running = 0 UP TO 600 SECONDS.
        +
        +  LOOP AT go_receiver->mt_results INTO gs_result.
        +    WRITE: / gs_result-bukrs, gs_result-items, gs_result-subrc, gs_result-message.
        +  ENDLOOP.
    graders:
      - type: run-command
        name: checks-arfc-parallel-counts-ehp6
        config:
          command: node
          args: [".vally/grade.mjs", "sap-abap-integration", "arfc_parallel_counts_ehp6"]
          timeout: 120s
  - name: idoc-outbound-commit-ehp6
    prompt: |-
      On ECC 6.0 EHP6 (SAP_BASIS 7.31, Oracle) we must send orders from our tables ZFA_ORDER
      (ORDER_ID, CUSTOMER, ORDER_DATE, CURRENCY, EXT_REF) and ZFA_ORDER_ITEM (ORDER_ID,
      ITEM_NO, MATERIAL, QUANTITY, UNIT) to a partner system as IDocs of our message type
      ZFA_ORDER, basic type ZFA_ORDER01. Segment Z1FA_ORDER_HDR has ORDER_ID, CUSTOMER,
      ORDER_DATE, CURRENCY, and EXT_REF; segment Z1FA_ORDER_ITM has MATERIAL, QUANTITY, and
      UNIT. The receiver is maintained in the distribution model. Write a report that sends
      one order and tells the user what happened, and list the configuration we need.

      Write your explanation to answer.md and each code object to its own file.
    tags:
      scenario: idoc_outbound_commit_ehp6
      labels: "idoc ale outbound commit ecc"
    golden_patch:
      inline: |
        --- /dev/null
        +++ b/answer.md
        @@ -0,0 +1,28 @@
        +Target assumed: SAP ECC 6.0 EHP6, SAP_BASIS 7.31, Oracle. MASTER_IDOC_DISTRIBUTE and the
        +IDoc interface have not changed for many releases, and the report uses classic syntax.
        +
        +How the report works:
        +
        +- The control record gets only MESTYP and IDOCTP. RCVPRT and RCVPRN stay empty, so ALE
        +  takes the receivers from the distribution model (BD64).
        +- Each data record holds SEGNAM and the segment structure in SDATA.
        +- The explicit commit after MASTER_IDOC_DISTRIBUTE is mandatory: without it the IDoc is
        +  created but never sent, and the database commit at the end of the program is not
        +  enough.
        +- If the distribution model has no receiver, the function raises no exception and
        +  returns an empty COMMUNICATION_IDOC_CONTROL table, so the report checks it.
        +
        +
        +Configuration in the sending system:
        +
        +1. Logical systems in BD54, and the own logical system assigned to the client in SCC4.
        +2. SM59: an ABAP connection (type 3) to the partner system, with the logon data there.
        +3. WE21: a transactional RFC port that uses this destination.
        +4. BD64: a distribution model view with message type ZFA_ORDER from the own logical
        +   system to the partner's logical system.
        +5. WE20: the outbound partner profile of the partner (partner type LS, BD82 can generate
        +   it from BD64) with message type ZFA_ORDER, the port, output mode, and basic type
        +   ZFA_ORDER01. WE82 must assign ZFA_ORDER to ZFA_ORDER01.
        +
        +Watch the IDocs in WE02 or WE05 and the tRFC calls of the port in SM58. Not verified
        +offline: activation, the segment definitions, and a test with the partner system.
        --- /dev/null
        +++ b/src/zfa_order_idoc_send.prog.abap
        @@ -0,0 +1,71 @@
        +REPORT zfa_order_idoc_send.
        +
        +PARAMETERS p_order TYPE zfa_order_id OBLIGATORY.
        +
        +DATA gs_order TYPE zfa_order.
        +DATA gt_items TYPE STANDARD TABLE OF zfa_order_item WITH DEFAULT KEY.
        +DATA gs_item TYPE zfa_order_item.
        +DATA gs_header_segment TYPE z1fa_order_hdr.
        +DATA gs_item_segment TYPE z1fa_order_itm.
        +DATA gs_control TYPE edidc.
        +DATA gt_data TYPE STANDARD TABLE OF edidd WITH DEFAULT KEY.
        +DATA gs_data TYPE edidd.
        +DATA gt_created TYPE STANDARD TABLE OF edidc WITH DEFAULT KEY.
        +DATA gs_created TYPE edidc.
        +
        +START-OF-SELECTION.
        +  SELECT SINGLE * FROM zfa_order INTO gs_order WHERE order_id = p_order.
        +  IF sy-subrc <> 0.
        +    MESSAGE e398(00) WITH 'Order' p_order 'does not exist'.
        +  ENDIF.
        +  SELECT * FROM zfa_order_item INTO TABLE gt_items WHERE order_id = p_order.
        +
        +  " Receivers come from the distribution model (BD64): RCVPRT and RCVPRN stay empty.
        +  gs_control-mestyp = 'ZFA_ORDER'.
        +  gs_control-idoctp = 'ZFA_ORDER01'.
        +
        +  gs_header_segment-order_id   = gs_order-order_id.
        +  gs_header_segment-customer   = gs_order-customer.
        +  gs_header_segment-order_date = gs_order-order_date.
        +  gs_header_segment-currency   = gs_order-currency.
        +  gs_header_segment-ext_ref    = gs_order-ext_ref.
        +  gs_data-segnam = 'Z1FA_ORDER_HDR'.
        +  gs_data-sdata  = gs_header_segment.
        +  APPEND gs_data TO gt_data.
        +
        +  LOOP AT gt_items INTO gs_item.
        +    CLEAR: gs_item_segment, gs_data.
        +    gs_item_segment-material = gs_item-material.
        +    gs_item_segment-quantity = gs_item-quantity.
        +    gs_item_segment-unit     = gs_item-unit.
        +    gs_data-segnam = 'Z1FA_ORDER_ITM'.
        +    gs_data-sdata  = gs_item_segment.
        +    APPEND gs_data TO gt_data.
        +  ENDLOOP.
        +
        +  CALL FUNCTION 'MASTER_IDOC_DISTRIBUTE'
        +    EXPORTING
        +      master_idoc_control            = gs_control
        +    TABLES
        +      communication_idoc_control     = gt_created
        +      master_idoc_data               = gt_data
        +    EXCEPTIONS
        +      error_in_idoc_control          = 1
        +      error_writing_idoc_status      = 2
        +      error_in_idoc_data             = 3
        +      sending_logical_system_unknown = 4
        +      OTHERS                         = 5.
        +  IF sy-subrc <> 0.
        +    " 1: message type or IDoc type wrong; 4: own logical system missing (BD54, SCC4).
        +    MESSAGE e398(00) WITH 'MASTER_IDOC_DISTRIBUTE failed, return code' sy-subrc.
        +  ENDIF.
        +
        +  " Mandatory: without COMMIT WORK the IDocs exist but are never sent.
        +  COMMIT WORK.
        +
        +  IF gt_created IS INITIAL.
        +    WRITE: / 'No IDoc created: no receiver for ZFA_ORDER in the distribution model.'.
        +  ENDIF.
        +  LOOP AT gt_created INTO gs_created.
        +    WRITE: / 'IDoc', gs_created-docnum, 'for', gs_created-rcvprn, 'status', gs_created-status.
        +  ENDLOOP.
    graders:
      - type: run-command
        name: checks-idoc-outbound-commit-ehp6
        config:
          command: node
          args: [".vally/grade.mjs", "sap-abap-integration", "idoc_outbound_commit_ehp6"]
          timeout: 120s
  - name: bapi-function-module-ehp4
    prompt: |-
      Our ECC 6.0 EHP4 system (SAP_BASIS 7.01, SAP MaxDB) needs a remote-enabled function
      module Z_FA_ORDER_CREATE in function group ZFA_ORDER_API that creates an order in our
      tables ZFA_ORDER (ORDER_ID, CUSTOMER, ORDER_DATE, CURRENCY, EXT_REF) and ZFA_ORDER_ITEM
      (ORDER_ID, ITEM_NO, MATERIAL, QUANTITY, UNIT). Other SAP systems will call it by RFC,
      our own programs and our IDoc inbound processing call it locally. Input: IS_HEADER
      (structure ZFA_S_ORDER_HEADER with CUSTOMER, ORDER_DATE, CURRENCY, EXT_REF) and the
      table IT_ITEMS (ZFA_S_ORDER_ITEM with MATERIAL, QUANTITY, UNIT); output: EV_ORDER_ID
      (data element ZFA_ORDER_ID). Order numbers come from number range object ZFA_ORDER,
      interval 01. Messages are in message class ZFA_ORDER, and authorization object ZFA_ORDER
      has the field ACTVT. Write it so that the callers stay in control of the transaction.

      Write your explanation to answer.md and each code object to its own file.
    tags:
      scenario: bapi_function_module_ehp4
      labels: "bapi rfc commit ecc release-aware"
    golden_patch:
      inline: |
        --- /dev/null
        +++ b/answer.md
        @@ -0,0 +1,39 @@
        +Target assumed: SAP ECC 6.0 EHP4, SAP_BASIS 7.01, SAP MaxDB. The code uses classic
        +syntax and 'X' instead of abap_true, because on 7.01 the constants of type pool ABAP need
        +TYPE-POOLS abap.
        +
        +Set the attribute "Remote-Enabled Module" in SE37 and maintain the interface shown in
        +the comment block. The rules the function follows, from SAP's BAPI programming guide:
        +
        +- It never commits and calls no transaction or report. The order is written by the
        +  update module Z_FA_ORDER_SAVE, which runs only when the caller commits, so a caller
        +  can post several documents in one LUW or roll everything back. An RFC call ends with a
        +  database commit in the called system, which is another reason to write only through
        +  the update task.
        +- Every error goes into RETURN (BAPIRET2). MESSAGE ... INTO fills the text without
        +  sending a message, because a message of type E or A would end an RFC call with
        +  SYSTEM_FAILURE. The interface declares no class-based exceptions, which cannot cross
        +  RFC in customer releases.
        +- It checks the authorization itself; S_RFC only decides who may call the function
        +  group.
        +- IV_TESTRUN runs all checks, writes nothing, and draws no order number.
        +- All parameters are passed by value, and RFC does not check their typing, so the
        +  function validates its input.
        +
        +
        +The helper that turns the current message into a RETURN line, in an include of the
        +same function group:
        +
        +
        +The update module (SE37, processing type Update Module, start immediately). It runs in
        +the update task after the caller's commit; a termination message there rolls back the
        +whole update, so no half-saved order remains:
        +
        +
        +Callers check RETURN for type E or A and then call BAPI_TRANSACTION_COMMIT or
        +BAPI_TRANSACTION_ROLLBACK; remote callers do so through the same destination. Create
        +messages 001 to 005 and 010 in message class ZFA_ORDER, and give RFC users S_RFC for
        +function group ZFA_ORDER_API.
        +
        +Not verified offline: the interface, which SE37 keeps outside the source, activation,
        +and the field names of ZFA_ORDER and ZFA_ORDER_ITEM.
        --- /dev/null
        +++ b/src/zfa_order_api.fugr.z_fa_order_create.abap
        @@ -0,0 +1,74 @@
        +FUNCTION z_fa_order_create.
        +*"----------------------------------------------------------------------
        +*"*"Local Interface:
        +*"  IMPORTING
        +*"     VALUE(IS_HEADER) TYPE  ZFA_S_ORDER_HEADER
        +*"     VALUE(IV_TESTRUN) TYPE  TESTRUN DEFAULT SPACE
        +*"  EXPORTING
        +*"     VALUE(EV_ORDER_ID) TYPE  ZFA_ORDER_ID
        +*"  TABLES
        +*"      IT_ITEMS STRUCTURE  ZFA_S_ORDER_ITEM
        +*"      RETURN STRUCTURE  BAPIRET2
        +*"----------------------------------------------------------------------
        +  DATA lv_text TYPE bapi_msg.
        +  DATA lv_lines TYPE i.
        +  DATA lv_order_id TYPE zfa_order_id.
        +
        +  CLEAR ev_order_id.
        +  CLEAR return[].
        +
        +  AUTHORITY-CHECK OBJECT 'ZFA_ORDER'
        +    ID 'ACTVT' FIELD '01'.
        +  IF sy-subrc <> 0.
        +    MESSAGE e001(zfa_order) INTO lv_text.
        +    PERFORM append_message TABLES return.
        +    RETURN.
        +  ENDIF.
        +
        +* Validate everything first and report all errors together.
        +  IF is_header-customer IS INITIAL.
        +    MESSAGE e002(zfa_order) INTO lv_text.
        +    PERFORM append_message TABLES return.
        +  ENDIF.
        +  DESCRIBE TABLE it_items LINES lv_lines.
        +  IF lv_lines = 0.
        +    MESSAGE e003(zfa_order) INTO lv_text.
        +    PERFORM append_message TABLES return.
        +  ENDIF.
        +  READ TABLE return TRANSPORTING NO FIELDS WITH KEY type = 'E'.
        +  IF sy-subrc = 0.
        +    RETURN.
        +  ENDIF.
        +
        +  IF iv_testrun = 'X'.
        +    MESSAGE s004(zfa_order) INTO lv_text.
        +    PERFORM append_message TABLES return.
        +    RETURN.
        +  ENDIF.
        +
        +  CALL FUNCTION 'NUMBER_GET_NEXT'
        +    EXPORTING
        +      nr_range_nr = '01'
        +      object      = 'ZFA_ORDER'
        +    IMPORTING
        +      number      = lv_order_id
        +    EXCEPTIONS
        +      OTHERS      = 1.
        +  IF sy-subrc <> 0.
        +    MESSAGE e005(zfa_order) INTO lv_text.
        +    PERFORM append_message TABLES return.
        +    RETURN.
        +  ENDIF.
        +
        +* Registered now, executed when the caller commits.
        +  CALL FUNCTION 'Z_FA_ORDER_SAVE' IN UPDATE TASK
        +    EXPORTING
        +      iv_order_id = lv_order_id
        +      is_header   = is_header
        +    TABLES
        +      it_items    = it_items.
        +
        +  ev_order_id = lv_order_id.
        +  MESSAGE s010(zfa_order) WITH lv_order_id INTO lv_text.
        +  PERFORM append_message TABLES return.
        +ENDFUNCTION.
        --- /dev/null
        +++ b/src/zfa_order_api.fugr.lzfa_order_apif01.abap
        @@ -0,0 +1,19 @@
        +*----------------------------------------------------------------------*
        +* Append the current system message to RETURN. Call it directly after
        +* MESSAGE ... INTO, which fills sy-msgty, sy-msgid, sy-msgno, sy-msgv1-4.
        +*----------------------------------------------------------------------*
        +FORM append_message TABLES pt_return STRUCTURE bapiret2.
        +  DATA ls_return TYPE bapiret2.
        +
        +  ls_return-type       = sy-msgty.
        +  ls_return-id         = sy-msgid.
        +  ls_return-number     = sy-msgno.
        +  ls_return-message_v1 = sy-msgv1.
        +  ls_return-message_v2 = sy-msgv2.
        +  ls_return-message_v3 = sy-msgv3.
        +  ls_return-message_v4 = sy-msgv4.
        +  MESSAGE ID sy-msgid TYPE sy-msgty NUMBER sy-msgno
        +          WITH sy-msgv1 sy-msgv2 sy-msgv3 sy-msgv4
        +          INTO ls_return-message.
        +  APPEND ls_return TO pt_return.
        +ENDFORM.
        --- /dev/null
        +++ b/src/zfa_order_api.fugr.z_fa_order_save.abap
        @@ -0,0 +1,32 @@
        +FUNCTION z_fa_order_save.
        +*"----------------------------------------------------------------------
        +*"*"Local Interface:
        +*"  IMPORTING
        +*"     VALUE(IV_ORDER_ID) TYPE  ZFA_ORDER_ID
        +*"     VALUE(IS_HEADER) TYPE  ZFA_S_ORDER_HEADER
        +*"  TABLES
        +*"      IT_ITEMS STRUCTURE  ZFA_S_ORDER_ITEM
        +*"----------------------------------------------------------------------
        +  DATA ls_order TYPE zfa_order.
        +  DATA ls_item TYPE zfa_s_order_item.
        +  DATA ls_db_item TYPE zfa_order_item.
        +  DATA lt_db_items TYPE STANDARD TABLE OF zfa_order_item WITH DEFAULT KEY.
        +  DATA lv_item_no TYPE i.
        +
        +  MOVE-CORRESPONDING is_header TO ls_order.
        +  ls_order-order_id = iv_order_id.
        +  LOOP AT it_items INTO ls_item.
        +    lv_item_no = lv_item_no + 1.
        +    CLEAR ls_db_item.
        +    MOVE-CORRESPONDING ls_item TO ls_db_item.
        +    ls_db_item-order_id = iv_order_id.
        +    ls_db_item-item_no  = lv_item_no.
        +    APPEND ls_db_item TO lt_db_items.
        +  ENDLOOP.
        +
        +  INSERT zfa_order FROM ls_order.
        +  IF sy-subrc <> 0.
        +    MESSAGE a398(00) WITH 'Order' iv_order_id 'already exists'.
        +  ENDIF.
        +  INSERT zfa_order_item FROM TABLE lt_db_items.
        +ENDFUNCTION.
    graders:
      - type: run-command
        name: checks-bapi-function-module-ehp4
        config:
          command: node
          args: [".vally/grade.mjs", "sap-abap-integration", "bapi_function_module_ehp4"]
          timeout: 120s
scoring:
  threshold: 1.0
