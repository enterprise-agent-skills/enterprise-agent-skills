# Offline: `npm run eval:vally` runs `vally oracle` (golden patches) and a baseline negative control.
# Live (optional, needs a Copilot token): see docs/testing.md.
name: salesforce-apex-trigger-framework-deterministic
description: Deterministic checks for the salesforce-apex-trigger-framework skill, generated from its scenarios.
version: "1.0"
type: capability
defaults:
  runs: 1
  timeout: 10m
agent_environment:
  skills:
    - ../../../../plugins/salesforce-platform/skills/salesforce-apex-trigger-framework
grading_environment:
  files:
    - src: ../../../harness/vally-grade.mjs
      dest: .vally/grade.mjs
stimuli:
  - name: bulk-safe-trigger-handler
    prompt: |-
      When an Opportunity becomes Closed Won, create a follow-up Task for the owner that
      mentions the account name. Block saving an Opportunity as Closed Won when Amount is
      empty. Data loads update thousands of opportunities at once. Write the trigger and
      handler class.

      Write your explanation to answer.md and each code object to its own file.
    tags:
      scenario: bulk_safe_trigger_handler
      labels: "basic bulkification recursion security"
    golden_patch:
      inline: |
        --- /dev/null
        +++ b/answer.md
        @@ -0,0 +1,1 @@
        +Data access runs in user mode so the running user's object and field permissions apply.
        --- /dev/null
        +++ b/force-app/main/default/triggers/OpportunityTrigger.trigger
        @@ -0,0 +1,3 @@
        +trigger OpportunityTrigger on Opportunity (before insert, before update, after insert, after update) {
        +    new OpportunityTriggerHandler().run();
        +}
        --- /dev/null
        +++ b/force-app/main/default/classes/OpportunityTriggerHandler.cls
        @@ -0,0 +1,54 @@
        +public with sharing class OpportunityTriggerHandler {
        +    private static final String CLOSED_WON = 'Closed Won';
        +    @TestVisible
        +    private static Set<Id> processedIds = new Set<Id>();
        +
        +    public void run() {
        +        switch on Trigger.operationType {
        +            when BEFORE_INSERT, BEFORE_UPDATE {
        +                requireAmountWhenWon((List<Opportunity>) Trigger.new);
        +            }
        +            when AFTER_INSERT, AFTER_UPDATE {
        +                createFollowUpTasks((List<Opportunity>) Trigger.new, (Map<Id, Opportunity>) Trigger.oldMap);
        +            }
        +        }
        +    }
        +
        +    private void requireAmountWhenWon(List<Opportunity> records) {
        +        for (Opportunity opp : records) {
        +            if (opp.StageName == CLOSED_WON && opp.Amount == null) {
        +                opp.addError(Opportunity.Amount, 'Enter an Amount before setting the stage to Closed Won.');
        +            }
        +        }
        +    }
        +
        +    private void createFollowUpTasks(List<Opportunity> records, Map<Id, Opportunity> oldMap) {
        +        List<Opportunity> becameWon = new List<Opportunity>();
        +        Set<Id> accountIds = new Set<Id>();
        +        for (Opportunity opp : records) {
        +            Boolean wasWon = oldMap != null && oldMap.get(opp.Id).StageName == CLOSED_WON;
        +            if (opp.StageName == CLOSED_WON && !wasWon && !processedIds.contains(opp.Id)) {
        +                becameWon.add(opp);
        +                processedIds.add(opp.Id);
        +                accountIds.add(opp.AccountId);
        +            }
        +        }
        +        if (becameWon.isEmpty()) {
        +            return;
        +        }
        +        Map<Id, Account> accounts = new Map<Id, Account>(
        +            [SELECT Id, Name FROM Account WHERE Id IN :accountIds WITH USER_MODE]
        +        );
        +        List<Task> tasks = new List<Task>();
        +        for (Opportunity opp : becameWon) {
        +            Account acc = accounts.get(opp.AccountId);
        +            tasks.add(new Task(
        +                WhatId = opp.Id,
        +                OwnerId = opp.OwnerId,
        +                Subject = 'Kick-off call' + (acc == null ? '' : ' with ' + acc.Name),
        +                ActivityDate = Date.today().addDays(3)
        +            ));
        +        }
        +        Database.insert(tasks, AccessLevel.USER_MODE);
        +    }
        +}
    graders:
      - type: run-command
        name: checks-bulk-safe-trigger-handler
        config:
          command: node
          args: [".vally/grade.mjs", "salesforce-apex-trigger-framework", "bulk_safe_trigger_handler"]
          timeout: 120s
  - name: trigger-unit-tests
    prompt: |-
      Write the Apex test class for OpportunityTriggerHandler. It must prove the handler works
      for a full batch of records and that saving Closed Won without an Amount fails.
    tags:
      scenario: trigger_unit_tests
      labels: "testing bulkification"
    golden_patch:
      inline: |
        --- /dev/null
        +++ b/force-app/main/default/classes/OpportunityTriggerHandlerTest.cls
        @@ -0,0 +1,38 @@
        +@IsTest
        +private class OpportunityTriggerHandlerTest {
        +    @TestSetup
        +    static void createData() {
        +        Account acc = new Account(Name = 'Contoso');
        +        insert acc;
        +        List<Opportunity> opps = new List<Opportunity>();
        +        for (Integer i = 0; i < 200; i++) {
        +            opps.add(new Opportunity(Name = 'Deal ' + i, AccountId = acc.Id,
        +                StageName = 'Prospecting', CloseDate = Date.today().addDays(30), Amount = 1000));
        +        }
        +        insert opps;
        +    }
        +
        +    @IsTest
        +    static void createsOneTaskPerOpportunityInABulkUpdate() {
        +        List<Opportunity> opps = [SELECT Id FROM Opportunity];
        +        for (Opportunity opp : opps) {
        +            opp.StageName = 'Closed Won';
        +        }
        +        Test.startTest();
        +        update opps;
        +        Test.stopTest();
        +        Integer taskCount = [SELECT COUNT() FROM Task WHERE WhatId IN :opps];
        +        Assert.areEqual(200, taskCount, 'Expected one follow-up task per won opportunity.');
        +    }
        +
        +    @IsTest
        +    static void blocksClosedWonWithoutAmount() {
        +        Opportunity opp = [SELECT Id FROM Opportunity LIMIT 1];
        +        opp.StageName = 'Closed Won';
        +        opp.Amount = null;
        +        Test.startTest();
        +        Database.SaveResult result = Database.update(opp, false);
        +        Test.stopTest();
        +        Assert.isFalse(result.isSuccess(), 'The update should fail without an Amount.');
        +    }
        +}
    graders:
      - type: run-command
        name: checks-trigger-unit-tests
        config:
          command: node
          args: [".vally/grade.mjs", "salesforce-apex-trigger-framework", "trigger_unit_tests"]
          timeout: 120s
scoring:
  threshold: 1.0
