  - name: sd_save_check_user_exit
    description: Customizing first; the SD user exit is named honestly as a modification, keeps SAP's logical unit of work intact, and its dialog and BAPI effects are stated.
    prompt: |
      We run SAP ECC 6.0 EHP7 with SAP_BASIS 7.40 SP08 on IBM Db2 in Azure. Sales wants this
      rule: standard orders (order type ZOR) in sales organization 1000 with a net value of
      10,000 EUR or more must not be saved without an approval number. We already added the
      field ZZAPPROVAL to VBAK with an append structure and show it on the header screen.
      Where and how should we implement the check?
    environment:
      product: ecc
      release: ehp7
      support_package: 8
      database: anydb
      deployment: azure-iaas
    expected_patterns:
      - '(?i)Customizing'
      - '(?i)incomplet'
      - '(?i)USEREXIT_SAVE_DOCUMENT_PREPARE'
      - '(?i)MV45AFZZ'
      - '(?i)(?:\b(?:is|are|remains?|stays?|considered)\s+|\bcounts?\s+as\s+|\b(?:classif|treat|document|rat|list)\w*\s+(?:\w+\s+){0,4}as\s+|\btype\s+)(?:still\s+|\w+ly\s+)?(?:an?\s+)?\W{0,2}modifications?\b'
      - '(?i)(?:object|access)\s+key|SSCR'
    forbidden_patterns:
      - '(?i)^\s*COMMIT\s+WORK(?:\s+AND\s+WAIT)?\s*\.'
      - '(?i)^\s*ROLLBACK\s+WORK\s*\.'
      - '(?i)^\s*(?:INSERT\s+(?:INTO\s+)?|UPDATE\s+|MODIFY\s+|DELETE\s+(?:FROM\s+)?)(?:vbak|vbap|vbkd|vbep)\b(?:\s+(?:CLIENT\s+SPECIFIED|USING\s+CLIENT\s+\S+))?\s+(?:FROM|SET|VALUES|WHERE)\b'
      - '(?i)^\s*CALL\s+TRANSACTION\s+(?:''|\(|[a-z_]\w*\s*(?:\.|AND\b|USING\b|WITH\b))'
      - '(?i)^\s*SUBMIT\s+(?:\(|[zy]\w*[_\d]\w*\b|r\w*\d|\w+\s+AND\s+RETURN\b|\w+\s+VIA\s+SELECTION-SCREEN\b)'
      - '(?i)^\s*FORM\s+userexit_save_document\s*\.(?:(?!^\s*ENDFORM\b)[\s\S])*?^\s*MESSAGE\b'
      - '(?i)(?<!(?:\bnot|\bnever|n''t|\bno\s+need\s+to|\bwithout)\s+(?:\w+\s+){0,6})\b(?:request|obtain|get|need)(?:s|ed)?\s+(?:an?\s+|the\s+)?(?:SSCR\s+)?(?:object|access)\s+key\s+for\s+(?:the\s+)?(?:(?:program|module\s+pool)\s+)?SAPMV45A\b'
      - '(?i)(?<!(?:\bnot|\bnever|n''t|\bwithout|\bavoid\w*)\s+(?:\w+\s+){0,6})\b(?:insert|add|put|write|create|implement|change|modify)\b(?:(?!\bnot\b|\bnever\b|n''t\b|\binstead\b|\brather\b|USEREXIT|[.;:!?,])[^\n]){0,80}?\bBELEG_SICHERN\b'
      - '(?i)(?<!(?:\bnot|\bnever|n''t|\bno\s+need\s+to|\bwithout|\bavoid\w*|\bresist(?:\s+the\s+temptation)?\s+to|\bwrong\s+to|\binstead\s+of|\brather\s+than)\s+(?:\w+\s+){0,6})\b(?:create|add|use|implement|write|put|insert)\b(?:(?!\bnot\b|\bnever\b|n''t\b|\binstead\b|\brather\b|\bthan\b|[.;:!?])[^\n]){0,60}?\bimplicit\s+enhancement'
      - '(?i)^\s*ENDENHANCEMENT\s*\.'
      - '(?i)(?:user\s*exits?|USEREXIT_\w+|MV45AFZZ)\s*,\s*not\s+(?:an?\s+)?modifications?\b|(?:user\s*exits?|USEREXIT_\w+|MV45AFZZ)(?:\s+\w+){0,6}?\s+(?:(?:is|are)(?:\s+\w+)?\s+(?:not|never)|isn''t|aren''t|(?:do|does)\s+not\s+count\s+as)\s+(?:an?\s+)?modifications?\b'
    tags: [user-exit, sd, customizing, luw]
    validators: [abaplint]
    mock_response: |
      Target assumed: SAP ECC 6.0 EHP7 with SAP_BASIS 7.40 SP08, Standard ABAP, IBM Db2.
      Running on Azure does not change the code.

      1. Check Customizing first. An incompleteness procedure makes a field mandatory for a
         sales document type (Customizing for Sales and Distribution > Basic Functions > Log of
         Incomplete Items > Define Incompleteness Procedures, assigned to the order type in
         Assign Incompleteness Procedures), and the sales document type decides whether an
         incomplete document can be saved. Incompleteness checks whether a field is filled, not
         the net value. If the business accepts "approval number required for every ZOR order",
         this solves it without any code; confirm that with your SD consultant first.

      2. If the 10,000 EUR threshold must stay, the code option is the user exit
         USEREXIT_SAVE_DOCUMENT_PREPARE in include MV45AFZZ of program SAPMV45A. SAP's IMG
         documentation describes it as the last place to change or check a sales document
         before it is saved. Be clear about what it is: SAP classifies application user exits
         as modifications. On ECC, changing MV45AFZZ needs an SSCR object key, and the key
         becomes invalid after a release upgrade. The include appears in SPAU only when an
         upgrade delivers a new version of it, so keep it on your list of modified objects
         (SE95) and check it after every upgrade. After a later conversion to S/4HANA there are
         no SSCR keys, but the change is still a modification. If SE18 or the IMG documents a
         BAdI for checks at save time in your release, prefer that.

         Do not request an access key for SAPMV45A itself, and do not create an implicit
         enhancement in FORM BELEG_SICHERN: the user exit is the place SAP provides for this
         check.

      3. Put the rule in a class and unit test it there; keep the routine in MV45AFZZ to a few
         lines.

      ```abap
      * file: src/zcl_fa_sd_approval_rule.clas.abap
      CLASS zcl_fa_sd_approval_rule DEFINITION PUBLIC FINAL CREATE PUBLIC.
        PUBLIC SECTION.
          CONSTANTS gc_order_type TYPE vbak-auart VALUE 'ZOR'.
          CONSTANTS gc_sales_org TYPE vbak-vkorg VALUE '1000'.
          CONSTANTS gc_currency TYPE vbak-waerk VALUE 'EUR'.
          CONSTANTS gc_limit TYPE vbak-netwr VALUE '10000.00'.

          CLASS-METHODS approval_missing
            IMPORTING iv_auart          TYPE vbak-auart
                      iv_vkorg          TYPE vbak-vkorg
                      iv_netwr          TYPE vbak-netwr
                      iv_waerk          TYPE vbak-waerk
                      iv_approval       TYPE vbak-zzapproval
            RETURNING VALUE(rv_missing) TYPE abap_bool.
      ENDCLASS.

      CLASS zcl_fa_sd_approval_rule IMPLEMENTATION.
        METHOD approval_missing.
          rv_missing = abap_false.
          IF iv_auart = gc_order_type
             AND iv_vkorg = gc_sales_org
             AND iv_waerk = gc_currency
             AND iv_netwr >= gc_limit
             AND iv_approval IS INITIAL.
            rv_missing = abap_true.
          ENDIF.
        ENDMETHOD.
      ENDCLASS.
      ```

      ```abap
      * file: src/zcl_fa_sd_approval_rule.clas.testclasses.abap
      CLASS ltc_approval_rule DEFINITION FINAL FOR TESTING RISK LEVEL HARMLESS DURATION SHORT.
        PRIVATE SECTION.
          METHODS missing_at_limit FOR TESTING.
          METHODS filled_above_limit FOR TESTING.
          METHODS below_limit FOR TESTING.
      ENDCLASS.

      CLASS ltc_approval_rule IMPLEMENTATION.
        METHOD missing_at_limit.
          cl_abap_unit_assert=>assert_equals(
            act = zcl_fa_sd_approval_rule=>approval_missing( iv_auart    = 'ZOR'
                                                             iv_vkorg    = '1000'
                                                             iv_netwr    = '10000.00'
                                                             iv_waerk    = 'EUR'
                                                             iv_approval = space )
            exp = abap_true ).
        ENDMETHOD.

        METHOD filled_above_limit.
          cl_abap_unit_assert=>assert_equals(
            act = zcl_fa_sd_approval_rule=>approval_missing( iv_auart    = 'ZOR'
                                                             iv_vkorg    = '1000'
                                                             iv_netwr    = '25000.00'
                                                             iv_waerk    = 'EUR'
                                                             iv_approval = 'A-4711' )
            exp = abap_false ).
        ENDMETHOD.

        METHOD below_limit.
          cl_abap_unit_assert=>assert_equals(
            act = zcl_fa_sd_approval_rule=>approval_missing( iv_auart    = 'ZOR'
                                                             iv_vkorg    = '1000'
                                                             iv_netwr    = '9999.99'
                                                             iv_waerk    = 'EUR'
                                                             iv_approval = space )
            exp = abap_false ).
        ENDMETHOD.
      ENDCLASS.
      ```

      The routine in MV45AFZZ. This is a fragment, because it uses the global work area VBAK of
      SAPMV45A:

      ```abap
      FORM userexit_save_document_prepare.
        IF zcl_fa_sd_approval_rule=>approval_missing( iv_auart    = vbak-auart
                                                      iv_vkorg    = vbak-vkorg
                                                      iv_netwr    = vbak-netwr
                                                      iv_waerk    = vbak-waerk
                                                      iv_approval = vbak-zzapproval ) = abap_true.
          MESSAGE e001(zfa_sd).
        ENDIF.
      ENDFORM.
      ```

      4. Test the error message in dialog before you transport. In VA01 and VA02 the save runs
         while the function code is processed, outside any FIELD or CHAIN statement, so after
         the error message no field is ready for input: users report that the order screen
         becomes display-only and that they have to leave the order without saving. If that is
         not acceptable, a common approach in dialog is a type S message with DISPLAY LIKE 'E'
         followed by LEAVE TO SCREEN sy-dynnr, which skips the save and keeps the order
         editable. SAP does not document this for SAPMV45A, so test it in VA01 and VA02 on your
         release, and keep the error message for BAPI, IDoc, and batch input processing, which
         have no screen. The incompleteness procedure from step 1 avoids the problem entirely.

      5. Check the other channels. BAPI_SALESORDER_CREATEFROMDAT2 and the other SD BAPIs take
         customer fields of VBAK only through EXTENSIONIN, and ZZAPPROVAL must also be added to
         the extension structures that SAP Note 143580 describes (BAPE_VBAK, BAPE_VBAKX,
         VBAKKOZ, VBAKKOZX). IDoc inbound processing needs its own mapping. Until every
         interface that creates ZOR orders supplies the field, the check rejects those orders,
         so agree on it with the interface owners.

      6. Rules for this exit.

      COMMIT WORK and ROLLBACK WORK do not belong here. The routine runs at the start of SAP's
      save, and SAP commits once, at the end.

      CALL TRANSACTION and SUBMIT are not allowed either: the called program would commit in
      the middle of the save.

      Do not write VBAK yourself. The screen fills ZZAPPROVAL, and SAP saves it with the
      document.

      Do not put the check into USEREXIT_SAVE_DOCUMENT. That routine runs right before the
      commit and is meant for writing your own tables in the update task.

      Objects to create: message class ZFA_SD with message 001 ("Approval number required for
      orders of 10,000 EUR or more"), class ZCL_FA_SD_APPROVAL_RULE, the change to MV45AFZZ with
      its object key, the BAPI extension appends if interfaces create ZOR orders, and one
      workbench request.

      Not verified without the system: activation, the screen behavior after the message in
      your release, the message behavior in BAPI and IDoc processing, and whether your release
      offers a BAdI for this check.
    negative_responses:
      - name: commit_in_user_exit
        reason: COMMIT WORK in the save exit posts SAP's half-prepared document and breaks the logical unit of work.
        caught_by: forbidden_pattern
        response: |
          Customizing (the incompleteness procedure) cannot test the value, so use
          USEREXIT_SAVE_DOCUMENT_PREPARE in MV45AFZZ. It is a modification and needs an SSCR
          object key. The check is logged and committed right away so the log survives.

          ```abap
          * file: src/zcl_fa_sd_approval_rule.clas.abap
          CLASS zcl_fa_sd_approval_rule DEFINITION PUBLIC FINAL CREATE PUBLIC.
            PUBLIC SECTION.
              CLASS-METHODS approval_missing
                IMPORTING iv_netwr          TYPE vbak-netwr
                          iv_approval       TYPE vbak-zzapproval
                RETURNING VALUE(rv_missing) TYPE abap_bool.
          ENDCLASS.
          CLASS zcl_fa_sd_approval_rule IMPLEMENTATION.
            METHOD approval_missing.
              rv_missing = abap_false.
              IF iv_netwr >= '10000.00' AND iv_approval IS INITIAL.
                rv_missing = abap_true.
              ENDIF.
            ENDMETHOD.
          ENDCLASS.
          ```

          ```abap
