            IF zcl_fa_sd_approval_rule=>approval_missing( iv_netwr    = vbak-netwr
                                                          iv_approval = vbak-zzapproval ) = abap_true.
              INSERT zfa_approval_log FROM vbak.
              COMMIT WORK.
              MESSAGE e001(zfa_sd).
            ENDIF.
          ENDFORM.
