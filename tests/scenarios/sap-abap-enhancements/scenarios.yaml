        reason: Updating VBAK directly bypasses SAP's update logic and locks, and the next implicit database commit makes it permanent even if the save is cancelled.
        caught_by: forbidden_pattern
        response: |
          Customizing (the incompleteness procedure) cannot test the value, so use
          USEREXIT_SAVE_DOCUMENT_PREPARE in MV45AFZZ. It is a modification and needs an SSCR
          object key. Instead of stopping the user, the exit marks the order directly in VBAK.

          ```abap
