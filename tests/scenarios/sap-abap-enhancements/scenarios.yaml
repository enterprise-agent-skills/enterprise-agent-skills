      - name: no_customizing_first
        reason: The answer goes straight to code and never checks whether Customizing (the incompleteness procedure) meets the requirement.
        caught_by: expected_pattern
        response: |
          Use USEREXIT_SAVE_DOCUMENT_PREPARE in MV45AFZZ. It is a modification and needs an SSCR
          object key.

          ```abap
          * file: src/zcl_fa_sd_approval_rule.clas.abap
          CLASS zcl_fa_sd_approval_rule DEFINITION PUBLIC FINAL CREATE PUBLIC.
            PUBLIC SECTION.
              CLASS-METHODS approval_missing
                IMPORTING iv_netwr          TYPE vbak-netwr
                          iv_approval       TYPE vbak-zzapproval
                RETURNING VALUE(rv_missing) TYPE abap_bool.
          ENDCLASS.
          CLASS zcl_fa_sd_approval_rule IMPLEMENTATION.
