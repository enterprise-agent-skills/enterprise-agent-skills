  - name: ui-service-projection
    prompt: |-
      Expose my draft-enabled business object ZR_Travel as an OData V4 UI service for a
      Fiori elements list report and object page. I need the projection view, projection
      behavior definition including the draft actions and the custom action acceptTravel,
      UI annotations, and the service definition.

      Write your explanation to answer.md and each code object to its own file.
    tags:
      scenario: ui_service_projection
      labels: "service projection fiori-elements"
    golden_patch:
      inline: |
        --- /dev/null
        +++ b/answer.md
        @@ -0,0 +1,2 @@
        +After activating these objects, create service binding ZUI_Travel_O4 with binding type
