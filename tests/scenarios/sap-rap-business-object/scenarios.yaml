# yaml-language-server: $schema=../../../schemas/skill-scenarios.schema.json
# Scenarios for sap-rap-business-object. The schema is a compatible superset of the one in
# github.com/microsoft/skills. config.* is used only by optional live evaluations.

config:
  model: claude-sonnet-4.6
  max_tokens: 6000
  temperature: 0.2

# Default target for every scenario and criteria example: ABAP Cloud on S/4HANA 2023.
# The same code applies to SAP BTP ABAP environment and S/4HANA Cloud.
environment:
  product: s4hana
  release: "2023"
  language_version: cloud

scenarios:
  - name: draft_enabled_managed_bo
    description: Core stack for a draft-enabled managed business object.
    prompt: |
      Create a managed RAP business object with draft for travel requests on ABAP Cloud.
      The database table zfa_travel already exists with a UUID key and the standard admin
      fields. Give me the root view entity ZR_Travel, its behavior definition in strict
      mode 2, and the behavior pool with a validation that the end date is not before
      the begin date.
    expected_patterns:
      - "define root view entity"
      - "managed implementation in class"
      - 'strict \( 2 \)'
      - "with draft;"
      - "draft table"
      - "lock master total etag"
      - "etag master"
      - "numbering : managed"
      - "draft determine action Prepare"
      - '@Semantics\.systemDateTime\.localInstanceLastChangedAt: true'
      - "FOR BEHAVIOR OF"
    forbidden_patterns:
      - '\bCOMMIT\s+WORK\b'
      - '\bROLLBACK\s+WORK\b'
      - '@AbapCatalog\.sqlViewName'
      - '\bdefine\s+view\s+(?!entity)'
      - '-%key\b'
    tags: [basic, draft, behavior-definition]
    validators: [abaplint]
    mock_response: |
      // file: src/zr_travel.ddls.asddls
      @AccessControl.authorizationCheck: #NOT_REQUIRED
      @EndUserText.label: 'Travel'
      define root view entity ZR_Travel
        as select from zfa_travel
      {
        key travel_uuid           as TravelUUID,
            travel_id             as TravelID,
            customer_id           as CustomerID,
            begin_date            as BeginDate,
            end_date              as EndDate,
            overall_status        as OverallStatus,
            @Semantics.user.createdBy: true
            local_created_by      as LocalCreatedBy,
            @Semantics.systemDateTime.createdAt: true
            local_created_at      as LocalCreatedAt,
            @Semantics.user.localInstanceLastChangedBy: true
            local_last_changed_by as LocalLastChangedBy,
            @Semantics.systemDateTime.localInstanceLastChangedAt: true
            local_last_changed_at as LocalLastChangedAt,
            @Semantics.systemDateTime.lastChangedAt: true
            last_changed_at       as LastChangedAt
      }

      // file: src/zr_travel.bdef.asbdef
      managed implementation in class zbp_r_travel unique;
      strict ( 2 );
      with draft;

      define behavior for ZR_Travel alias Travel
      persistent table zfa_travel
      draft table zfa_travel_d
      etag master LocalLastChangedAt
      lock master total etag LastChangedAt
      authorization master ( global )
      {
        create;
        update;
        delete;

        field ( numbering : managed, readonly ) TravelUUID;
        field ( readonly ) TravelID, OverallStatus, LocalCreatedBy, LocalCreatedAt,
                           LocalLastChangedBy, LocalLastChangedAt, LastChangedAt;
        field ( mandatory ) CustomerID, BeginDate, EndDate;

        validation validateDates on save { create; field BeginDate, EndDate; }

        draft action Edit;
        draft action Activate optimized;
        draft action Discard;
        draft action Resume;
        draft determine action Prepare { validation validateDates; }

        mapping for zfa_travel
        {
          TravelUUID         = travel_uuid;
          TravelID           = travel_id;
          CustomerID         = customer_id;
          BeginDate          = begin_date;
          EndDate            = end_date;
          OverallStatus      = overall_status;
          LocalCreatedBy     = local_created_by;
          LocalCreatedAt     = local_created_at;
          LocalLastChangedBy = local_last_changed_by;
          LocalLastChangedAt = local_last_changed_at;
          LastChangedAt      = last_changed_at;
        }
      }

      * file: src/zbp_r_travel.clas.abap
      CLASS zbp_r_travel DEFINITION PUBLIC ABSTRACT FINAL FOR BEHAVIOR OF zr_travel.
      ENDCLASS.

      CLASS zbp_r_travel IMPLEMENTATION.
      ENDCLASS.

      * file: src/zbp_r_travel.clas.locals_imp.abap
      CLASS lhc_travel DEFINITION INHERITING FROM cl_abap_behavior_handler.
        PRIVATE SECTION.
          METHODS get_global_authorizations FOR GLOBAL AUTHORIZATION
            IMPORTING REQUEST requested_authorizations FOR Travel RESULT result.
          METHODS validate_dates FOR VALIDATE ON SAVE
            IMPORTING keys FOR Travel~validateDates.
      ENDCLASS.

      CLASS lhc_travel IMPLEMENTATION.
        METHOD get_global_authorizations.
          result = VALUE #( %create = if_abap_behv=>auth-allowed
                            %update = if_abap_behv=>auth-allowed
                            %delete = if_abap_behv=>auth-allowed ).
        ENDMETHOD.

        METHOD validate_dates.
          READ ENTITIES OF zr_travel IN LOCAL MODE
            ENTITY Travel
              FIELDS ( BeginDate EndDate ) WITH CORRESPONDING #( keys )
            RESULT DATA(travels).

          LOOP AT travels INTO DATA(travel).
            APPEND VALUE #( %tky        = travel-%tky
                            %state_area = 'VALIDATE_DATES' ) TO reported-travel.
            IF travel-EndDate < travel-BeginDate.
              APPEND VALUE #( %tky = travel-%tky ) TO failed-travel.
              APPEND VALUE #( %tky             = travel-%tky
                              %state_area      = 'VALIDATE_DATES'
                              %msg             = new_message_with_text(
                                                   severity = if_abap_behv_message=>severity-error
                                                   text     = 'End date must not be before begin date' )
                              %element-EndDate = if_abap_behv=>mk-on ) TO reported-travel.
            ENDIF.
          ENDLOOP.
        ENDMETHOD.
      ENDCLASS.
    negative_responses:
      - name: commit_in_handler
        reason: COMMIT WORK inside a behavior handler causes a runtime error in RAP.
        caught_by: forbidden_pattern
        response: |
          // file: src/zr_travel.bdef.asbdef
          managed implementation in class zbp_r_travel unique;
          strict ( 2 );
          with draft;
          define behavior for ZR_Travel alias Travel
          persistent table zfa_travel
          draft table zfa_travel_d
          etag master LocalLastChangedAt
          lock master total etag LastChangedAt
          authorization master ( global )
          {
            create;
            field ( numbering : managed, readonly ) TravelUUID;
            draft determine action Prepare;
          }

          * file: src/zbp_r_travel.clas.locals_imp.abap
          CLASS lhc_travel DEFINITION INHERITING FROM cl_abap_behavior_handler.
            PRIVATE SECTION.
              METHODS validate_dates FOR VALIDATE ON SAVE
                IMPORTING keys FOR Travel~validateDates.
          ENDCLASS.
          CLASS lhc_travel IMPLEMENTATION.
            METHOD validate_dates.
              COMMIT WORK.
            ENDMETHOD.
          ENDCLASS.
      - name: classic_cds_view
        reason: DDIC-based CDS views with sqlViewName cannot serve as a RAP root entity.
        caught_by: forbidden_pattern
        response: |
          // file: src/zi_travel.ddls.asddls
          @AbapCatalog.sqlViewName: 'ZVTRAVEL'
          define view ZI_Travel as select from zfa_travel
          {
            key travel_uuid as TravelUUID,
                travel_id   as TravelID
          }

  - name: validation_with_state_messages
    description: Validation that reads draft data and manages state messages.
    prompt: |
      My draft-enabled RAP business object ZR_Travel needs a validation: the end date must
      not be before the begin date. When the user corrects the dates in the draft, the
      error must disappear and both fields should be highlighted while the error exists.
      Show the behavior definition lines and the handler implementation.
    expected_patterns:
      - "validation validateDates on save"
      - "draft determine action Prepare"
      - "FOR VALIDATE ON SAVE"
      - 'READ ENTITIES OF \w+ IN LOCAL MODE'
      - "%state_area"
      - "failed-travel"
      - "reported-travel"
      - "%element-"
      - "%tky"
    forbidden_patterns:
      - '\bMESSAGE\s+[EeIiWwSsAaXx]\d{3}'
      - '\bSELECT\b[^.]*\bFROM\s+zfa_travel\b'
      - '\bCOMMIT\s+WORK\b'
      - '-%key\b'
    tags: [validation, messages, draft]
    validators: [abaplint]
    mock_response: |
      Add the validation to the behavior definition and list it in the Prepare action:

      // file: src/zr_travel.bdef.asbdef
      validation validateDates on save { create; field BeginDate, EndDate; }
      draft determine action Prepare { validation validateDates; }

      * file: src/zbp_r_travel.clas.abap
      CLASS zbp_r_travel DEFINITION PUBLIC ABSTRACT FINAL FOR BEHAVIOR OF zr_travel.
      ENDCLASS.

      CLASS zbp_r_travel IMPLEMENTATION.
      ENDCLASS.

      * file: src/zbp_r_travel.clas.locals_imp.abap
      CLASS lhc_travel DEFINITION INHERITING FROM cl_abap_behavior_handler.
        PRIVATE SECTION.
          METHODS validate_dates FOR VALIDATE ON SAVE
            IMPORTING keys FOR Travel~validateDates.
      ENDCLASS.

      CLASS lhc_travel IMPLEMENTATION.
        METHOD validate_dates.
          READ ENTITIES OF zr_travel IN LOCAL MODE
            ENTITY Travel
              FIELDS ( BeginDate EndDate ) WITH CORRESPONDING #( keys )
            RESULT DATA(travels).

          LOOP AT travels INTO DATA(travel).
            " Remove messages from earlier runs of this validation.
            APPEND VALUE #( %tky        = travel-%tky
                            %state_area = 'VALIDATE_DATES' ) TO reported-travel.

            IF travel-EndDate < travel-BeginDate.
              APPEND VALUE #( %tky = travel-%tky ) TO failed-travel.
              APPEND VALUE #( %tky               = travel-%tky
                              %state_area        = 'VALIDATE_DATES'
                              %msg               = new_message_with_text(
                                                     severity = if_abap_behv_message=>severity-error
                                                     text     = 'End date must not be before begin date' )
                              %element-BeginDate = if_abap_behv=>mk-on
                              %element-EndDate   = if_abap_behv=>mk-on ) TO reported-travel.
            ENDIF.
          ENDLOOP.
        ENDMETHOD.
      ENDCLASS.
    negative_responses:
      - name: select_active_table
        reason: SELECT on the persistent table does not see draft values, so the validation checks stale data.
        caught_by: forbidden_pattern
        response: |
          * file: src/zbp_r_travel.clas.locals_imp.abap
          CLASS lhc_travel DEFINITION INHERITING FROM cl_abap_behavior_handler.
            PRIVATE SECTION.
              METHODS validate_dates FOR VALIDATE ON SAVE
                IMPORTING keys FOR Travel~validateDates.
          ENDCLASS.
          CLASS lhc_travel IMPLEMENTATION.
            METHOD validate_dates.
              SELECT travel_uuid, begin_date, end_date FROM zfa_travel
                FOR ALL ENTRIES IN @keys WHERE travel_uuid = @keys-TravelUUID
                INTO TABLE @DATA(travels).
              LOOP AT travels INTO DATA(travel) WHERE end_date < begin_date.
                APPEND VALUE #( %tky-TravelUUID = travel-travel_uuid ) TO failed-travel.
              ENDLOOP.
            ENDMETHOD.
          ENDCLASS.
      - name: classic_message_statement
        reason: Classic MESSAGE statements bypass RAP message handling and break the Fiori UI.
        caught_by: forbidden_pattern
        response: |
          METHOD validate_dates.
            READ ENTITIES OF zr_travel IN LOCAL MODE
              ENTITY Travel FIELDS ( BeginDate EndDate ) WITH CORRESPONDING #( keys )
              RESULT DATA(travels).
            LOOP AT travels INTO DATA(travel).
              IF travel-EndDate < travel-BeginDate.
                MESSAGE e001(zfa_travel).
              ENDIF.
            ENDLOOP.
          ENDMETHOD.

  - name: ui_service_projection
    description: Projection layer and OData V4 UI service exposure.
    prompt: |
      Expose my draft-enabled business object ZR_Travel as an OData V4 UI service for a
      Fiori elements list report and object page. I need the projection view, projection
      behavior definition including the draft actions and the custom action acceptTravel,
      UI annotations, and the service definition.
    expected_patterns:
      - "provider contract transactional_query"
      - 'as projection on ZR_'
      - '@Metadata\.allowExtensions: true'
      - '^projection;'
      - "use draft;"
      - "use action Edit;"
      - "use action Activate;"
      - "use action Prepare;"
      - "use action acceptTravel;"
      - "@Metadata.layer: #CORE"
      - '@UI\.facet'
      - "define service"
      - 'expose ZC_\w+ as'
    forbidden_patterns:
      - '@OData\.publish:\s*true'
      - '@AbapCatalog\.sqlViewName'
    tags: [service, projection, fiori-elements]
    validators: [abaplint]
    mock_response: |
      After activating these objects, create service binding ZUI_Travel_O4 with binding type
      OData V4 - UI and publish it.

      // file: src/zc_travel.ddls.asddls
      @AccessControl.authorizationCheck: #NOT_REQUIRED
      @EndUserText.label: 'Travel - projection'
      @Metadata.allowExtensions: true
      @Search.searchable: true
      define root view entity ZC_Travel
        provider contract transactional_query
        as projection on ZR_Travel
      {
        key TravelUUID,
            @Search.defaultSearchElement: true
            TravelID,
            CustomerID,
            BeginDate,
            EndDate,
            OverallStatus,
            LocalLastChangedAt
      }

      // file: src/zc_travel.bdef.asbdef
      projection;
      strict ( 2 );
      use draft;

      define behavior for ZC_Travel alias Travel
      {
        use create;
        use update;
        use delete;

        use action acceptTravel;
        use action Edit;
        use action Activate;
        use action Discard;
        use action Resume;
        use action Prepare;
      }

      // file: src/zc_travel.ddlx.asddlxs
      @Metadata.layer: #CORE
      @UI.headerInfo: { typeName: 'Travel', typeNamePlural: 'Travels',
                        title: { type: #STANDARD, value: 'TravelID' } }
      annotate entity ZC_Travel with
      {
        @UI.facet: [ { id: 'Travel', purpose: #STANDARD, type: #IDENTIFICATION_REFERENCE,
                       label: 'Travel', position: 10 } ]
        @UI.hidden: true
        TravelUUID;
        @UI: { lineItem: [ { position: 10, importance: #HIGH } ],
               identification: [ { position: 10 } ],
               selectionField: [ { position: 10 } ] }
        TravelID;
        @UI: { lineItem: [ { position: 20 },
                           { type: #FOR_ACTION, dataAction: 'acceptTravel', label: 'Accept' } ],
               identification: [ { position: 20 },
                                 { type: #FOR_ACTION, dataAction: 'acceptTravel', label: 'Accept' } ] }
        OverallStatus;
      }

      // file: src/zui_travel.srvd.srvdsrv
      @EndUserText.label: 'Travel UI service'
      define service ZUI_Travel {
        expose ZC_Travel as Travel;
      }
    negative_responses:
      - name: odata_publish_annotation
        reason: '@OData.publish is the pre-RAP technique and produces no transactional draft service.'
        caught_by: forbidden_pattern
        response: |
          // file: src/zc_travel.ddls.asddls
          @AbapCatalog.sqlViewName: 'ZVTRAVELP'
          @OData.publish: true
          define view ZC_Travel as select from zfa_travel
          {
            key travel_uuid as TravelUUID,
                travel_id   as TravelID
          }
