# Generated by scripts/build.mjs from scenarios.yaml. Do not edit by hand.
# Offline: `npm run eval:vally` runs `vally oracle` (golden patches) and a baseline negative control.
# Live (optional, needs a Copilot token): see docs/testing.md.
name: sap-clean-core-check-deterministic
description: Deterministic checks for the sap-clean-core-check skill, generated from its scenarios.
version: "1.0"
type: capability
defaults:
  runs: 1
  timeout: 10m
agent_environment:
  skills:
    - ../../../../plugins/sap-abap/skills/sap-clean-core-check
grading_environment:
  files:
    - src: ../../../harness/vally-grade.mjs
      dest: .vally/grade.mjs
stimuli:
  - name: rewrite-direct-table-read
    prompt: |-
      This method runs in our new ABAP Cloud package and fails ATC because it reads VBAK.
      Rewrite it to be clean core compliant and keep the same purpose (sales documents
      created since a given date):

      SELECT vbeln, auart, kunnr FROM vbak
        WHERE erdat >= @lv_from
        INTO TABLE @DATA(orders).

      Write your explanation to answer.md and each code object to its own file.
    tags:
      scenario: rewrite_direct_table_read
      labels: "basic rewrite released-api"
    golden_patch:
      inline: |
        --- /dev/null
        +++ b/answer.md
        @@ -0,0 +1,3 @@
        +The table is not released for ABAP Cloud. Its successor in SAP's Cloudification
        +Repository is I_SalesDocument. Confirm the field names in ADT for your release, then
        +run ATC with the check "Usage of Released APIs (Cloudification Repository)".
        --- /dev/null
        +++ b/src/zcl_fa_recent_sales_docs.clas.abap
        @@ -0,0 +1,25 @@
        +CLASS zcl_fa_recent_sales_docs DEFINITION PUBLIC FINAL CREATE PUBLIC.
        +  PUBLIC SECTION.
        +    TYPES:
        +      BEGIN OF ty_document,
        +        sales_document      TYPE c LENGTH 10,
        +        sales_document_type TYPE c LENGTH 4,
        +        sold_to_party       TYPE c LENGTH 10,
        +      END OF ty_document,
        +      tt_documents TYPE STANDARD TABLE OF ty_document WITH EMPTY KEY.
        +
        +    METHODS get_documents
        +      IMPORTING from_date        TYPE d
        +      RETURNING VALUE(documents) TYPE tt_documents.
        +ENDCLASS.
        +
        +CLASS zcl_fa_recent_sales_docs IMPLEMENTATION.
        +  METHOD get_documents.
        +    SELECT SalesDocument     AS sales_document,
        +           SalesDocumentType AS sales_document_type,
        +           SoldToParty       AS sold_to_party
        +      FROM I_SalesDocument
        +      WHERE CreationDate >= @from_date
        +      INTO CORRESPONDING FIELDS OF TABLE @documents.
        +  ENDMETHOD.
        +ENDCLASS.
    graders:
      - type: run-command
        name: checks-rewrite-direct-table-read
        config:
          command: node
          args: [".vally/grade.mjs", "sap-clean-core-check", "rewrite_direct_table_read"]
          timeout: 120s
  - name: assessment-report
    prompt: |-
      Our custom code uses these SAP objects: VBAK, KNA1, BKPF, I_SALESORDER, and
      CL_ABAP_UNIT_ASSERT. Tell me which ones are released for ABAP Cloud, what to use
      instead for the others, and how you know.
    tags:
      scenario: assessment_report
      labels: "assessment report released-api"
    golden_patch:
      inline: |
        --- /dev/null
        +++ b/response.txt
        @@ -0,0 +1,15 @@
        +Source: SAP Cloudification Repository, objectReleaseInfoLatest.json
        +(https://github.com/SAP/abap-atc-cr-cv-s4hc), looked up with scripts/lookup_api_state.py.
        +
        +| Object | Type | State | Successor |
        +|---|---|---|---|
        +| VBAK | TABL | notToBeReleased | I_SALESDOCUMENT |
        +| KNA1 | TABL | notToBeReleased | I_CUSTOMER |
        +| BKPF | TABL | notToBeReleased | I_JOURNALENTRY |
        +| I_SALESORDER | DDLS | released | - |
        +| CL_ABAP_UNIT_ASSERT | CLAS | released | - |
        +
        +Replace the three table reads with the successor views and map the fields the code
        +uses. Then confirm with ATC in your system using the check "Usage of Released APIs
        +(Cloudification Repository)". The repository data is the same content that check
        +uses, so re-run the lookup if your system is on a different release.
    graders:
      - type: run-command
        name: checks-assessment-report
        config:
          command: node
          args: [".vally/grade.mjs", "sap-clean-core-check", "assessment_report"]
          timeout: 120s
scoring:
  threshold: 1.0
