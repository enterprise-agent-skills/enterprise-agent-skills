# yaml-language-server: $schema=../../../schemas/skill-scenarios.schema.json
# Scenarios for sap-clean-core-check. Release states match SAP's Cloudification Repository
# (objectReleaseInfoLatest.json, checked 2026-10-14).

config:
  model: claude-sonnet-4.6
  max_tokens: 4000
  temperature: 0.2

# Default target for every scenario and criteria example: ABAP Cloud on S/4HANA 2023.
# The same code applies to SAP BTP ABAP environment and S/4HANA Cloud.
environment:
  product: s4hana
  release: "2023"
  language_version: cloud

scenarios:
  - name: rewrite_direct_table_read
    description: Replace a direct VBAK read with the released successor view.
    prompt: |
      This method runs in our new ABAP Cloud package and fails ATC because it reads VBAK.
      Rewrite it to be clean core compliant and keep the same purpose (sales documents
      created since a given date):

      SELECT vbeln, auart, kunnr FROM vbak
        WHERE erdat >= @lv_from
        INTO TABLE @DATA(orders).
    expected_patterns:
      - "I_SalesDocument"
      - "SalesDocument"
      - "CreationDate"
    forbidden_patterns:
      - '\b[Vv][Bb][Aa][Kk]\b'
      - '##NEEDED'
      - '\bWRITE\s*[:/]'
    tags: [basic, rewrite, released-api]
    validators: [abaplint]
    mock_response: |
      The table is not released for ABAP Cloud. Its successor in SAP's Cloudification
      Repository is I_SalesDocument. Confirm the field names in ADT for your release, then
      run ATC with the check "Usage of Released APIs (Cloudification Repository)".

      * file: src/zcl_fa_recent_sales_docs.clas.abap
      CLASS zcl_fa_recent_sales_docs DEFINITION PUBLIC FINAL CREATE PUBLIC.
        PUBLIC SECTION.
          TYPES:
            BEGIN OF ty_document,
              sales_document      TYPE c LENGTH 10,
              sales_document_type TYPE c LENGTH 4,
              sold_to_party       TYPE c LENGTH 10,
            END OF ty_document,
            tt_documents TYPE STANDARD TABLE OF ty_document WITH EMPTY KEY.

          METHODS get_documents
            IMPORTING from_date        TYPE d
            RETURNING VALUE(documents) TYPE tt_documents.
      ENDCLASS.

      CLASS zcl_fa_recent_sales_docs IMPLEMENTATION.
        METHOD get_documents.
          SELECT SalesDocument     AS sales_document,
                 SalesDocumentType AS sales_document_type,
                 SoldToParty       AS sold_to_party
            FROM I_SalesDocument
            WHERE CreationDate >= @from_date
            INTO CORRESPONDING FIELDS OF TABLE @documents.
        ENDMETHOD.
      ENDCLASS.
    negative_responses:
      - name: keeps_table_read
        reason: Still reads the unreleased table, so ATC keeps failing.
        caught_by: forbidden_pattern
        response: |
          * file: src/zcl_fa_recent_sales_docs.clas.abap
          CLASS zcl_fa_recent_sales_docs DEFINITION PUBLIC FINAL CREATE PUBLIC.
            PUBLIC SECTION.
              METHODS get_documents IMPORTING from_date TYPE d.
          ENDCLASS.
          CLASS zcl_fa_recent_sales_docs IMPLEMENTATION.
            METHOD get_documents.
              SELECT vbeln, auart, kunnr FROM vbak
                WHERE erdat >= @from_date
                INTO TABLE @DATA(orders).
            ENDMETHOD.
          ENDCLASS.
      - name: pragma_suppression
        reason: A pseudo-comment hides the finding without making the code compliant.
        caught_by: forbidden_pattern
        response: |
          SELECT * FROM I_SalesDocument INTO TABLE @DATA(docs).
          SELECT * FROM vbak INTO TABLE @DATA(orders) ##NEEDED.

  - name: assessment_report
    description: Classify a list of SAP objects with states and successors from the repository data.
    prompt: |
      Our custom code uses these SAP objects: VBAK, KNA1, BKPF, I_SALESORDER, and
      CL_ABAP_UNIT_ASSERT. We are moving it to SAP S/4HANA Cloud Public Edition. Tell me
      which ones are released for ABAP Cloud, what to use instead for the others, and how you
      know.
    expected_patterns:
      - "notToBeReleased"
      - "I_SALESDOCUMENT"
      - "I_CUSTOMER"
      - "I_JOURNALENTRY"
      - 'I_SALESORDER\s*\|[^\n]*released'
      - 'CL_ABAP_UNIT_ASSERT\s*\|[^\n]*released'
      - "objectReleaseInfoLatest.json"
      - "ATC"
    forbidden_patterns:
      - 'VBAK\s*\|[^|\n]*\|\s*released\b'
      - 'KNA1\s*\|[^|\n]*\|\s*released\b'
      - 'BKPF\s*\|[^|\n]*\|\s*released\b'
    tags: [assessment, report, released-api]
    mock_response: |
      Source: SAP Cloudification Repository, objectReleaseInfoLatest.json
      (https://github.com/SAP/abap-atc-cr-cv-s4hc), looked up with scripts/lookup_api_state.py.

      | Object | Type | State | Successor |
      |---|---|---|---|
      | VBAK | TABL | notToBeReleased | I_SALESDOCUMENT |
      | KNA1 | TABL | notToBeReleased | I_CUSTOMER |
      | BKPF | TABL | notToBeReleased | I_JOURNALENTRY |
      | I_SALESORDER | DDLS | released | - |
      | CL_ABAP_UNIT_ASSERT | CLAS | released | - |

      Replace the three table reads with the successor views and map the fields the code
      uses. Then confirm with ATC in your system using the check "Usage of Released APIs
      (Cloudification Repository)". The repository data is the same content that check
      uses. This file is for S/4HANA Cloud Public Edition; for SAP BTP ABAP environment or
      S/4HANA on premises, re-run the lookup with objectReleaseInfo_BTPLatest.json or the PCE
      file of your release and feature pack stack.
    negative_responses:
      - name: claims_vbak_released
        reason: VBAK is notToBeReleased; calling it released sends the customer into a failing migration.
        caught_by: forbidden_pattern
        response: |
          | Object | Type | State | Successor |
          |---|---|---|---|
          | VBAK | TABL | released | - |
          | KNA1 | TABL | notToBeReleased | I_CUSTOMER |
          | BKPF | TABL | notToBeReleased | I_JOURNALENTRY |
          | I_SALESORDER | DDLS | released | - |
          | CL_ABAP_UNIT_ASSERT | CLAS | released | - |
          Based on objectReleaseInfoLatest.json, then confirm in ATC. I_SALESDOCUMENT is optional.
      - name: answers_from_memory
        reason: The states and successors are right, but the answer names no data source, so it cannot be verified.
        caught_by: expected_pattern
        response: |
          | Object | Type | State | Successor |
          |---|---|---|---|
          | VBAK | TABL | notToBeReleased | I_SALESDOCUMENT |
          | KNA1 | TABL | notToBeReleased | I_CUSTOMER |
          | BKPF | TABL | notToBeReleased | I_JOURNALENTRY |
          | I_SALESORDER | DDLS | released | - |
          | CL_ABAP_UNIT_ASSERT | CLAS | released | - |

          Replace the three table reads with the successor views, then confirm with ATC.
