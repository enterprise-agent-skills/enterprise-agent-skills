name: validate

# Required check for every pull request. Runs without any model credentials.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-mock:
    name: static-and-mock
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VALLY_TELEMETRY_OPTOUT: "1"
      DO_NOT_TRACK: "1"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generated files are up to date
        run: npm run build:check

      - name: Static validation (schemas, links, snippets, placeholders)
        run: npm run validate

      - name: Unit tests for the tooling
        run: npm run test:unit

      - name: Mock evaluation (reference answers, negative controls, criteria coverage)
        run: npm run eval:mock

      - name: Vally lint, oracle, and baseline (downloads the Vally CLI; no model calls)
        run: npm run eval:vally

      - name: Quality summary
        if: always()
        run: npm run report

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-reports
          path: reports/
          retention-days: 14
          if-no-files-found: warn
