name: quality-report

# Weekly repository quality report: every credential-free check plus external links.
# Results go to the job summary and an artifact. No write permissions are needed.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    name: report
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VALLY_TELEMETRY_OPTOUT: "1"
      DO_NOT_TRACK: "1"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Each check runs even if an earlier one fails, so the report is complete.
      - name: Static validation
        continue-on-error: true
        run: npm run validate

      - name: Security scan
        continue-on-error: true
        run: npm run security

      - name: Mock evaluation
        continue-on-error: true
        run: npm run eval:mock

      - name: Vally offline checks
        continue-on-error: true
        run: npm run eval:vally

      - name: External links
        continue-on-error: true
        run: npm run links:external

      - name: Quality summary
        run: npm run report

      - name: Upload reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-report
          path: reports/
          retention-days: 30
