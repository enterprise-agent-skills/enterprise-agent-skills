# Curated MCP servers that skills in this repository may reference.
#
# Rules (enforced by npm run validate):
# - Vendor-published servers (official: true) are listed here; community servers can be
#   proposed in an issue. The only other kind is a server published from this repository:
#   its code lives in plugins/<plugin>/mcp/<server>/, bundled_from_plugin names that plugin,
#   official is false, and it is reviewed like a bundled script.
# - bundle_policy "bundle" is allowed for official servers that need no credentials and for
#   servers published from this repository. The latter are read-only by default and take
#   credentials only from the agent's own prompt (user_config) or from a config file the user
#   owns outside the plugin, written by the server's setup command; nothing is stored in the
#   repository. Everything else is "document-only": plugins describe it, users install it.
# - Only the plugin named in bundled_from_plugin may list such a server in plugin.yaml.
# - Package versions are pinned (npx servers need an exact version). Update them
#   deliberately and re-verify.
# - last_verified is the date someone confirmed the source, license, and launch command.

servers:
  - id: microsoft-learn
    name: Microsoft Learn MCP Server
    vendor: microsoft
    publisher: Microsoft
    official: true
    source: https://github.com/MicrosoftDocs/mcp
    license: CC-BY-4.0 (repository content); hosted service terms apply
    description: Read-only search and fetch over official Microsoft documentation, including Microsoft Fabric and Power BI.
    transport: streamable-http
    url: https://learn.microsoft.com/api/mcp
    auth: none
    read_only_by_default: true
    bundle_policy: bundle
    last_verified: "2026-10-14"

  - id: microsoft-fabric
    name: Microsoft Fabric MCP Server
    vendor: microsoft
    publisher: Microsoft
    official: true
    source: https://github.com/microsoft/mcp/tree/main/servers/Fabric.Mcp.Server
    license: MIT
    description: Fabric API reference, item definitions, and workspace operations through the Fabric REST APIs.
    transport: stdio
    command: npx
    args: ["-y", "@microsoft/fabric-mcp@1.5.0", "server", "start", "--mode", "all"]
    auth: user-login
    read_only_by_default: false
    bundle_policy: document-only
    requirements: Node.js 22 or later. Workspace operations need a Microsoft Entra sign-in with Fabric permissions.
    last_verified: "2026-10-14"

  - id: sap-ui5
    name: UI5 MCP Server
    vendor: sap
    publisher: SAP (UI5 team)
    official: true
    source: https://github.com/UI5/mcp-server
    license: Apache-2.0
    description: UI5 API reference, project scaffolding guidance, and UI5 linter integration.
    transport: stdio
    command: npx
    args: ["-y", "@ui5/mcp-server@0.3.2"]
    auth: none
    read_only_by_default: true
    bundle_policy: bundle
    last_verified: "2026-10-14"

  - id: sap-cap
    name: CAP MCP Server
    vendor: sap
    publisher: SAP (CAP team)
    official: true
    source: https://github.com/cap-js/mcp-server
    license: Apache-2.0
    description: Search over the compiled CDS model of a CAP project and over CAP documentation.
    transport: stdio
    command: npx
    args: ["-y", "@cap-js/mcp-server@0.0.6"]
    auth: none
    read_only_by_default: true
    bundle_policy: bundle
    requirements: Run inside a CAP project folder.
    last_verified: "2026-10-14"

  - id: sap-system
    name: SAP system MCP server
    vendor: sap
    publisher: Enterprise Agent Skills contributors
    official: false
    source: https://github.com/enterprise-agent-skills/enterprise-agent-skills/tree/main/plugins/sap-abap/mcp/sap-system
    license: MIT
    description: >-
      Read-only access to your own SAP ABAP system (SAP ECC, SAP S/4HANA, or the ABAP Platform
      trial) over ADT REST and OData v2 with your SAP user: installed release and software
      components, object search, table definitions and rows, source code, packages, and OData
      services. The skills use the release it reports to pick the syntax level.
    transport: stdio
    command: node
    bundled_from_plugin: sap-abap
    plugin_path: mcp/sap-system/launch.mjs
    plugin_args: ["serve"]
    setup_args: ["setup"]
    setup_notes: >-
      It tests the connection and writes the values to `%APPDATA%\enterprise-agent-skills\sap-system.env`
      on Windows or to `$XDG_CONFIG_HOME/enterprise-agent-skills/sap-system.env` (by default
      `~/.config/enterprise-agent-skills/sap-system.env`) elsewhere, outside the plugin folder.
      Environment variables (`SAP_URL`, `SAP_USER`, `SAP_PASSWORD`, `SAP_CLIENT`, `SAP_LANGUAGE`)
      take precedence over that file, and `SAP_SYSTEM_MCP_ENV` names a different file.
    data_access: >-
      It connects only to the SAP URL you configure, with your own SAP user and password, and
      sends data to no other host. It is read-only by default: it blocks every HTTP verb that
      could change the system, blocks free SQL, validates object names against SAP naming rules,
      filters WHERE clauses, and limits rows (500 by default). Your credentials never appear in
      tool results. Prefer an HTTPS URL; use http:// only for a trial system on the same machine.
    auth: system-credentials
    read_only_by_default: true
    bundle_policy: bundle
    requirements: >-
      It needs Python 3.10 or later with the mcp (2.x) and httpx packages (the launcher prints
      the pip command when they are missing) and network access from your machine to the SAP
      system's ICM port, for example 44300 for HTTPS or 50000 for the trial's HTTP.
    user_config:
      sap_url:
        title: SAP system URL
        description: ICM URL of the ABAP system, for example https://host:44300 or http://localhost:50000 for the trial. Prefer HTTPS.
        type: string
        required: true
        env: SAP_URL
      sap_user:
        title: SAP user
        description: User name for the ABAP system. A read-only user is enough.
        type: string
        required: true
        env: SAP_USER
      sap_password:
        title: SAP password
        description: Password of that user. Stored in the agent's secure credential store, never in the plugin.
        type: string
        required: true
        sensitive: true
        env: SAP_PASSWORD
      sap_client:
        title: SAP client
        description: Client number, for example 001.
        type: string
        default: "001"
        env: SAP_CLIENT
      sap_language:
        title: Logon language
        description: Two-letter logon language, for example EN.
        type: string
        default: EN
        env: SAP_LANGUAGE
    last_verified: "2026-10-22"

  - id: sap-fiori
    name: SAP Fiori MCP Server
    vendor: sap
    publisher: SAP (open-ux-tools)
    official: true
    source: https://github.com/SAP/open-ux-tools/tree/main/packages/fiori-mcp-server
    license: Apache-2.0
    description: Generate and modify SAP Fiori elements applications with Fiori tools.
    transport: stdio
    command: npx
    args: ["--yes", "@sap-ux/fiori-mcp-server@1.15.6", "fiori-mcp"]
    auth: none
    read_only_by_default: false
    bundle_policy: document-only
    requirements: Changes project files. Use in a Git-tracked workspace.
    last_verified: "2026-10-14"

  - id: salesforce-dx
    name: Salesforce DX MCP Server
    vendor: salesforce
    publisher: Salesforce
    official: true
    source: https://github.com/salesforcecli/mcp
    license: Apache-2.0
    description: Org, metadata, data, and Apex test operations through the Salesforce CLI.
    transport: stdio
    command: npx
    args: ["-y", "@salesforce/mcp@0.30.15", "--orgs", "DEFAULT_TARGET_ORG", "--toolsets", "orgs,metadata,data,users"]
    auth: user-login
    read_only_by_default: false
    bundle_policy: document-only
    requirements: Salesforce CLI with an authorized org (sf org login web). Use a scratch org or sandbox.
    last_verified: "2026-10-14"
