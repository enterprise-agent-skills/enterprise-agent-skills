name: microsoft-fabric
display_name: Lakehouse data engineering skills for Microsoft Fabric
version: 0.1.0
description: >-
  Skills for data engineering in Microsoft Fabric: incremental, idempotent loads into Lakehouse
  Delta tables from notebooks, with secrets from Azure Key Vault and routine table maintenance.
  Bundles the read-only Microsoft Learn MCP server for current documentation.
long_description: >-
  Guidance is grounded in Microsoft Learn documentation for Fabric Data Engineering (checked
  2026-10-14). Every Python sample is parsed in the tests, and each scenario includes known-bad
  answers, such as full-table overwrites or hardcoded passwords, that the tests must reject.
vendor: microsoft
category: data-engineering
keywords: [microsoft, fabric, lakehouse, delta-lake, pyspark, notebooks, onelake, data-engineering]
maturity: beta
mcp_servers: [microsoft-learn]
upstream:
  microsoft_skills: candidate
  notes: >-
    Structure follows github.com/microsoft/skills. That repository focuses on Azure SDK and
    Foundry skills, so confirm with its maintainers in an issue before opening a pull request.
