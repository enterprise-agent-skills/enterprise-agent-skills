# Single source of repository-wide settings. Generators read this file; do not
# duplicate these values elsewhere. Run `npm run build` after editing.

repository:
  name: enterprise-agent-skills
  # GitHub organization that owns the repository. Install commands, marketplace files, and
  # links are generated from it.
  owner: enterprise-agent-skills
  default_branch: main
  license: MIT
  marketplace_name: enterprise-agent-skills
  marketplace_display_name: Enterprise Agent Skills
  description: >-
    Vendor-neutral Agent Skills and plugins for enterprise platforms, with
    acceptance criteria and credential-free tests for every skill.
  maintainers_contact: maintainers listed in GOVERNANCE.md

tooling:
  # Pinned so local runs and CI produce the same results.
  vally_cli_version: 0.19.0
  node_version: "22"

vendors:
  - id: sap
    name: SAP
  - id: microsoft
    name: Microsoft
  - id: salesforce
    name: Salesforce
  - id: aws
    name: Amazon Web Services
  - id: google-cloud
    name: Google Cloud
  - id: servicenow
    name: ServiceNow
  - id: workday
    name: Workday
  - id: snowflake
    name: Snowflake
  - id: databricks
    name: Databricks
  - id: oracle
    name: Oracle
  - id: vendor-neutral
    name: Vendor-neutral

categories:
  - id: development
    name: Development
  - id: integration
    name: Integration
  - id: data-engineering
    name: Data engineering and analytics
  - id: architecture
    name: Architecture and governance
  - id: quality
    name: Code quality and review
  - id: migration
    name: Migration and modernization
  - id: administration
    name: Administration and operations
  - id: security
    name: Security and compliance

maturity_levels:
  - id: experimental
    description: Early draft. Structure validated, acceptance tests may be incomplete.
  - id: beta
    description: Acceptance criteria and mock evaluations pass. Not yet verified against a live system.
  - id: stable
    description: Beta requirements plus at least one recorded live-system or live-model verification.
  - id: deprecated
    description: Kept for reference. Do not use for new work.

platforms:
  - id: claude-code
    name: Claude Code
  - id: claude-cowork
    name: Claude Cowork and claude.ai
  - id: github-copilot-cli
    name: GitHub Copilot CLI
  - id: github-copilot-vscode
    name: GitHub Copilot in VS Code
  - id: openai-codex
    name: OpenAI Codex
  - id: cursor
    name: Cursor
  - id: gemini-cli
    name: Gemini CLI
  - id: agent-skills-compatible
    name: Other Agent Skills compatible agents
